name: mstpd

# Builds mstpd (GPL-2.0-or-later, github.com/mstpd/mstpd), the Linux daemon for
# rapid spanning tree, from upstream source at the release winlab pins
# (winlab/mstpd.py: VERSION and COMMIT) as static Linux x86-64 programs
# (mstpd and mstpctl, Alpine's musl), and publishes them with the complete
# corresponding source, the licence and a NOTICE as the release asset winlab
# fetches at preparation:
#   release mstpd-<version>-<short sha>, asset mstpd-<version>-<short sha>.tar.gz
# While winlab/mstpd.py pins no SHA-256 (ASSET_SHA256 = ""), the first run
# publishes and prints the digest to pin. Once one is pinned the job refuses to
# publish anything else, so what customers download is what the code checks for.
# Run by hand only (Actions > mstpd > Run workflow).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (off: build and print the digest only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mstpd
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The pinned release and digest
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import winlab.mstpd as m
          print(f"commit={m.COMMIT}")
          print(f"short={m.SHORT}")
          print(f"version={m.VERSION}")
          print(f"tag={m.TAG}")
          print(f"asset={m.ASSET}")
          print(f"sha256={m.ASSET_SHA256}")
          print(f"upstream={m.UPSTREAM}")
          print(f"alpine={m.ALPINE}")
          PY

      - name: Source at the pinned release
        run: |
          git init -q mstpd
          git -C mstpd fetch -q --depth 1 "${{ steps.pin.outputs.upstream }}" "${{ steps.pin.outputs.commit }}"
          git -C mstpd checkout -q FETCH_HEAD
          test "$(git -C mstpd rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
          git -C mstpd archive --format=tar --prefix="mstpd-${{ steps.pin.outputs.version }}/" HEAD | gzip -n -9 > "mstpd-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.short }}-source.tar.gz"
          test -f mstpd/LICENSE

      - name: Build static programs in Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ steps.pin.outputs.alpine }}" sh -euxc '
            apk add --no-cache build-base autoconf automake libtool pkgconf linux-headers file
            mkdir -p /tmp/m && tar -xzf mstpd-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.short }}-source.tar.gz -C /tmp/m --strip-components=1
            cd /tmp/m
            ./autogen.sh
            ./configure --prefix=/usr
            make -j"$(nproc)" LDFLAGS=-all-static
            strip mstpd mstpctl
            mkdir -p /w/build && cp mstpd mstpctl /w/build/
            file /w/build/mstpd /w/build/mstpctl
            if readelf -d /w/build/mstpd /w/build/mstpctl | grep -q NEEDED; then echo "not static"; exit 1; fi
            /w/build/mstpd -V
            /w/build/mstpctl --help | head -n 3
          '

      - name: Pack it (programs, LICENSE, NOTICE, complete source) and check the digest
        run: |
          python tools/pack_mstpd.py --bin build \
            --src "mstpd-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.short }}-source.tar.gz" \
            --license mstpd/LICENSE --out "${{ steps.pin.outputs.asset }}"
          got="$(sha256sum "${{ steps.pin.outputs.asset }}" | cut -d' ' -f1)"
          echo "sha256 $got"
          echo "::notice::mstpd pack SHA-256 $got (pin it as ASSET_SHA256 in winlab/mstpd.py)"
          pinned="${{ steps.pin.outputs.sha256 }}"
          if [ -n "$pinned" ] && [ "$got" != "$pinned" ]; then
            echo "::error::the pack's SHA-256 is $got, winlab/mstpd.py pins $pinned: not published."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pin.outputs.tag }}
          path: ${{ steps.pin.outputs.asset }}

      - name: Publish the release
        # Published from rdiol12/winlablite only: that repository is public, so a
        # customer's PC can download the asset; a run in rdiol12/winlab builds only.
        if: ${{ inputs.publish && github.repository == 'rdiol12/winlablite' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.pin.outputs.tag }}"
          notes="mstpd ${{ steps.pin.outputs.version }} (GPL-2.0-or-later) built from ${{ steps.pin.outputs.upstream }} at ${{ steps.pin.outputs.commit }}, unmodified, as static Linux x86-64 programs (mstpd, mstpctl) in ${{ steps.pin.outputs.alpine }}. The archive carries LICENSE, a NOTICE and the complete corresponding source. winlab fetches it at preparation so the lab router runs rapid spanning tree (802.1w) for the switches."
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ -z "${{ steps.pin.outputs.sha256 }}" ]; then
              echo "::error::release $tag exists and winlab/mstpd.py pins no digest yet: pin the first build's SHA-256 instead of replacing it."
              exit 1
            fi
            gh release upload "$tag" "${{ steps.pin.outputs.asset }}" --clobber
          else
            gh release create "$tag" "${{ steps.pin.outputs.asset }}" --title "mstpd ${{ steps.pin.outputs.version }} (${{ steps.pin.outputs.short }})" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          fi
