name: release

# Builds the winlab trial's installer (winlab-core-<version>-setup.exe) and
# the portable zip, and attaches both to a GitHub release:
#   - publish a release on the Releases page (any tag, e.g. v0.2.0): the
#     files are added to that release when the build finishes;
#   - or push a tag core-v<version>: the release is created with them;
#   - or run it by hand (Actions > release > Run workflow): the files are
#     kept as the run's artifact, and attached to the release whose tag you
#     type, if you type one (to rebuild a release from the latest main).
# No secrets are needed; a code-signing certificate is used when set
# (WINLAB_SIGN_PFX_BASE64, WINLAB_SIGN_PASSWORD; see packaging/sign.ps1).
on:
  release:
    types: [published]
  push:
    tags: ["core-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the files to this existing release (its tag, e.g. v0.2.0); empty: artifact only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        shell: bash
        run: |
          code="$(python -c 'import winlab; print(winlab.__version__)')"
          echo "version=$code" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#core-}"; tag="${tag#v}"
            if [ "$tag" != "$code" ]; then
              echo "::warning::the tag $GITHUB_REF_NAME is not winlab's version $code (winlab/__init__.py); the files are named for $code"
            fi
          fi

      - name: Unit tests
        run: python tests/test_winlab.py

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' } }

      - name: Build winlab core and its installer
        shell: pwsh
        env:
          WINLAB_SIGN_PFX_BASE64: ${{ secrets.WINLAB_SIGN_PFX_BASE64 }}
          WINLAB_SIGN_PASSWORD: ${{ secrets.WINLAB_SIGN_PASSWORD }}
        # In this pwsh (PowerShell 7), as the winlab CI runs it: Windows
        # PowerShell 5.1 turns a native command's stderr into an error.
        run: .\packaging\build-exe.ps1 -Edition core

      - name: The exe is winlab core
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'core-smoke'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item dist\winlab.exe $d
          $labs = & "$d\winlab.exe" lab list
          $labs
          if (-not ($labs -match 'ad-ds-basics')) { throw 'the core lab is missing' }
          foreach ($lab in 'firewall-by-hand', 'router-protocols') { if (-not ($labs -match $lab)) { throw "the trial lab $lab is missing" } }
          if (($labs | Select-String -Pattern '^\s+\S+\s+\d+ nodes').Count -ne 3) { throw 'the trial lists other than its three labs' }

      - name: Keep the files with the run
        uses: actions/upload-artifact@v4
        with:
          name: winlab-trial-${{ steps.ver.outputs.version }}
          path: |
            dist/winlab-core-${{ steps.ver.outputs.version }}-setup.exe
            dist/winlab-core-${{ steps.ver.outputs.version }}-win64.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.release }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release upload "$TAG" --clobber "dist/winlab-core-$v-setup.exe" "dist/winlab-core-$v-win64.zip"

      - name: Release notes from the tag message
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          [ -s release-notes.md ] || echo "winlab trial ${{ steps.ver.outputs.version }}" > release-notes.md

      - name: Create the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" --title "winlab trial $v" --notes-file release-notes.md \
            "dist/winlab-core-$v-setup.exe" "dist/winlab-core-$v-win64.zip"
