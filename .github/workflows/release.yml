name: release

# Builds the winlab trial's installer (winlab-core-<version>-setup.exe) and
# the portable zip, and attaches both to a GitHub release:
#   - publish a release on the Releases page (any tag, e.g. v0.2.0): the
#     files are added to that release when the build finishes;
#   - or push a tag core-v<version>: the release is created with them;
#   - or run it by hand (Actions > release > Run workflow): the files are
#     kept as the run's artifact, and attached to the release whose tag you
#     type, if you type one (to rebuild a release from the latest main).
# The version is the release's tag: 1.2.1, v1.2.1 or core-v1.2.1 builds winlab
# 1.2.1 (winlab/__init__.py is written before anything is built, and main is
# brought to the same version afterwards), so nothing is raised by hand. A
# release whose tag is not a version (a published build of something else,
# such as qemu-whpx-reset-11.1.3) is left alone.
# No secrets are needed; a code-signing certificate is used when set
# (WINLAB_SIGN_PFX_BASE64, WINLAB_SIGN_PASSWORD; see packaging/sign.ps1).
on:
  release:
    types: [published]
  push:
    tags: ["core-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the files to this existing release (its tag, e.g. v0.2.0); empty: artifact only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: What the tag says
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TYPED: ${{ inputs.release }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then tag="$TYPED"; else tag="$GITHUB_REF_NAME"; fi
          v="${tag#core-}"; v="${v#v}"
          if printf '%s' "$v" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
            echo "winlab trial $v"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "version=" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
            echo "a build by hand, at the version in winlab/__init__.py"
          else
            echo "version=" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the tag $tag is not a winlab version: nothing to build for this release"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        shell: bash
        env:
          WANT: ${{ needs.plan.outputs.version }}
        run: |
          if [ -n "$WANT" ]; then python tools/set_version.py "$WANT"; fi
          code="$(python -c 'import winlab; print(winlab.__version__)')"
          echo "version=$code" >> "$GITHUB_OUTPUT"
          echo "building winlab trial $code"

      - name: Unit tests
        # One group at a time: the drive-bay and media groups each write
        # gigabytes of disk images, and two at once fill the hosted runner.
        env:
          WINLAB_TEST_JOBS: "1"
        run: python tests/test_winlab.py

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' } }

      - name: Build winlab core and its installer
        shell: pwsh
        env:
          WINLAB_SIGN_PFX_BASE64: ${{ secrets.WINLAB_SIGN_PFX_BASE64 }}
          WINLAB_SIGN_PASSWORD: ${{ secrets.WINLAB_SIGN_PASSWORD }}
        # In this pwsh (PowerShell 7), as the winlab CI runs it: Windows
        # PowerShell 5.1 turns a native command's stderr into an error.
        run: .\packaging\build-exe.ps1 -Edition core

      - name: The exe is winlab core
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'core-smoke'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item dist\winlab.exe $d
          $labs = & "$d\winlab.exe" lab list
          $labs
          if (-not ($labs -match 'ad-ds-basics')) { throw 'the core lab is missing' }
          foreach ($lab in 'firewall-by-hand', 'router-protocols') { if (-not ($labs -match $lab)) { throw "the trial lab $lab is missing" } }
          if (($labs | Select-String -Pattern '^\s+\S+\s+\d+ nodes').Count -ne 3) { throw 'the trial lists other than its three labs' }

      - name: Keep the files with the run
        uses: actions/upload-artifact@v4
        with:
          name: winlab-trial-${{ steps.ver.outputs.version }}
          path: |
            dist/winlab-core-${{ steps.ver.outputs.version }}-setup.exe
            dist/winlab-core-${{ steps.ver.outputs.version }}-win64.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.release }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release upload "$TAG" --clobber "dist/winlab-core-$v-setup.exe" "dist/winlab-core-$v-win64.zip"

      - name: Release notes from the tag message
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          [ -s release-notes.md ] || echo "winlab trial ${{ steps.ver.outputs.version }}" > release-notes.md

      - name: Create the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" --title "winlab trial $v" --notes-file release-notes.md \
            "dist/winlab-core-$v-setup.exe" "dist/winlab-core-$v-win64.zip"

      - name: Bring main to the released version
        # The tag was made before the version was written; main gets it now,
        # so the repository says what the last release was. Never fails the
        # release: the files are already attached.
        if: needs.plan.outputs.version != '' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ needs.plan.outputs.version }}
        run: python tools/set_version.py "$WANT" --push "${{ github.repository }}" "${{ github.event.repository.default_branch }}"
