[topic]
id = "agent-not-answering"
title = "Check my work says it cannot reach a machine"
category = "Common problems"
order = 60
keywords = ["agent", "serial", "check my work", "cannot reach", "not answering", "grade", "channel", "timeout", "guest"]
summary = "Grading talks to a small agent inside each machine. Here is why it may not answer."
body = '''
Check my work, scenarios, sending files and the command prompt's `winlab exec` all talk to winlab's agent inside the machine, over a private serial cable that never touches a network.

- **The machine is still starting.** The agent answers once Windows has started its services, a minute or two after the sign-in screen appears. Try again then.
- **It is installing or restarting.** A machine that restarts in the middle of a check (after a domain join or a promotion, for example) answers again when it is back up.
- **It was installed by hand.** A machine you installed yourself from an ISO has no agent. The Guide offers Insert the check disc for it: a small disc with winlab's agent. Run RUN-ME on that disc as administrator, once.
- **It is suspended or off.** Start it in Machines.

To test the agent from a command prompt: `winlab exec <machine> --lab <lab> -- hostname`
'''
