summary = "The security-ops lab's tools come on sticks you write from the media shelf; you install and configure every one inside the machines."
body = '''
The **security-ops** lab is the defender's routine: event forwarding, a SIEM, a vulnerability scanner, security baselines, software deployment and a daily report. Nothing is installed for you. Everything from outside winlab is fetched on this PC, checked, and carried in on a stick.

**What to fetch first**

Setup lists the steps for the lab, or run `winlab secops status` to see what is on this PC.

- the **wazuh** pack: Wazuh's manager, indexer, dashboard and Filebeat, with the Windows agent of the same release (`winlab packs fetch wazuh`; it needs the Ubuntu image first)
- **Greenbone Community Edition**: the images its compose file names, feed data included, pinned by digest, a few GB (`winlab secops fetch greenbone`)
- the **software to deploy**: 7-Zip's MSI and Chocolatey's own package, pinned and checked (`winlab secops fetch software`)
- Microsoft's **Security Compliance Toolkit**: you download it yourself from Microsoft (a baseline, LGPO.zip and PolicyAnalyzer.zip) into your Downloads folder. winlab finds the zips and never ships them.

**Getting them into the lab**

On the media shelf, **Software stick**, **SCT stick**, **Wazuh agent stick** and **Greenbone stick** each write a new stick (Greenbone needs several). Drag a stick onto a machine, then follow its README.txt inside the machine. The pack sticks for siem01, scan01 and mail01 come from the packs as usual.

**Only your own machines**

The scanner scans this lab's machines and nothing else: the lab has no route anywhere else. There is no attack tool in the lab.
'''
