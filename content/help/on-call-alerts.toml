[topic]
id = "on-call-alerts"
title = "On-call alerts and the pager"
category = "Using winlab"
order = 42
keywords = ["alert", "alerts", "on call", "pager", "page", "rota", "escalate", "escalation", "acknowledge", "ack", "night shift", "monitoring", "phone", "incident"]
summary = "The lab's monitoring: alerts with a severity and a ticket, mail to your lab mailbox, the phone at night, acknowledge and escalate."
body = '''
The lab watches itself while the desktop runs. Open **On-call alerts** from the Start menu, or click the bell in the tray.

- An alert has a severity (P1 critical to P4 information), the machine, the time it started on the lab clock, and a helpdesk ticket.
- Sources: the meters (CPU, memory, disk latency, links, cable errors), power (a machine off unexpectedly, or hung), the UPS, disks (failing, dead, nearly full), certificates about to expire, clocks more than five minutes off, and the Windows services a machine's roles need. Turn any of them off on the **Sources** tab.
- When the lab has a mail server and your mailbox exists on it, each alert also arrives as a mail there: read it in Thunderbird or Roundcube on a lab PC.
- Out of hours (the **On-call rota** tab: 18:00 to 08:00 and weekends by default, on the lab clock) a P1 or P2 rings the desk phone of whoever is on call, when the lab has a phone system. Nobody answers within the rota's minutes and the next person is called.
- **Acknowledge** (in the window, on the pager toast, by answering the phone, or `winlab alerts ack <id>`) stops the escalation. It fixes nothing: the alert stays until the check passes and the ticket stays open.
- When the problem clears, the alert moves to History and its ticket gets a Recovered note. Write the **incident note** on it: what broke, why, what you did.
- **Send test page** checks every way the monitoring can reach you. The **Night shift** tab moves the lab clock to 02:00 and breaks something for real: take the page, fix it, write the note.

From a command prompt: `winlab alerts list`, `winlab alerts ack <id>`, `winlab alerts note <id> <text>`, `winlab alerts tick`, `winlab alerts rota`, `winlab alerts rota set phone admin 102`, `winlab alerts test` and `winlab alerts drill start`.
'''
