[topic]
id = "labs-and-lessons"
title = "Labs and lessons"
category = "Using winlab"
order = 10
keywords = ["lab", "lesson", "exercise", "check my work", "grade", "guide", "module", "progress", "foundation", "quiz"]
summary = "How labs, lessons and Check my work fit together."
body = '''
A **lab** is a whole network: its machines, its switches and the lab router. The Start menu lists the labs. Switching the desktop to another lab leaves running machines running.

A **lesson** is one job inside a lab. Open the Lab guide to see the lessons in order. Each one says why it matters, what to do, which machines it needs and how much memory they take.

- **Start these machines** boots only the machines the lesson uses, plus the domain controller they depend on.
- Every lab has a **foundation** lesson first: its machines are fresh installs, and you give them addresses, build the domain and join the members yourself.
- **Check my work** runs small checks inside the machines and says which parts pass. It never changes anything.
- Lessons end with a few recall questions, and your progress is kept on this PC.

From a command prompt: `winlab learn list`, `winlab learn show <lesson>`, `winlab learn start <lesson>` and `winlab exercise grade <exercise>`.
'''
