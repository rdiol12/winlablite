[topic]
id = "contact-support"
title = "Contact support"
category = "Support"
order = 10
keywords = ["support", "contact", "email", "help", "bug", "problem", "logs", "support file", "bundle", "zip", "report"]
summary = "Make a support file and send it to us with a few words on what happened."
action = "support-bundle"
body = '''
If something does not work and the other topics did not help, write to us. A support file lets us see what happened on this PC.

**Make a support file** below collects, in one zip:

- the checks winlab doctor runs, winlab's version, Windows, Python and QEMU versions
- the labs and the state of their machines
- the last part of each machine's log and of the base preparation logs
- winlab's own settings, with secrets taken out

It never contains disk images, ISOs, USB sticks, lab passwords, your product key or license, or your own files. The zip stays on this PC until you attach it to an email yourself.

From a command prompt: `winlab doctor --bundle`
'''
