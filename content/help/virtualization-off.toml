[topic]
id = "virtualization-off"
title = "Virtualization is off, or machines are very slow"
category = "Common problems"
order = 10
keywords = ["virtualization", "vt-x", "amd-v", "svm", "bios", "uefi", "firmware", "slow", "hypervisor platform", "whpx", "tcg", "acceleration", "kvm"]
summary = "Machines need the processor's virtualization support, and Windows' Hypervisor Platform."
body = '''
Without hardware virtualization a machine still starts, but it runs many times slower and Windows can take hours to install. Setup says which of these two is missing.

**Virtualization is off in the PC's firmware**

1. Restart the PC into its firmware settings (UEFI or BIOS). On Windows: Settings, System, Recovery, Advanced startup, Restart now, then Troubleshoot, Advanced options, UEFI Firmware Settings.
2. Turn on the setting called Intel Virtualization Technology (VT-x), SVM Mode or AMD-V. Its place differs by maker; it is often under Advanced or CPU Configuration.
3. Save, exit, and open winlab again.

**Windows Hypervisor Platform is off**

Setup offers **Turn it on**. Windows asks for permission, and the PC needs a restart to finish.

Check from a command prompt with `winlab doctor`: look for the lines about virtualization and the verdict on acceleration.
'''
