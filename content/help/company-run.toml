[topic]
id = "company-run"
title = "A company run, the start of shift and wear"
category = "Using winlab"
order = 47
keywords = ["company", "long-running", "weeks", "wear", "wear level", "start of shift", "morning", "checklist", "backup report", "evaluation", "licence", "journal", "uptime", "next day", "save", "resume"]
summary = "One lab for weeks of lab time: servers that wear out on their own, a morning report and checklist, a weekly plan and a journal of the days."
body = '''
Open **Company** from the Start menu or the desktop.

**Wear** (the Wear tab, or `winlab wear <lab> level gentle|realistic|harsh`). With wear on, things wear out on the lab clock without anyone doing it: a volume fills, the web server's logs eat C:, a certificate expires, the NAS that takes the backups fills up, a domain controller's clock drifts, a service crashes after the night's updates, the print queue jams, a data disk starts failing, and the Windows evaluation licence runs down. Only what you have built wears out (each machine is asked first), and only on machines that are running. Monitoring raises an alert and a ticket, or the person it hurts rings the helpdesk; resolving the ticket checks the machine. Wear is **off** for lessons unless you turn it on. Each lab has its own seed, so the same lab wears the same way.

**Start of shift** opens on its own each working morning of a company run (or from the Start menu, or `winlab shift start <lab>`). It reads every running machine once, without changing anything: the night's alerts, last night's Windows Server Backup result as the server reports it, the ticket queue with its SLAs, what wore out, evaluation licence days left (what slmgr /dlv shows), free space on every server volume and each clock against lab time. Tick the checklist as you work it; **Check my checklist** reads the machines again and says which items hold. The handover is a line starting with today's date in the Notes window.

**A company run** (the Today tab, or `winlab company start <lab> --weeks 4 --wear realistic`) keeps one lab going for weeks: wear on, the helpdesk taking calls in business hours, the office's staff at work, and each week a plan: this lab's lessons you have not done yet, one of its problems, and maintenance read on the machines. **Next day** closes the day in the journal (tickets, SLA met, incidents, wear, service uptime, the morning checklist) and moves the lab clock to the next working morning; the night's wear happens on the way. **Save for today** pauses the clock and stops the calls (nothing is undone), optionally with a checkpoint of every disk; **Resume** carries on. The disks are kept the whole time; a machine rebuilt from its image with `lab reset` shows in the journal, because what was built on it is gone.

From a command prompt: `winlab wear <lab> status|level|tick|clear`, `winlab shift start|check|show <lab>`, `winlab shift tick <lab> <item>`, and `winlab company start|status|next|plan|save|resume|stop <lab>`.
'''
