# The command reference: every command the lessons use, one line on what it
# does. winlab/commands.py finds where each one appears (lesson steps, the
# commands a lesson runs to show its result, concepts and pitfalls) and the
# desktop's Command reference window and `winlab commands` search it.
#
# Every PowerShell cmdlet a lesson names must be listed here; the test suite
# checks it, so a new lesson cannot add an unexplained cmdlet. Tools that are
# not cmdlets are listed by hand under their platform.
#
#   [powershell]  cmdlets (Verb-Noun), Windows PowerShell 5.1 and later
#   [windows]     Windows programs and consoles (repadmin, w32tm, gpresult...)
#   [linux]       Ubuntu and Alpine commands (realm, systemctl, tcpdump...)
#   [firewall]    the OPNsense / pf shell on the perimeter firewall
#   [sql]         SQL Server tools and statements
#   [cloud]       Azure command-line tools
#   [match]       a regular expression for a name that is also an English word,
#                 so 'id' matches 'id Administrator' and not 'the lesson id'

[powershell]
"Get-ComputerRestorePoint" = "Lists the restore points on this PC: sequence number, description, type and creation time (WMI date)."
"Checkpoint-Computer" = "Makes a System Restore point (-Description, -RestorePointType MODIFY_SETTINGS or APPLICATION_INSTALL); at most one a day by default."
"Export-WindowsDriver" = "Copies the third-party drivers of a Windows installation (-Online for this one) into a folder, ready for pnputil /add-driver or a reinstall."
"Get-MpThreatDetection" = "Microsoft Defender: what it detected on this PC, when, and what it did about it."
"Update-MpSignature" = "Microsoft Defender: fetches new security intelligence (from Windows Update, WSUS or a file share, as configured)."
"Set-NetIPInterface" = "Changes an interface's IP settings: -Dhcp Enabled or Disabled, the metric, forwarding (-InterfaceIndex or -InterfaceAlias, -AddressFamily)."
"Get-Member" = "Shows what an object really is: its type name, properties and methods (Get-Service | Get-Member)."
"Get-Verb" = "Lists PowerShell's approved verbs (Get, New, ConvertTo, Invoke...) for naming your own functions."
"Write-Host" = "Writes text to the screen only: nothing goes down the pipeline, so a function's results must not use it."
"Test-ModuleManifest" = "Checks a module manifest (.psd1) and the files it names; returns the module it describes."
"Get-Module" = "Lists the modules loaded in the session, or with -ListAvailable every module PowerShell can find in $env:PSModulePath."
"Invoke-Pester" = "Runs the Pester tests (*.Tests.ps1) under a folder and reports passed and failed; -PassThru returns the counts."
"Update-ModuleManifest" = "PowerShellGet: changes values in an existing module manifest, such as ModuleVersion or FunctionsToExport."
"New-ItemProperty" = "Creates a value under a registry key (-Path, -Name, -Value, -PropertyType)."
"Add-Type" = "Loads a .NET assembly (-AssemblyName System.Web) or compiles C# into the session."
"New-TimeSpan" = "Makes a time span (-Minutes 15, -Hours 1), for repetition intervals, time-outs and date arithmetic."
"Stop-Transcript" = "Ends the transcript Start-Transcript began and closes its file."
"ConvertTo-CorpSamAccountName" = "Your function from the PowerShell track (module CorpTools): a person's name to the company's logon name, accents removed, a to z only, 20 characters at most."
"Get-CorpDiskReport" = "Your function from the PowerShell track (module CorpTools): one object per fixed drive with SizeGB, FreeGB and PercentFree; -BelowPercentFree filters."
"Export-CorpInventory" = "Your script from the PowerShell track (C:\\Scripts\\Export-CorpInventory.ps1): every server in OU=Servers over Invoke-Command into C:\\Reports\\inventory.csv."
"Invoke-CorpOnboarding" = "Your script from the PowerShell track (C:\\Scripts\\Invoke-CorpOnboarding.ps1): new starters from HR's CSV files into OU=Staff, safe to run twice, with -WhatIf."
"Write-Log" = "A helper you write inside a script (here Invoke-CorpOnboarding.ps1): one timestamped line per decision with Add-Content; not a built-in cmdlet."
"Compare-CorpStaff" = "Your script from the PowerShell track (C:\\Scripts\\Compare-CorpStaff.ps1): an HR extract joined with the accounts of an OU on the employee number, one row per person with Status OK, DepartmentDiffers, MissingInAD or NotInHR."
"Test-CorpBaseline" = "Your script from the PowerShell track (C:\\Scripts\\Test-CorpBaseline.ps1): services, folders and registry values from a JSON baseline checked on this machine, the result written as JSON."
"Get-CorpStaff" = "Your script from the PowerShell track (C:\\Scripts\\Get-CorpStaff.ps1): staff accounts by name, department or inactivity, one parameter set per way of asking."
"Disable-CorpStaleComputer" = "Your script from the PowerShell track (C:\\Scripts\\Disable-CorpStaleComputer.ps1): computers with no logon for -DaysInactive disabled, described and moved, with ConfirmImpact High, -WhatIf and -Force."
"Copy-CorpLogs" = "Your script from the PowerShell track (C:\\Scripts\\Copy-CorpLogs.ps1): *.log files collected per source folder, ERROR and FATAL lines, END in finally, and an exit code per outcome."
"Get-CorpLogonSummary" = "Your script from the PowerShell track (C:\\Scripts\\Get-CorpLogonSummary.ps1): LOGON lines of text logs parsed with a regular expression into one object per user."
"Set-CorpRegistryBaseline" = "Your script from the PowerShell track (C:\\Scripts\\Set-CorpRegistryBaseline.ps1): HKLM:\\SOFTWARE\\Corp\\Baseline set with typed values here or through Invoke-Command, with -WhatIf."
"Get-CorpHardware" = "Your script from the PowerShell track (C:\\Scripts\\Get-CorpHardware.ps1): one CIM session per server, hardware classes and the asset tag through StdRegProv, into C:\\Reports\\hardware.csv."
"Invoke-CorpHealthCheck" = "Your script from the PowerShell track (C:\\Scripts\\Invoke-CorpHealthCheck.ps1): sessions, one job across them, Wait-Job -Timeout, and rows OK, Unreachable or TimedOut."
"New-CorpHealthReport" = "Your script from the PowerShell track (C:\\Scripts\\New-CorpHealthReport.ps1): an HTML page per server of disks and stopped automatic services, problem rows marked with a class."
"Remove-CorpOldFiles" = "Your script from the PowerShell track (C:\\Scripts\\Remove-CorpOldFiles.ps1): files older than -Days removed, a transcript per run (ten kept) and events 1000, 1001 and 3000 under the source CorpScripts."
"Write-CorpNewAccount" = "Your script from the PowerShell track (C:\\Scripts\\Write-CorpNewAccount.ps1 on dc01): one line per new account, started by an event trigger on Security 4720 with the event's values."
"Disable-CorpLeaver" = "Your function from the PowerShell track (C:\\Scripts\\CorpLeavers.ps1): a leaver disabled, described with the ticket and moved, admins refused, tested with Pester mocks."
"Export-Clixml" = "Saves objects to an XML file with their types; a PSCredential's password is encrypted with DPAPI, readable only by the same user on the same computer."
"Import-Clixml" = "Reads objects back from a file Export-Clixml wrote, with their types (and a saved PSCredential, for the user and computer that saved it)."
"Write-Verbose" = "Writes a message to the verbose stream, shown only with -Verbose (or $VerbosePreference = 'Continue') and recorded in a transcript; never output."
"Write-Warning" = "Writes a message to the warning stream: shown in yellow, not output, kept in a transcript."
"Write-Error" = "Writes a non-terminating error (a terminating one with -ErrorAction Stop); throw is the terminating way."
"New-ADComputer" = "Creates a computer account in AD (-Name, -Path for the OU, -Enabled); joining a machine later uses it."
"Remove-ADComputer" = "Deletes a computer account from AD (-Confirm:$false to skip the question)."
"Set-Location" = "Changes the current location: a folder, or a key on a provider drive such as HKLM: or Cert:."
"Get-ItemPropertyValue" = "Returns one registry value (or item property) itself, without the object around it: -Path and -Name."
"Get-CimClass" = "Lists CIM/WMI classes (-ClassName with wildcards, -Namespace) with their properties and methods."
"New-CimSession" = "Opens CIM sessions to computers over WS-Management (or DCOM with New-CimSessionOption -Protocol Dcom) for Get-CimInstance and Invoke-CimMethod -CimSession."
"Get-CimSession" = "Lists the CIM sessions open in this PowerShell session."
"Remove-CimSession" = "Closes CIM sessions and frees the connections on the servers."
"New-CimSessionOption" = "Makes options for New-CimSession, most often -Protocol Dcom for a machine without WinRM."
"Get-WmiObject" = "The older WMI cmdlet (DCOM), still in Windows PowerShell 5.1, removed from PowerShell 7; Get-CimInstance replaces it."
"Wait-Job" = "Waits for jobs to finish (-Timeout in seconds returns earlier); the ones still Running after the time limit are the slow ones."
"Remove-Job" = "Deletes jobs from the session (-Force for running ones) once their output is collected."
"Get-PSSession" = "Lists the PowerShell sessions this session has open (-ComputerName for those on a server)."
"Invoke-Item" = "Opens a file with its default program, such as an HTML report in the browser."
"New-ScheduledTaskSettingsSet" = "Settings for a scheduled task: -MultipleInstances (IgnoreNew, Queue, Parallel), time limits, restart on failure, and more."
"Assert-MockCalled" = "Pester: checks that a mocked command was called (-Times n -Exactly, -ParameterFilter, -Scope It); -Times 0 proves it was not."
"Get-ExecutionPolicy" = "Shows the effective execution policy, or every scope's with -List (MachinePolicy, UserPolicy, Process, CurrentUser, LocalMachine)."
"Set-AuthenticodeSignature" = "Signs a script or module file with a code-signing certificate (-Certificate, optional -TimestampServer); any later change breaks the signature."
"Set-VMHost" = "Sets a Hyper-V host's defaults: -VirtualMachinePath and -VirtualHardDiskPath for new VMs and their disks."
"New-VHD" = "Creates a virtual hard disk file (.vhdx): -SizeBytes, -Dynamic (grows as written) or -Fixed, or -ParentPath for a differencing disk."
"Mount-VHD" = "Attaches a .vhdx file to the host as a disk (-Passthru returns it, -ReadOnly to look only), for partitioning or applying an image."
"Dismount-VHD" = "Detaches a .vhdx from the host again, so a VM can use it."
"Expand-WindowsImage" = "Applies one edition (-Index) of a .wim image to a volume (-ApplyPath): a Windows installed without its setup program."
"Set-VM" = "Changes a VM's settings: -CheckpointType (Standard, Production, ProductionOnly), -AutomaticCheckpointsEnabled, -DynamicMemory, -AutomaticStartAction."
"Checkpoint-VM" = "Takes a checkpoint of a VM (-SnapshotName): production (VSS in the guest) or standard (with memory), as the VM's CheckpointType says."
"Get-VMSnapshot" = "Lists a VM's checkpoints with their type and creation time."
"Restore-VMSnapshot" = "Takes a VM back to one of its checkpoints."
"Remove-VMSnapshot" = "Deletes a checkpoint and merges its differencing disk (.avhdx) back into the parent, while the VM runs."
"Get-VMHardDiskDrive" = "Lists a VM's virtual disks and their file paths (an .avhdx means a checkpoint is in the chain)."
"Disconnect-VMNetworkAdapter" = "Unplugs a VM's network card from its virtual switch (a restored copy that must not clash with the original)."
"Export-VM" = "Writes a VM's configuration, disks and checkpoints to a folder (-Path), while it runs."
"Import-VM" = "Registers an exported VM (-Path to its .vmcx): in place, or with -Copy and -GenerateNewId as a copy that can run beside the original."
"Rename-VM" = "Gives a VM a new name in Hyper-V (not the computer name inside it)."
"Get-WBVirtualMachine" = "Lists the Hyper-V VMs Windows Server Backup can back up, or (-Policy) those a backup policy includes."
"Add-WBVirtualMachine" = "Adds a Hyper-V VM to a Windows Server Backup policy."
"Get-WBDisk" = "Lists the disks Windows Server Backup can use as a dedicated backup target, with their size and identifier."
"Get-WBSchedule" = "Shows the times of day a Windows Server Backup policy runs."
"Get-VBRServer" = "Veeam: lists the managed servers (-Type HvServer for Hyper-V hosts)."
"Get-VBRBackupRepository" = "Veeam: lists the backup repositories with their path and type."
"Get-VBRJob" = "Veeam: lists backup jobs with their type and whether their schedule is on."
"Get-VBRBackup" = "Veeam: lists the backups (one per job) in the repositories."
"Get-VBRRestorePoint" = "Veeam: lists a backup's restore points per VM, full or increment, with their date."
"Get-VBRRestoreSession" = "Veeam: lists restore sessions (file and VM restores) with their result."
"Get-VBRBackupCopyJob" = "Veeam: lists backup copy jobs."
"Add-DhcpServerv6ExclusionRange" = "Keeps a range of addresses in a DHCPv6 scope out of the leases (routers, servers with fixed addresses)."
"Add-DhcpServerv6Reservation" = "Reserves a DHCPv6 address for one client, identified by its DUID and IAID."
"Add-DhcpServerv6Scope" = "Creates a DHCPv6 scope for a /64 prefix (-Prefix fd12:3456:789a:1::), from which the server leases addresses statefully."
"Add-DnsServerResourceRecordAAAA" = "Adds an AAAA record (a name to an IPv6 address) to a DNS zone; -CreatePtr adds the matching PTR in the ip6.arpa zone."
"Add-DnsServerResourceRecordPtr" = "Adds a PTR record (an address back to a name) to a reverse zone (in-addr.arpa or ip6.arpa)."
"Add-OdbcDsn" = "Creates an ODBC data source (DSN): -Name, -DriverName, -DsnType System or User, -Platform 64-bit, -SetPropertyValue with Servername, Port and Database."
"Get-AuthenticodeSignature" = "Reads a file's digital signature: Status Valid and the signer's certificate, before you run an installer."
"Get-DhcpServerv6Binding" = "Shows which network adapters the DHCPv6 server listens on (adapters with a static IPv6 address)."
"Get-DhcpServerv6Lease" = "Lists the DHCPv6 leases of a scope: address, client DUID, IAID, host name, expiry."
"Get-DhcpServerv6OptionValue" = "Shows DHCPv6 options set on the server or a scope (23 DNS servers, 24 domain search list)."
"Get-DhcpServerv6Scope" = "Lists the DHCPv6 scopes on the server: prefix, name, state, preference."
"Get-FileHash" = "Computes a file's hash (SHA256 by default) to compare with a published or recorded checksum."
"Get-DnsClientCache" = "Lists the names this machine resolved recently and their answers: volatile evidence of what it talked to, gone at reboot or ipconfig /flushdns."
"Remove-ItemProperty" = "Deletes a value under a registry key (-Path, -Name), such as a test entry under a Run key."
"Install-Sysmon" = "Your startup script from the blue-team lessons (\\\\srv01\\Deploy$\\Sysmon\\Install-Sysmon.ps1): installs Sysmon when it is missing and loads a changed configuration with Sysmon64 -c; not a built-in cmdlet."
"Get-NetIPAddress" = "Lists the IP addresses of the adapters; -AddressFamily IPv6 shows each with PrefixOrigin (Manual, Dhcp, RouterAdvertisement, WellKnown) and SuffixOrigin (Random, Link, Dhcp)."
"Get-NetIPv6Protocol" = "Shows the machine's IPv6 settings: RandomizeIdentifiers, UseTemporaryAddresses, the temporary address lifetimes."
"Get-NetPrefixPolicy" = "Shows the RFC 6724 prefix policy table that decides whether IPv6 or IPv4 is tried first (precedence, label); netsh interface ipv6 add prefixpolicy changes it."
"Get-OdbcDriver" = "Lists the ODBC drivers installed on this machine, 32- and 64-bit (-Platform)."
"Get-OdbcDsn" = "Lists ODBC data sources (System or User) with their driver and attributes."
"Add-ADFineGrainedPasswordPolicySubject" = "Applies a fine-grained password policy (PSO) to a user or a global security group."
"Add-AdfsRelyingPartyTrust" = "Registers an application as a relying party: identifier, endpoints, claim rules, policy."
"Add-ADGroupMember" = "Adds users, computers or groups to an Active Directory group."
"Add-BgpPeer" = "Adds a BGP neighbour to RRAS's BGP router: its address, AS number and the local address to use."
"Add-BgpRouter" = "Starts BGP in RRAS (Windows Server): the router's BGP identifier and local AS number."
"Add-BitLockerKeyProtector" = "Adds a protector (recovery password, TPM, PIN, startup key) to a BitLocker volume."
"Add-CATemplate" = "Publishes a certificate template on the CA, so the CA issues from it."
"Add-CAAuthorityInformationAccess" = "Adds an AIA location to a CA: the CA certificate's URL (-AddToCertificateAia) or an OCSP responder's URL (-AddToCertificateOcsp); restart certsvc, and only new certificates carry it."
"Install-AdcsOnlineResponder" = "Configures an installed ADCS-Online-Cert role as an OCSP Online Responder (IIS application /ocsp); its revocation configurations are set afterwards in ocsp.msc."
"Get-WebApplication" = "Lists the applications under IIS sites (WebAdministration), such as /ocsp or /certsrv, with their pool and path."
"Get-NetAdapterBinding" = "Lists which protocols and services are bound to each network adapter: ms_tcpip (IPv4), ms_tcpip6 (IPv6), file sharing and more."
"Disable-NetAdapterBinding" = "Unbinds a protocol from a network adapter (-ComponentID ms_tcpip turns IPv4 off on it) without uninstalling anything."
"Enable-NetAdapterBinding" = "Binds a protocol to a network adapter again (-ComponentID ms_tcpip turns IPv4 back on)."
"Add-ClusterFileServerRole" = "Creates a clustered file server role with its own name, address and disk."
"Add-ClusterSharedVolume" = "Turns a cluster disk into a Cluster Shared Volume under C:\\ClusterStorage."
"Add-ClusterVirtualMachineRole" = "Makes an existing Hyper-V virtual machine highly available in the cluster."
"Add-CMBoundaryToGroup" = "Puts a boundary in a boundary group."
"Add-CMDeviceCollectionDirectMembershipRule" = "Adds one device to a collection by a direct rule."
"Add-CMDeviceCollectionQueryMembershipRule" = "Adds a WQL query rule to a device collection."
"Add-Computer" = "Joins the computer to a domain (or a workgroup), usually followed by a restart."
"Add-DfsrConnection" = "Adds a replication connection between two members of a DFS Replication group."
"Add-DfsrMember" = "Adds a server as a member of a DFS Replication group."
"Add-DhcpServerInDC" = "Authorizes a Windows DHCP server in Active Directory, so it may hand out leases."
"Add-DhcpServerv4ExclusionRange" = "Excludes a range of addresses in a DHCP scope from ever being offered."
"Add-DhcpServerv4Reservation" = "Reserves an address in a DHCP scope for one MAC address."
"Add-DhcpServerv4Scope" = "Creates a DHCP scope: the pool of addresses offered on one subnet."
"Add-DnsServerConditionalForwarderZone" = "Creates a conditional forwarder: queries for one domain go to named DNS servers."
"Add-DnsServerPrimaryZone" = "Creates a primary DNS zone, file-backed or stored in Active Directory."
"Add-DnsServerResourceRecordA" = "Adds an A (host) record to a DNS zone."
"Add-DnsServerResourceRecordCName" = "Adds a CNAME (alias) record: a name that points at another name."
"Add-DnsServerResourceRecordMX" = "Adds an MX record: the host that takes mail for a domain (Name . for the zone itself), with its preference."
"Add-IscsiVirtualDiskTargetMapping" = "Offers an iSCSI virtual disk (LUN) through a target."
"Add-KdsRootKey" = "Creates the KDS root key that group managed service account passwords are derived from."
"Add-LocalGroupMember" = "Adds a user or group to a local group on this machine."
"Add-MpPreference" = "Adds values to a Defender list setting (exclusions, ASR rule ids and actions)."
"Add-PhysicalDisk" = "Adds physical disks to a Storage Spaces pool (a replacement for a failed one)."
"Add-Printer" = "Creates a print queue (optionally shared and published) on a port with a driver."
"Add-PrinterPort" = "Creates a printer port, such as a TCP/IP port to a network printer."
"Add-VMDvdDrive" = "Adds a DVD drive to a Hyper-V VM; -Path puts an ISO in it."
"Add-VpnS2SInterface" = "Creates a site-to-site VPN (demand-dial) interface in RRAS."
"Add-WBBackupTarget" = "Adds a destination (a volume, disk or share) to a Windows Server Backup policy."
"Add-WBSystemState" = "Includes the system state (AD, registry, boot files) in a backup policy."
"Add-WBVolume" = "Adds a volume to a Windows Server Backup policy."
"Add-WindowsCapability" = "Installs a Feature on Demand on Windows 11, such as an RSAT tool."
"Backup-BitLockerKeyProtector" = "Copies a BitLocker recovery password to Active Directory (escrow)."
"Clear-BitLockerAutoUnlock" = "Removes every auto-unlock key from the operating system drive (needed before decrypting it)."
"Clear-DnsClientCache" = "Empties this machine's DNS resolver cache so the next lookup asks a server."
"Clear-DnsServerCache" = "Empties the DNS server's cache of answers it looked up for clients."
"Connect-IscsiTarget" = "Logs the iSCSI initiator on to a target so its disks appear on this machine."
"Connect-VMNetworkAdapter" = "Connects a VM's network adapter to a virtual switch (-SwitchName)."
"Enable-MSDSMAutomaticClaim" = "Lets Microsoft's MPIO DSM claim every disk of a bus type (-BusType iSCSI), so a LUN over two paths is one disk."
"Expand-Archive" = "Unpacks a .zip file into a folder (-DestinationPath), as the Docker for Windows zip into Program Files."
"Export-Csv" = "Writes objects to a CSV file, one row per object; the record of a bulk change."
"Export-ScheduledTask" = "Prints a scheduled task's full XML definition: triggers, actions, account and dates."
"Get-InitiatorPort" = "The machine's storage ports: for iSCSI, NodeAddress is the initiator's IQN a target allows."
"Get-IscsiConnection" = "Lists the initiator's iSCSI connections: one per path, with the target's and this machine's address."
"Get-MSDSMAutomaticClaimSettings" = "Which bus types Microsoft's MPIO DSM claims automatically (iSCSI, SAS)."
"Connect-VpnS2SInterface" = "Brings a site-to-site VPN interface up."
"Disconnect-VpnS2SInterface" = "Takes a site-to-site VPN interface down (Connect-VpnS2SInterface brings it back, with any new settings)."
"Set-VpnS2SInterface" = "Changes a site-to-site VPN interface: the destination, the routes behind it (-IPv4Subnet prefix:metric,...), the protocol or the key."
"Get-AzVirtualNetwork" = "Az PowerShell: a virtual network with its address space, subnets and peerings (-Name, -ResourceGroupName)."
"Get-OBPolicy" = "The MARS (Azure Backup) agent's backup policy on this server: what is backed up, when, and how long it is kept (module MSOnlineBackup)."
"Get-OBJob" = "The MARS agent's backup and restore jobs; -Previous <n> lists finished ones with their state."
"Get-SmbConnection" = "The SMB connections this client has open: server, share, user and dialect (3.1.1 for Azure Files)."
"Copy-Item" = "Copies files and folders; -ToSession and -FromSession copy over a PowerShell remoting session."
"Disable-ADAccount" = "Disables an Active Directory user or computer account."
"Disable-BitLocker" = "Decrypts a BitLocker volume and removes its protectors."
"Disable-BitLockerAutoUnlock" = "Turns auto-unlock off for a BitLocker data drive and removes the key it kept for it."
"Enable-ADAccount" = "Enables a disabled user or computer account."
"Enable-ADOptionalFeature" = "Turns on a forest feature such as the AD Recycle Bin (irreversible)."
"Enable-BitLocker" = "Starts BitLocker encryption on a volume with the given protector."
"Enable-BitLockerAutoUnlock" = "Lets a BitLocker data drive unlock with the operating system drive of this PC."
"Enable-DedupVolume" = "Turns on Data Deduplication for a volume."
"Enable-NetFirewallRule" = "Enables existing Windows Firewall rules, by name or by group."
"Enable-PSRemoting" = "Turns on PowerShell remoting: the WinRM service, its HTTP listener and the firewall rule."
"Enter-PSSession" = "Opens an interactive PowerShell session on a remote machine over WinRM."
"Exit-PSSession" = "Leaves an interactive remote session."
"Export-Certificate" = "Writes a certificate's public part to a .cer file."
"Export-NpsConfiguration" = "Exports the NPS (RADIUS) server's whole configuration to an XML file."
"Find-NetRoute" = "Shows the route and source address Windows would use to reach a destination."
"ForEach-Object" = "Runs a script block for each object in the pipeline."
"Format-List" = "Shows each object's properties as a list, one per line."
"Format-Table" = "Shows objects as a table with the columns you choose."
"Format-Volume" = "Creates a file system (NTFS, ReFS, FAT32) on a partition."
"Get-Acl" = "Reads the access control list of a file, folder, registry key or AD object (AD: drive)."
"Get-ADComputer" = "Reads computer accounts and their properties from Active Directory."
"Get-ADDefaultDomainPasswordPolicy" = "Shows the domain's default password and lockout policy."
"Get-ADDomain" = "Shows the domain: names, functional level, FSMO role holders, containers."
"Get-ADDomainController" = "Finds a domain controller, or lists them, with site, roles and global catalog flag."
"Get-ADForest" = "Shows the forest: domains, sites, schema master, UPN suffixes, functional level."
"Get-AdfsAccessControlPolicy" = "Lists the access control policies (Permit everyone, Permit specific group, MFA)."
"Get-AdfsCertificate" = "Lists the AD FS service communications, token-signing and token-decrypting certificates."
"Get-AdfsClaimsProviderTrust" = "Lists claims provider trusts: where identities come from (Active Directory)."
"Get-AdfsProperties" = "Shows the AD FS farm's settings: federation service name, identifier, endpoints, sign-on page."
"Get-AdfsRelyingPartyTrust" = "Shows relying party trusts and their identifiers, endpoints and claim rules."
"Get-ADGroup" = "Reads Active Directory groups: scope, category, members' DNs."
"Get-ADGroupMember" = "Lists the members of a group (with -Recursive, nested members too)."
"Get-ADObject" = "Reads any Active Directory object by DN, filter or LDAP filter, deleted ones included."
"Get-ADOptionalFeature" = "Shows forest features such as the Recycle Bin and whether they are on."
"Get-ADOrganizationalUnit" = "Reads organizational units and their properties."
"Get-ADReplicationPartnerMetadata" = "Shows each DC's replication partners, last success and failures."
"Get-ADReplicationSite" = "Reads AD sites."
"Get-ADReplicationSiteLink" = "Reads site links: sites, cost and replication interval."
"Get-ADReplicationSubnet" = "Reads subnet objects and the site each belongs to."
"Get-ADRootDSE" = "Reads the root of a DC's directory: naming contexts, schema and configuration DNs."
"Get-ADServiceAccount" = "Reads managed service accounts (gMSA, dMSA) and who may use them."
"Get-ADUser" = "Reads user accounts and their properties from Active Directory."
"Get-ADUserResultantPasswordPolicy" = "Shows which fine-grained password policy actually applies to a user."
"Get-AppLockerPolicy" = "Shows the effective, local or domain AppLocker policy."
"Get-AppxPackage" = "Lists the packaged (Store) apps installed for a user."
"Get-AppxProvisionedPackage" = "Lists the packaged apps in the Windows image that new users receive."
"Get-AzContext" = "Shows which Azure account, tenant and subscription Az PowerShell is using."
"Get-AzResourceGroup" = "Lists Azure resource groups in the current subscription."
"Get-BgpPeer" = "Lists RRAS's BGP peers and the state of each session (Connected, Connecting, Stopped)."
"Get-BgpRouteInformation" = "Shows the routes RRAS's BGP has learned and the best path for each."
"Get-BitLockerVolume" = "Shows BitLocker status, encryption method and protectors per volume."
"Get-Certificate" = "Requests (enrols) a certificate from an enterprise CA with a template."
"Get-ChildItem" = "Lists items in a folder, registry key or certificate store (dir, ls)."
"Get-CimInstance" = "Reads WMI/CIM classes (Win32_Process, Win32_UserProfile...) locally or remotely."
"Get-ClusterGroup" = "Lists a cluster's roles (groups), their owner node and state."
"Get-ClusterNetwork" = "Lists cluster networks and what each carries (client, cluster only)."
"Get-ClusterNode" = "Lists the nodes of a failover cluster and their state."
