"jq" = "Filters and reshapes JSON from the shell: jq -c 'select(.event_type==\"alert\")' /var/log/suricata/eve.json picks Suricata's alerts, one per line."
"velociraptor" = "Velociraptor, one program for the server, the client and its own tooling: config generate -i writes a server and client configuration, config client prints the client's, debian server --binary builds the server's service package, user add <name> --role <role> adds a console account."
"zeek" = "The Zeek network security monitor's engine: zeek --version, zeek -r capture.pcap local runs the site policy over a capture file; on a sensor zeekctl runs it."
"zeekctl" = "Manages Zeek on a sensor: deploy (check, install, restart), status (running, stopped, crashed), check (parse the policy only), diag (why a node crashed), stop and start."
"yara" = "Scans files with YARA rules: yara -r (recursive) -s (show matching strings) rules.yar <folder>; prints each matching rule and file."
"yarac" = "Compiles YARA rule files into one binary rule set that yara loads faster for many scans."
"sigma" = "sigma-cli: sigma check <rules> validates Sigma rules, sigma convert -t <backend> -p <pipeline> <rules> -o <file> writes them as queries for a SIEM, sigma list targets and pipelines shows what is installed."
"unzip" = "Lists (-l) or extracts a zip archive; unzip -l reads the table of contents without changing the archive."
"wg" = "WireGuard's tool: wg genkey and wg pubkey make keys, wg show lists peers and their latest handshake, wg set wg0 peer <key> remove revokes one."
"wg-quick" = "Brings a WireGuard interface up from /etc/wireguard/<name>.conf: wg-quick up wg0, or systemctl enable --now wg-quick@wg0."
"ansible" = "Runs one module on a group of hosts (ad-hoc): ansible linux -m ansible.builtin.ping, -a for arguments, -b to become root."
"ansible-config" = "Shows Ansible's settings: ansible-config dump --only-changed lists what ansible.cfg (or the environment) changed."
"ansible-doc" = "Ansible's module documentation offline: ansible-doc -l lists modules, ansible-doc ansible.builtin.apt shows one."
"ansible-galaxy" = "Collections and roles: ansible-galaxy collection list shows what is installed, ansible-galaxy role init makes a role skeleton offline."
"ansible-inventory" = "Shows the inventory as Ansible reads it: --graph for groups, --host for one host's variables, --list as JSON."
"ansible-playbook" = "Runs a playbook: --syntax-check, --check (dry run), --diff, --limit for part of the inventory."
"ssh" = "OpenSSH client: logs in to a machine or runs one command there; checks the server's host key against known_hosts."
"ssh-copy-id" = "Appends your public key to a server's authorized_keys over SSH, after one password login."
"ssh-keygen" = "Makes and inspects SSH keys: -t ed25519 a new key pair, -lf a fingerprint, -F finds and -R removes a known_hosts entry."
"ssh-keyscan" = "Fetches a server's public host keys over the network, for comparison (never trust them without a fingerprint check)."
"sshd" = "The OpenSSH server: sshd -t tests the configuration, sshd -T prints the settings in effect."
"asterisk" = "The phone system's engine; asterisk -rx '<command>' runs one console command (pjsip show contacts, core show channels). Call files dropped into /var/spool/asterisk/outgoing make it ring an extension; outgoing_done keeps each one with its Status (Completed when answered)."
"sendmail" = "The mail server's local submission command (Postfix's compatible /usr/sbin/sendmail): sendmail -i -f <from> <to> < message delivers a mail inside the server, through Postfix's pickup."
"a2ensite" = "Enables an Apache site from /etc/apache2/sites-available (a2dissite disables one); systemctl reload apache2 applies it."
"a2enconf" = "Enables an Apache configuration snippet from /etc/apache2/conf-available, such as an Alias for a web application."
"a2enmod" = "Enables an Apache module: a2enmod rewrite for applications that route every request through index.php (GLPI)."
"apache2ctl" = "Apache's control tool: configtest checks the configuration, -S lists the virtual hosts and aliases it serves."
"mariadb-tzinfo-to-sql" = "Turns the system's time zone files into SQL for MariaDB's mysql database: mariadb-tzinfo-to-sql /usr/share/zoneinfo | sudo mariadb mysql."
"newaliases" = "Rebuilds Postfix's alias database from /etc/aliases (bob: alice forwards bob's mail); run it after every edit."
"postalias" = "Queries or builds a Postfix alias map: postalias -q bob hash:/etc/aliases prints where bob's mail goes."
"docker-compose" = "Docker Compose 1.x as Debian 12 packages it (Compose 2 is docker compose): in the folder of a docker-compose.yml, up -d starts the stack, ps shows each service and its health, logs -f follows them, exec runs a command in a service, down stops it; docker-compose.override.yml beside it is merged in."

"agent_control" = "Wazuh's agent list on the manager (/var/ossec/bin/agent_control -l): every agent with its id, name, address and Active or Disconnected."
"wazuh-logtest" = "Wazuh's rule tester (/var/ossec/bin/wazuh-logtest): paste an event, see the decoder and the rule that match, before you restart the manager."
"wazuh-certs-tool.sh" = "Wazuh's certificate tool: makes a small CA and a certificate for each indexer, server and dashboard node listed in config.yml (-A for all)."

"netmiko" = "Python's SSH library for network devices: ConnectHandler(device_type='cisco_ios', ...), send_command, send_config_set, save_config."
"napalm" = "Python's vendor-neutral device API: get_network_driver('ios'), open(), get_facts(), get_interfaces_ip(); answers dictionaries, ready for json.dumps."
"python3 -m venv" = "Makes a virtual environment; --system-site-packages lets it see the distribution's Python packages beside its own pip installs."
"pip" = "Installs Python packages; offline from wheel files: pip install --no-index --no-deps <files>.whl."
"net ads" = "Samba's domain tool: net ads join -U Administrator joins the server to AD, net ads testjoin checks the machine account, net ads leave removes it."
"net sam rights" = "Samba's local rights: net sam rights grant '<DOMAIN>\\<group>' SeDiskOperatorPrivilege, net sam rights list <privilege> shows who holds it."
"net cache flush" = "Empties Samba's and winbind's cache of names and ids, after an idmap or join change."
"wbinfo" = "Asks winbind: -u and -g list domain users and groups, -t tests the secure channel, -n <name> gives a SID, -S <SID> the uid it maps to."
"testparm" = "Checks smb.conf and prints what Samba understood (-s); --section-name and --parameter-name print one value."
"smbclient" = "Samba's SMB client: -L //server lists shares, //server/share opens one; --use-kerberos=required uses your ticket, -m SMB3 tests a dialect."
"smbcacls" = "Reads or changes the Windows ACL of a file on an SMB share: smbcacls //fs01/projects / prints it, --add 'ACL:<group>:ALLOWED/OI|CI/CHANGE' adds an entry."
"smbcontrol" = "Sends messages to running Samba daemons: smbcontrol all reload-config rereads smb.conf."
"getfacl" = "Prints a file's POSIX ACL: owner, group, named user and group entries, the mask, and the default entries new files inherit."
"setfacl" = "Changes a POSIX ACL: -m g:<group>:rwx adds an entry, d: for defaults, -b removes all, --restore= applies a saved getfacl output."
"getfattr" = "Prints a file's extended attributes: getfattr -n security.NTACL shows the Windows ACL Samba stored."
"named-checkconf" = "Checks BIND's configuration (named.conf and its includes); -p prints it as named reads it, -z also loads the zones."
"named-checkzone" = "Checks a zone file before it is loaded: named-checkzone dev.corp.lab /etc/bind/db.dev.corp.lab prints the serial and OK, or the line that is wrong."
"rndc" = "Controls a running BIND: rndc reload <zone>, rndc reconfig (new zones), rndc zonestatus <zone>, rndc retransfer <zone>."
"findmnt" = "Lists mounted file systems with their source and options: findmnt -t cifs, findmnt /srv/projects."
"kdestroy" = "Throws away the current user's Kerberos tickets."
"mkhomedir_helper" = "Makes a user's home folder from /etc/skel with the right owner and mode: what pam_mkhomedir runs, and Samba's [homes] can too."
"pam-auth-update" = "Turns Ubuntu's PAM profiles on or off: pam-auth-update --enable mkhomedir makes home folders at first login."

"smbstatus" = "Samba's sessions, shares in use and locked files (-b sessions, -S shares, -L locks)."
"lpadmin" = "CUPS: adds and changes queues: -p name, -v device URI, -m driver, -E enable, -o printer-is-shared=true, -x delete."
"lpstat" = "CUPS: status of queues and jobs: -p (enabled or disabled), -a (accepting), -v (device URI), -o (jobs), -W completed, -r (scheduler)."
"lpinfo" = "CUPS: lists the backends and devices CUPS sees (-v) and the drivers it has (-m)."
"cupsctl" = "CUPS: shows and changes the server's settings: --share-printers, --remote-any, --remote-admin, --debug-logging (restarts cupsd)."
"cupsenable" = "CUPS: starts a stopped (disabled) queue so it prints its jobs; cupsdisable -r reason stops it."
"cupsdisable" = "CUPS: stops a queue, which keeps its jobs; -r gives the reason lpstat shows."
"cupsaccept" = "CUPS: lets a queue take new jobs again; cupsreject -r reason turns them away."
"cupsreject" = "CUPS: makes a queue refuse new jobs ('not accepting jobs'), with -r for the reason."
"lpoptions" = "CUPS: shows (-p queue) and sets a queue's options, such as printer-is-shared."
"lp" = "CUPS: prints a file or standard input to a queue (-d queue, -t title)."
"nc" = "netcat: opens a TCP connection; nc -zv host port checks that something listens there (a printer on 9100)."
"dnf" = "The Red Hat family's package manager: install, remove, info, provides (which package has a file), repolist, group list, history and history undo."
"rpm" = "Queries and verifies installed RPM packages: -qa all, -qi info, -ql files, -qf the package owning a file, -V what changed since install."
"apt" = "Ubuntu's package tool for people: apt update reads the sources, apt install, apt policy shows each candidate's source."
"apt-mark" = "Marks packages: apt-mark hold keeps a version through upgrades, unhold releases it, showhold lists the held ones."
"apt-cache" = "Reads apt's package index: apt-cache depends, rdepends, policy and show."
"dpkg" = "The low-level Debian package tool: -l lists installed packages, -L the files of one, -S the package that owns a file."
"dpkg-query" = "Queries the dpkg database with a format: dpkg-query -W -f='${Status}' <package>."
"groupadd" = "Creates a local group (-g for a fixed gid, --system for a system group)."
"gpasswd" = "Administers a group: -a user adds, -d user removes, -A sets the group's administrators."
"chage" = "Password ageing for an account: -M maximum days, -m minimum, -W warning, -E expiry date, -l lists them."
"passwd" = "Sets a user's password; -S shows its state, -l locks and -u unlocks it."
"chmod" = "Changes permission bits: symbolic (g+w, o-rwx, +t) or octal (2770, 1777, 644); the first octal digit holds setuid, setgid and sticky."
"chown" = "Changes a file's owner and group: chown root:finance /srv/finance; -R for a tree."
"stat" = "Shows a file's metadata: stat -c '%U:%G %a' prints owner, group and octal mode."
"lsblk" = "Lists block devices as a tree: disks, partitions, LVM volumes; -f adds file system types and UUIDs."
"parted" = "Partitions a disk: mklabel gpt, mkpart, set <n> lvm on, print."
"blkid" = "Prints the UUID, label and type of file systems and swap areas."
"findfs" = "Finds the device that carries a UUID= or LABEL=; prints nothing and fails when none does."
"pvcreate" = "LVM: marks a partition or disk as a physical volume."
"vgcreate" = "LVM: creates a volume group from physical volumes (vgcreate vgdata /dev/vdb1)."
"lvcreate" = "LVM: creates a logical volume in a group (-n name, -L size)."
"lvextend" = "LVM: grows a logical volume (-L size or +size); -r grows the file system on it too."
"pvs" = "LVM: lists physical volumes, their group and free space."
"vgs" = "LVM: lists volume groups, their size and free space."
"mkfs.xfs" = "Makes an XFS file system on a device and prints its geometry and UUID."
"xfs_growfs" = "Grows a mounted XFS file system to fill its device (XFS never shrinks)."
"xfs_info" = "Shows a mounted XFS file system's geometry, including its size in blocks."
"mkswap" = "Prepares a device or file as swap and prints its UUID."
"swapon" = "Turns swap on: swapon -a for every fstab line, --show to list what is in use."
"free" = "Shows memory and swap in use (-h for readable units)."
"df" = "File system usage per mount: -h readable, -T type, -P one line each, -t ext4 to choose types."
"du" = "Adds up the space of files and folders it can find by name: du -xsh /*, du -sh /home/*."
"systemd-analyze" = "systemd's analysis tool: calendar tests an OnCalendar expression, cat-config shows a configuration with its drop-ins, verify checks unit files."
"systemd-run" = "Runs a command as a transient unit, now or later (--on-active=2min), with its own name and log."
"systemd-delta" = "Lists unit files and configuration that are overridden or extended by files in /etc."
"firewall-cmd" = "firewalld's command line: --list-all, --get-active-zones, --add-service, --add-port, --add-source, --permanent, --reload."
"getenforce" = "Prints SELinux's mode: Enforcing, Permissive or Disabled."
"setenforce" = "Switches SELinux between enforcing (1) and permissive (0) until the next boot."
"sestatus" = "SELinux's status: mode, policy, and the mode in the configuration file."
"semanage" = "Changes SELinux policy settings that last: fcontext rules for paths, port types, booleans, logins."
"restorecon" = "Resets files' SELinux labels to what the fcontext rules say (-R recursive, -v shows each change)."
"chcon" = "Changes a file's SELinux label directly; the next restorecon or relabel undoes it."
"setsebool" = "Sets an SELinux boolean; -P keeps it across reboots."
"getsebool" = "Shows SELinux booleans: getsebool -a, or one by name."
"ausearch" = "Searches the audit log: ausearch -m avc -ts recent lists SELinux denials of the last ten minutes."
"lsof" = "Lists open files and the processes holding them; lsof +L1 shows files deleted while still open."
"truncate" = "Sets a file's size; truncate -s 0 empties it, even through /proc/<pid>/fd/<n>."
"bash" = "The shell scripts here are written for: bash -n checks a script's syntax, bash -x traces each command."
"grub2-setpassword" = "Rocky and RHEL: sets the password GRUB asks for before a boot entry can be edited."
"chroot" = "Runs a shell with another directory as /: chroot /sysroot after rd.break."
"sealert" = "setroubleshoot's reader: explains SELinux denials from the audit log and suggests the fix."
"git" = "Version control: init, add, commit, log, show, diff, switch -c, merge, revert, remote, push, pull, fetch, clone; git config --global sets your name and address."
"forgejo" = "The Forgejo Git server: forgejo web runs it; forgejo admin user create, admin user generate-access-token and actions generate-runner-token manage it from the console (as git, with --config /etc/forgejo/app.ini)."
"forgejo-runner" = "The Forgejo Actions runner: register (with a token, --instance, --labels lab:host) writes .runner, generate-config writes config.yml, daemon runs the jobs."
"tofu" = "OpenTofu: init installs the providers (here from a filesystem mirror), fmt and validate check, plan shows what would change, apply makes it, state list shows what it manages."
"ssh-agent" = "Holds private keys in memory for one shell or job: eval \"$(ssh-agent -s)\" starts it, ssh-agent -k stops it and forgets them."
"ssh-add" = "Gives a private key to the running ssh-agent; ssh-add - reads it from standard input (a CI secret), ssh-add -l lists the keys held."
"shred" = "Overwrites a file before deleting it (shred -u): for a private key copied somewhere it should not stay."
"ipa-server-install" = "FreeIPA: makes this machine the first IdM server (directory, Kerberos KDC, CA; --setup-dns for its own DNS, --forwarder, --domain, --realm)."
"ipa-client-install" = "FreeIPA: enrols this machine in an IdM domain (host entry, keytab, SSSD, Kerberos and SSH set up; --mkhomedir, --enable-dns-updates); --uninstall leaves it."
"ipa-adtrust-install" = "FreeIPA: makes an IdM server a trust controller for Active Directory trusts (Samba parts, a NetBIOS name, SIDs for IdM users with --add-sids)."
"ipactl" = "FreeIPA: status, start, stop or restart every service of an IdM server at once (directory, KDC, CA, web server, DNS)."
"ipa" = "FreeIPA's command line, with a Kerberos ticket (kinit admin): user-add, group-add-member, host-find, hbacrule-*, hbactest, sudorule-*, dnsforwardzone-add, trust-add."
"oathtool" = "Computes one-time passwords: oathtool --totp -b <base32 secret> prints the current six-digit TOTP code, what an authenticator app shows."
"sqlite3" = "The SQLite shell: sqlite3 <file.db> \"select ...\" queries a database file, such as Grafana's /var/lib/grafana/grafana.db."
"kc.sh" = "Keycloak's server script: build (bakes the database and features in), start --optimized (production), start-dev (a laptop), bootstrap-admin user (a temporary first administrator)."
"mellon_create_metadata" = "mod_auth_mellon: makes a SAML service provider's key, certificate and metadata file from its entity ID and endpoint URL."
"createuser" = "PostgreSQL: creates a role (a database user); --pwprompt asks for its password. Run as the postgres user."
"softflowd" = "Watches a network card and exports a flow record per conversation as NetFlow or IPFIX (-i the card, -n collector:port, -v 5, 9 or 10)."
"softflowctl" = "Talks to a running softflowd through its control socket (-c): statistics, dump-flows, expire-all."
"nfcapd" = "nfdump's collector: receives NetFlow and IPFIX on a UDP port (-p) and writes a file per interval (-l the directory, -t seconds)."
"nfdump" = "Reads the flow files nfcapd wrote (-R a directory) with tcpdump-like filters; -s gives top-N statistics (srcip/bytes), -o the output format."
"haproxy" = "HAProxy, the TCP and HTTP load balancer: haproxy -c -f /etc/haproxy/haproxy.cfg checks a configuration before a restart."
"keepalived" = "The VRRP daemon that moves a virtual address between machines (/etc/keepalived/keepalived.conf: vrrp_instance, vrrp_script); it logs its state changes to the journal."
"bridge" = "iproute2's bridge tool: bridge link (the ports of each bridge), bridge fdb show (the MAC table, with dst for a VXLAN's remote VTEP)."
"pcs" = "Pacemaker and Corosync's configuration tool: pcs host auth, pcs cluster setup, pcs status, pcs resource create, pcs property set, pcs node standby."
"corosync-quorumtool" = "Shows Corosync's membership and quorum (-s): the nodes, the votes, Quorate yes or no and flags such as 2Node."
"tayga" = "TAYGA, a stateless NAT64 in user space on a TUN device (/etc/tayga.conf: tun-device, ipv4-addr, prefix, dynamic-pool); tayga --mktun creates the device."
"unbound-checkconf" = "Checks Unbound's configuration (/etc/unbound/unbound.conf and its conf.d files) before a restart."
"renice" = "Changes the nice value of running processes: renice -n 10 -p <pid>; lowering it below the current value needs root."
"pkill" = "Signals processes chosen by name or attributes: pkill -x <name>, -u <user>, -HUP; pgrep with the same options only lists them."
"nohup" = "Runs a command immune to SIGHUP, so it survives the terminal closing; output goes to nohup.out unless redirected."
"gzip" = "Compresses files with gzip (.gz); -d decompresses, -k keeps the original, -l lists sizes; tar -z uses it."
"xz" = "Compresses files with xz (.xz), slower and smaller than gzip; -d decompresses, -T0 uses every CPU; tar -J uses it."
"zstd" = "Compresses with Zstandard (.zst), fast at good ratios; -d decompresses, -19 compresses harder; tar --zstd uses it."
"cpio" = "Copies files into and out of cpio archives: find ... | cpio -o > file, cpio -idmv < file; initramfs images are cpio archives."
"awk" = "A small language for columns of text: awk -F: '$3 >= 1000 {print $1}' /etc/passwd prints the matching lines' first field."
"sed" = "The stream editor: sed 's/old/new/g' file prints the edited text, -i edits in place (-i.bak keeps a copy), -n with p prints only matches."
"uniq" = "Merges adjacent identical lines; -c counts them, -d shows only repeated ones. Sort first, or duplicates apart are missed."
"fdisk" = "Edits MBR and GPT partition tables interactively: g new GPT, o new MBR, n new partition, t type, p print, w write; fdisk -l lists disks."
"mkfs.ext4" = "Makes an ext4 file system on a device: -L sets the label; tune2fs and e2label change it later."
"modprobe" = "Loads a kernel module and the modules it needs (modprobe -r removes); reads options and install rules in /etc/modprobe.d."
"lsmod" = "Lists the loaded kernel modules, their size and what uses them (a readable /proc/modules)."
"modinfo" = "Shows a kernel module's file, description, dependencies and the parameters it accepts."
"update-grub" = "Debian and Ubuntu: regenerates /boot/grub/grub.cfg from /etc/default/grub and /etc/grub.d (grub-mkconfig -o /boot/grub/grub.cfg)."
"grubby" = "Red Hat family: changes boot entries' kernel arguments directly: grubby --update-kernel=ALL --args='...' or --remove-args, --info=ALL."
"tuned-adm" = "TuneD's control tool: list, active, recommend, profile <name> applies a profile, verify checks the system still matches it."
"nmcli" = "NetworkManager's command line: connection show, connection modify <name> ipv4.addresses ... ipv4.method manual, connection up <name>, device status."
"dpkg-scanpackages" = "Writes the Packages index of a folder of .deb files, so apt can use the folder as a flat repository."
"createrepo_c" = "Writes the repodata index of a folder of .rpm files, so dnf can use it as a repository; it replaced the older createrepo."
"podman" = "Runs OCI containers without a daemon, rootless for ordinary users: load, images, run -d -p, ps, logs, exec; Quadlet files make them systemd units."
"loginctl" = "systemd-logind's tool: list-users, list-sessions, show-user <user> -p Linger, enable-linger keeps a user's own systemd running without a login."
"flatpak" = "Sandboxed desktop applications: remotes, remote-add, install <remote> <ref>, list --app, run <app id>; build-init, build-export and build-bundle make them."
"quotacheck" = "Scans a file system and writes its quota files (aquota.user, aquota.group): quotacheck -cugm /mount."
"setquota" = "Sets a user's or group's block and inode limits without an editor: setquota -u <user> <soft> <hard> <isoft> <ihard> /mount; -t sets the grace times."
"edquota" = "Edits quota limits in an editor: edquota -u <user>, edquota -p <proto> <users> copies a prototype's limits, -t the grace periods."
"repquota" = "Reports every user's quota use and limits on a file system: repquota -s /mount (readable sizes), -a for all."
"slapadd" = "OpenLDAP: adds LDIF entries directly to a stopped server's database (bulk loads, restores); slapcat exports them."
"ldapadd" = "Adds LDAP entries from an LDIF file over the protocol: ldapadd -x -D <bind dn> -W -f file.ldif (or -Y EXTERNAL -H ldapi:/// as root for cn=config)."
"ldapmodify" = "Changes LDAP entries from LDIF (changetype: modify, add:, replace:, delete:); the way to edit OpenLDAP's cn=config."
"kea-dhcp4" = "ISC Kea's DHCPv4 server: kea-dhcp4 -t <file> checks a configuration without starting it; the service is kea-dhcp4-server on Debian and Ubuntu."
[firewall]
"pfctl" = "pf's control tool on OPNsense and pfSense: -si status, -sr rules, -sn NAT, -ss states, -e enable, -vsr counters."

[sql]
"psql" = "PostgreSQL's command-line client: -h host -U role -d database, -c a statement; inside, \\du roles, \\l databases, \\dp privileges, \\password sets one."
"pg_lsclusters" = "Lists the PostgreSQL clusters on a Debian or Ubuntu machine: version, name, port, status, data directory."
"pg_dump" = "Dumps one PostgreSQL database consistently: -Fc the custom archive pg_restore reads, -f the file."
"pg_restore" = "Restores a pg_dump archive: -l lists it, -d into a database, -t one table, --clean drops first."
"pg_dumpall" = "Dumps a whole PostgreSQL cluster; --globals-only writes just the roles and tablespaces."
"pg_basebackup" = "Copies a running PostgreSQL cluster over a replication connection; -R makes the copy a standby, -S uses a slot, -X stream."
"createdb" = "Creates a PostgreSQL database from the shell: createdb -O owner name."
"mariadb" = "MariaDB's command-line client (also mysql): sudo mariadb logs root in over the socket, -u user -p asks for a password, -e runs a statement."
"mariadb-dump" = "Dumps MariaDB databases as SQL (also mysqldump): --single-transaction for a consistent InnoDB dump, --databases, --master-data=2 --gtid for a replica's seed."
"mysqldump" = "The older name of mariadb-dump, still installed with the MariaDB client."
"sqlcmd" = "Runs T-SQL against SQL Server from the command line (-S server -E Windows authentication)."

[cloud]
"az" = "The Azure CLI, in Cloud Shell or installed: az group, az vm, az network."
"azcmagent" = "The Azure Arc agent's tool: connect, show, check, config."
"labcmagent" = "The lab's Azure Arc agent (azure-hybrid lab): connect, show, check, heartbeat, disconnect, as azcmagent does for Azure."
"labbackup" = "The lab's Azure Backup agent (azure-hybrid lab): register with vault credentials, policy, backup, points, restore, status."
"azcopy" = "Microsoft's bulk copier for Azure Storage: azcopy copy and azcopy sync between a folder and a container (a SAS in the URL or azcopy login), --recursive, --delete-destination, azcopy jobs list."
"bicep" = "The Bicep compiler: bicep build turns a .bicep file into the ARM template JSON Azure deploys; az deployment group create --template-file main.bicep runs it for you."
"azureq" = "On cloud01 in the azure-hybrid and azure-admin labs: what the lab's Azure holds, as the lab's checks read it (azureq \"[r['name'] for r in R]\")."
"aws" = "The AWS CLI v2: aws configure, aws sts get-caller-identity, aws iam, aws s3 and s3api, aws ec2, aws route53, aws cloudwatch, aws cloudformation; --profile, --region, --query, --output."
"awsq" = "On cloud01 in the aws-cloud lab: what the lab's AWS account holds, as the lab's checks read it (awsq \"[u['UserName'] for u in c('iam').list_users()['Users']]\")."
"gcloud" = "The Google Cloud CLI, in Cloud Shell or installed: gcloud config, gcloud projects, gcloud iam, gcloud compute."

[switch]
"show spanning-tree" = "On a switch's console: the root bridge, this switch's bridge ID and each port's role and state (summary counts them, vlan <n> one instance)."
"spanning-tree vlan" = "Spanning tree for a VLAN: on (spanning-tree vlan 1), off (no ...), the bridge priority (priority 4096) or root primary / secondary."
"spanning-tree mode" = "pvst (802.1D per VLAN, the default), rapid-pvst (802.1w per VLAN) or mst (802.1s: VLANs grouped into instances, one region); mstpd on the router runs the rapid modes."
"spanning-tree portfast" = "On an access port: forward at once instead of 30 s of listening and learning; default does it on every access port."
"spanning-tree bpduguard" = "enable on a port err-disables it the moment a BPDU arrives (a switch where a machine should be)."
"spanning-tree cost" = "A port's path cost to the root (gigabit 4, 100 Mbit 19): a dearer port loses the root port election."
"commit confirmed" = "Junos: activates the candidate configuration and rolls it back after the given minutes unless another commit follows."
"show | compare" = "Junos: the difference between the candidate configuration and the active one, + for added lines and - for removed ones."
"show ip nhrp cache" = "FRRouting (nhrpd): tunnel addresses mapped to public (NBMA) addresses, each with its type; dynamic for a spoke that registered."
"show evpn vni" = "FRRouting: each VXLAN VNI the switch knows, its interface, how many MAC addresses and how many remote VTEPs."
"diagnose sniffer packet" = "FortiOS: captures packets on an interface (any for all) with a tcpdump-like filter and a verbosity level from 1 to 6."
"test security-policy-match" = "PAN-OS: asks which security rule would match the given zones, addresses, protocol, port and application."
"spanning-tree port-priority" = "A port's priority (0 to 240 in steps of 16, 128 by default): breaks a tie between two equal ways."
"spanning-tree mst configuration" = "Enters the MST region: name <name>, revision <n>, instance <n> vlan <list>; show pending, abort, and exit (which applies it)."
"spanning-tree mst" = "Per MST instance: spanning-tree mst <list> priority <value>, or root primary | secondary."
"show spanning-tree mst" = "MST instances: the region (configuration), one instance's root and port roles (<n>), or all of them; Bound marks a region boundary."
"private-vlan" = "Under vlan <n>: primary, isolated or community; on a primary, association <secondaries> (add and remove change the list)."
"switchport mode private-vlan" = "A port as a private-VLAN host (a machine in a secondary VLAN) or promiscuous (the router or a shared server)."
"switchport private-vlan" = "host-association <primary> <secondary> on a host port; mapping <primary> <secondaries> on a promiscuous port."
"show vlan private-vlan" = "Each primary VLAN with its secondary VLANs, their type (isolated, community) and their ports; type lists the types only."
"show interfaces private-vlan mapping" = "The promiscuous ports and the secondary VLANs each maps."
"storm-control" = "On a port: broadcast | multicast | unicast level <percent> (or pps, bps) drops what goes over it; action shutdown err-disables the port, action trap logs it."
"show storm-control" = "Each port's storm-control levels and whether it is forwarding or blocking that traffic; a port or a kind narrows it."
"ipv6 nd raguard policy" = "Defines a RA guard policy: device-role host (drop router advertisements on its ports, the default) or router."
"ipv6 nd raguard attach-policy" = "On a port: applies a RA guard policy (the default policy without a name)."
"show ipv6 nd raguard policy" = "The RA guard policies: device role and the ports each is attached to."
"ipv6 dhcp guard policy" = "Defines a DHCPv6 guard policy: device-role client (drop DHCPv6 server messages on its ports, the default) or server."
"ipv6 dhcp guard attach-policy" = "On a port: applies a DHCPv6 guard policy."
"show ipv6 dhcp guard policy" = "The DHCPv6 guard policies: device role and the ports each is attached to."
"device-role" = "In a RA guard or DHCPv6 guard policy: what is behind the port (host or router; client or server)."
"ipv6 access-list" = "A named IPv6 list: permit | deny <protocol> <source> <destination> [eq <port>] [<icmp type>] [log], numbered 10, 20...; it ends with permit nd-na, permit nd-ns, deny ipv6 any any."
"ipv6 traffic-filter" = "On an interface: ipv6 traffic-filter <list> in | out (a switch port takes in only)."
"show ipv6 access-list" = "The IPv6 lists, each line with its sequence number and matches; a name shows one."
"clear ipv6 access-list" = "counters: zeroes the matches of the IPv6 lists."
"show processes cpu" = "A switch's CPU load: a switch stuck in a loop's broadcast storm runs near 100%."
"show cdp neighbors" = "Which device is at the far end of each port: switch, router, and the port it is in there."
"no shutdown" = "Brings an interface up; after shutdown it is also how an err-disabled port comes back."
"logging host" = "Sends the device's log lines to a syslog server (UDP 514; transport udp port <n> and format rfc5424 change it)."
"logging trap" = "The most verbose severity sent to the syslog server: informational (6) sends 0 to 6; %LINK-3 is errors (3)."
"service timestamps" = "service timestamps log datetime msec stamps each log line with the device's clock ('*' while NTP has not synced it); uptime stamps the time since boot."
"show logging" = "The device's log buffer, numbered, and how many lines went to each syslog server."
"snmp-server community" = "An SNMP v1/v2c community (the password) for the agent, ro or rw, optionally limited by a standard access list."
"snmp-server host" = "Where SNMP traps go: snmp-server host <ip> version 2c <community>."
"snmp-server enable traps" = "Turns the device's traps on (link down / up, spanning tree); without it a trap host gets nothing."
"snmp-server location" = "Text for sysLocation (and snmp-server contact for sysContact), read by an SNMP manager."
"show snmp" = "The agent, its contact and location, and the trap receivers with how many traps went to each."
"ntp server" = "Points the device's clock at an NTP server; in winlab the router's chrony follows it (its switches share its clock)."
"show ntp status" = "Whether the clock is synchronised, to which reference and at what stratum."
"show ntp associations" = "The configured NTP servers: * is the one in use, reach counts the answers (377 is eight in a row)."
"access-list" = "A standard numbered access list (1 to 99): access-list 10 permit host 10.20.0.30; the first match decides, then an implicit deny."

"switchport port-security" = "On an access port: allow only known addresses; maximum <n>, mac-address sticky or <mac>, violation shutdown | restrict | protect."
"show port-security" = "Secured ports, their maximum, current addresses and violation count; interface <if> for one port's detail and last source address, address for the secure address table."
"clear port-security" = "Forgets secure addresses: all, configured, dynamic or sticky, optionally on one interface."
"errdisable recovery" = "cause psecure-violation brings err-disabled ports back on a timer; interval <seconds> sets it (300 by default)."
"show errdisable recovery" = "Which causes recover on a timer, the interval, and the ports waiting to come back."
"show interfaces status" = "Every port: name, connected / notconnect / disabled / err-disabled, VLAN, duplex and speed."
"aaa new-model" = "Turns on AAA, the switch's framework for asking authentication servers; 802.1X needs it."
"aaa authentication dot1x" = "default group radius: 802.1X asks the RADIUS servers."
"radius server" = "Defines a RADIUS server: address ipv4 <ip> auth-port 1812 acct-port 1813, and key <shared key>."
"dot1x system-auth-control" = "Turns 802.1X on for the switch; without it no port asks anyone."
"authentication port-control" = "On a port: auto (only EAPOL until the server says yes), force-authorized or force-unauthorized."
"dot1x pae authenticator" = "Makes a port an 802.1X authenticator: it speaks EAPOL with the machine and RADIUS with the server."
"show authentication sessions" = "Each 802.1X session: port, address, Auth / Unauth / Running; interface <if> adds the user name and why."
"show radius server-group" = "all: the RADIUS servers, the address requests leave from, and the request, timeout and answer counters."
"ip dhcp snooping" = "DHCP snooping: on with ip dhcp snooping and ip dhcp snooping vlan <list>; server messages on untrusted ports are dropped and the switch learns each lease (no ip dhcp snooping information option with a server that is not a relay)."
"ip dhcp snooping trust" = "On the port the real DHCP server's answers come in on (the uplink, a server's port); every other port stays untrusted."
"ip dhcp snooping limit rate" = "On a port: more DHCP than <pps> a second err-disables it (errdisable recovery cause dhcp-rate-limit)."
"show ip dhcp snooping" = "Whether snooping is on, its VLANs, option 82, and the trusted and rate-limited ports; binding for the leases it learnt, statistics for the drops."
"ip arp inspection vlan" = "Dynamic ARP Inspection: ARP on untrusted ports of these VLANs must match a DHCP snooping binding; ip arp inspection trust on uplinks and fixed-address servers, validate src-mac | dst-mac | ip for more checks."
"show ip arp inspection" = "DAI's VLANs, validation and the forwarded and dropped ARP counts; statistics for the counts alone, interfaces for the trust states."
"aaa authentication login" = "default | <list> then methods in order: group radius, group tacacs+, local, enable, none; the next one only when the one before does not answer."
"aaa authorization exec" = "default then methods: the privilege level a login's session starts at (the server's priv-lvl, or the local user's); without it every login lands at level 1."
"login authentication" = "Under line vty 0 4 or line con 0: which aaa authentication login list the line uses (default when not set)."
"tacacs server" = "Defines a TACACS+ server: address ipv4 <ip> and key <shared key> (port <n> when not 49)."
"test aaa group" = "radius | tacacs+ <user> <password> legacy: asks the servers without logging in; accepted, rejected, or no answer at all."
"show aaa servers" = "Each RADIUS and TACACS+ server with its requests, accepts, rejects, timeouts and answers that did not verify (a key mismatch)."
"show tacacs" = "The TACACS+ servers' connection counters."
"channel-group" = "On the member ports (interface range): channel-group <1-6> mode on | active | passive | desirable | auto bundles them into port-channel <n>."
"interface port-channel" = "The bundle itself: its description, shutdown / no shutdown (how a channel-misconfig err-disable is cleared) and the trunk settings its members inherit."
"port-channel load-balance" = "How a switch picks a member for each frame: src-mac (the 2960's default), dst-mac, src-dst-mac, src-ip, dst-ip, src-dst-ip."
"show etherchannel summary" = "One line per channel group: Po1(SU) in use, (SD) down, and each member's flag: P bundled, I stand-alone, s suspended, D down."
"show lacp neighbor" = "The LACP partner on each member port: its system ID, port number, and whether it is active (A) or passive (P)."
"show interfaces port-channel" = "The bundle as one interface: up or down, its bandwidth (the members' added up) and the members in it."
"monitor session" = "SPAN: monitor session <n> source interface <ports> [rx | tx | both] or source vlan <n>, and destination interface <port> where the capturing PC sits."
"show monitor" = "The SPAN sessions: source ports by direction, the destination port, its encapsulation and that ingress is disabled."
"cdp run" = "CDP for the whole device (on by default); no cdp run stops it. cdp enable / no cdp enable does it per interface."
"show cdp neighbors detail" = "Each CDP neighbour in full: its management address, platform, capabilities, both ports, holdtime and what it says it runs."
"lldp run" = "LLDP for the whole device (off by default on a Catalyst); lldp transmit and lldp receive switch each direction per interface."
"show lldp neighbors" = "Which devices LLDP heard on each port: system name, local port, holdtime, capabilities (T is a telephone) and their port ID; detail adds LLDP-MED."
"switchport voice vlan" = "On an access port: a second VLAN, tagged, for the IP phone; the port advertises it to the phone in LLDP-MED's network policy."
"copy running-config tftp:" = "Saves the configuration to a TFTP server (it asks for the host and the file, hostname-confg by default); copy tftp: running-config merges one back."
"ip domain-name" = "The device's DNS domain; with the hostname it names the RSA key pair SSH needs (SW1.corp.lab)."
"crypto key generate rsa" = "Makes the key pair that turns the SSH server on; modulus 2048 (at least 768 for SSH version 2); crypto key zeroize rsa removes it."
"ip ssh version" = "2 turns SSH version 1 off; show ip ssh says which runs (1.99 means both)."
"show ip ssh" = "Whether SSH is enabled, its version, timeouts and retries, and the public key (and its fingerprint) clients see."
"transport input" = "Under line vty 0 4: which protocols may log in there; ssh alone keeps telnet's clear-text passwords off the network."
"login local" = "Under a line: ask for a user name and its secret from the device's own username list."

"router ospf" = "On the router's console: starts OSPF process <n> (router ospf 1) and enters its mode: router-id, network <address> <wildcard> area <n>, passive-interface, default-information originate."
"router bgp" = "On the router's console: starts BGP in AS <n> and enters its mode: neighbor <ip> remote-as <as>, address-family ipv4, network <ip> mask <mask>."
"show ip ospf neighbor" = "OSPF neighbours: router ID, priority, state (FULL/DR, FULL/BDR, 2WAY...), dead time, address and interface."
"show ip ospf interface" = "Each OSPF interface's area, cost, network type, DR and BDR, and hello and dead timers; brief gives one line each."
"show ip bgp summary" = "BGP neighbours with their AS and state; an Established session shows the number of prefixes received instead."
"show ip protocols" = "The routing protocols the router runs: router ID, the networks each routes for, passive interfaces, BGP neighbours."
"clear ip ospf process" = "Restarts OSPF: needed for a new router-id, or to hold a DR election again."
"default-information originate" = "Under router ospf: advertises a default route to the other OSPF routers (always: even without one in the table)."
"vrf definition" = "Creates a VRF, a routing table of its own: rd <asn>:<n>, address-family ipv4. ip vrf <name> is the older form."
"vrf forwarding" = "On an interface: moves it into a VRF and removes its IP address (type ip address again after it)."
"show ip route vrf" = "A VRF's routing table; show ip vrf lists the VRFs and their interfaces."
"vrrp" = "On an interface: VRRP group <n>, ip <virtual address>, priority <1-254>, preempt, timers advertise <s>; show vrrp brief shows Master or Backup."
"standby" = "HSRP on an interface: standby version 2, standby <g> ip <virtual address> [secondary], priority <0-255>, preempt [delay minimum <s>], timers <hello> <hold>, authentication <text>, track <interface> decrement <n>, name; spoken by winlab's own HSRP speaker (winlab-hsrpd)."
"show standby" = "Each HSRP group: its state (Init, Learn, Listen, Speak, Standby, Active), the Active and Standby routers, virtual IP and MAC, timers, preemption, tracked interfaces; brief gives one line each (P marks preempt)."
"router eigrp" = "On the router's console: starts EIGRP in AS <n> (classic mode) and enters its mode: network <address> [wildcard], passive-interface, eigrp router-id, variance, metric weights 0 k1 k2 k3 k4 k5; FRRouting's eigrpd runs it."
"show ip eigrp neighbors" = "EIGRP neighbours: address, interface, hold time, sequence number; empty when the AS, the K values or the subnet differ."
"show ip eigrp topology" = "EIGRP's topology table: per prefix P (passive) or A (active), the successor count, the feasible distance (FD) and each path's computed/reported distance; all-links adds the paths that are not feasible."
"show ip eigrp interfaces" = "The interfaces EIGRP runs on and how many neighbours each has."
"delay" = "On an interface: EIGRP's delay in tens of microseconds, the part of the metric that adds up along the path (bandwidth is the smallest one)."

"ipv6 unicast-routing" = "On the router's console: makes it an IPv6 router: it forwards IPv6, joins FF02::2 and sends router advertisements on its IPv6 interfaces."
"ipv6 address" = "On an interface: <address>/<len>, <prefix>/64 eui-64 (interface ID from the MAC), FE80::<x> link-local; no ipv6 address removes them."
"ipv6 enable" = "On an interface: IPv6 with only its automatic link-local address, no global one."
"ipv6 nd" = "Router advertisements on an interface: ra suppress, prefix <prefix> [valid preferred] [no-autoconfig | no-advertise], managed-config-flag (M: DHCPv6 for addresses), other-config-flag (O: DHCPv6 for the rest), ra dns server <address>."
"ipv6 route" = "A static IPv6 route: ipv6 route <prefix>/<len> <next hop> [distance]; ::/0 is the default, /128 a host route, a link-local next hop needs its interface, a higher distance makes it floating."
"show ipv6 interface" = "An interface's IPv6: link-local and global addresses ([EUI], [TEN], [ANY]), joined multicast groups, DAD and the RA settings; brief gives the addresses of each."
"show ipv6 route" = "The IPv6 routing table: C connected, L local (/128 of each address), S static, O OSPFv3, with [distance/metric]; static, connected, local or ospf shows one kind."
"show ipv6 neighbors" = "The neighbour cache (IPv6's ARP table): address, MAC, state (REACH, STALE, DELAY, PROBE, INCMP) and interface."
"ping ipv6" = "Pings an IPv6 address from the router; a link-local one needs the output interface after it."

"zone security" = "Names a security zone of the router's zone-based firewall; zone-member security <zone> on an interface puts it in."
"zone-pair security" = "One direction between two zones (source, destination; self is the router): service-policy type inspect <policy> says what may cross."
"class-map type inspect" = "Which traffic, for the zone firewall: match-any or match-all of match protocol <name> and match access-group <list>."
"policy-map type inspect" = "What the zone firewall does per class: inspect (stateful, the replies come back), pass (one way), drop [log]; class-default drops by default."
"show zone security" = "The zones and their member interfaces; self is the router itself."
"show policy-map type inspect zone-pair" = "Each zone-pair's classes with their matches and counters; sessions lists the inspected connections open now."
"crypto ikev2 proposal" = "IKEv2's ciphers: encryption aes-cbc-256, integrity sha256, group 14; offered by a crypto ikev2 policy."
"crypto ikev2 keyring" = "The pre-shared keys, one per peer: peer <name>, address <ip>, pre-shared-key <key>."
"crypto ikev2 profile" = "One peer's IKEv2: match identity remote address, authentication local and remote pre-share, keyring local."
"crypto ipsec transform-set" = "How ESP protects the traffic: esp-aes 256 esp-sha256-hmac, or esp-gcm 256; mode tunnel."
"crypto ipsec profile" = "Ties a transform set (set transform-set) to an IKEv2 profile (set ikev2-profile) for tunnel protection; set pfs adds fresh Diffie-Hellman keys."
"tunnel mode ipsec ipv4" = "Makes interface Tunnel<n> a static virtual tunnel interface (VTI): what is routed into it is encrypted, with tunnel protection ipsec profile."
"show crypto ikev2 sa" = "The IKEv2 security associations: local and remote address, READY when the peers agreed, the ciphers and DH group."
"show crypto ipsec sa" = "The IPsec SAs per tunnel: packets encrypted (encaps) and decrypted (decaps), the SPIs each way and their lifetimes."
"class-map match-any" = "A QoS class: match dscp, match access-group, match protocol or match any; match-all needs every line to match."
"policy-map" = "What each QoS class gets: priority, bandwidth, shape average, police, set dscp, fair-queue, or a child service-policy."
"service-policy" = "Attaches a policy-map: output or input on an interface, or as the child under a class of another policy-map."
"shape average" = "Holds a class (or class-default, for the whole line) to a rate in bit/s, queueing what exceeds it."
"show policy-map interface" = "Per class on an interface: packets matched, packets marked, the queue and what the police or the shaper dropped."

"terminal length" = "Lines per screen for this session; 0 turns the --More-- pager off, the first thing Netmiko and Ansible send."
"terminal width" = "Columns for this session (0-512); automation tools set it wide so long lines are not wrapped."
"show privilege" = "Current privilege level is 15 (or 1): what Ansible's become checks before and after enable."
"show hosts" = "The default domain, the name servers and the host table; NAPALM's get_facts builds the FQDN from it."
"ip http secure-server" = "Turns on the router's HTTPS server with its self-signed certificate (TP-self-signed-<n>); RESTCONF needs it."
"ip http authentication local" = "Web and RESTCONF logins checked against the username list (privilege 15 for RESTCONF), not the enable secret."
"restconf" = "Turns on RESTCONF: the router's interfaces, routes and hostname as JSON at https://<router>/restconf/data/."
"show ip http server status" = "Whether the HTTP and HTTPS servers run, their ports, how logins are checked and the certificate's trustpoint."
"show vlan id" = "One VLAN's row of show vlan: name, status and ports (NAPALM's get_vlans asks it VLAN by VLAN)."
"confreg" = "At the router's ROMMON prompt: prints the configuration register, or confreg 0x2142 sets the value the next start uses (reset to apply)."
"config-register" = "In configuration mode on a router: the register the next start uses, 0x2102 to load the startup configuration; show version says will be ... at next reload."
"flash_init" = "At a switch's boot loader (switch:): reads the flash file system so dir, rename and boot can use it."
"rename flash:" = "rename flash:<old> flash:<new>, at the boot loader or in IOS: moving config.text aside makes a switch start without its configuration."
"copy startup-config running-config" = "Merges the saved configuration into the running one, as if typed: the step after a recovery boot, before anything is saved."
"copy tftp: flash:" = "Fetches a file (an image) from a TFTP server into flash: asks for the server, the source file and the name in flash (bootflash: on the router)."
"verify /md5" = "verify /md5 flash:<file> prints the file's MD5; with the published sum after it, says Verified or prints both. verify flash:<file> checks an image's embedded hash."
"boot system" = "boot system flash:<file>: which image the next start loads, tried in order; read from the startup configuration, so save it."
"show boot" = "The boot system list in the running and the startup configuration, the image running now and (router) the configuration register."
"show flash:" = "The files in flash (bootflash: on the router): images, configuration files, sizes and the space left; dir does the same."

"ip nat pool" = "A pool of public addresses for dynamic NAT: ip nat pool <name> <start> <end> netmask <mask> | prefix-length <n>; used by ip nat inside source list <acl> pool <name>."
"ip nat inside source" = "The NAT rule: list <acl> interface <if> overload (PAT on the interface's address), list <acl> pool <name> [overload] (one pool address per host, or shared by port), static <inside> <outside>."
"show ip nat statistics" = "NAT's interfaces (inside and outside), its rules, and per pool the total and allocated addresses and the misses (hosts refused because the pool was full)."
"ip sla" = "An IP SLA operation: ip sla <n>, then icmp-echo <target> [source-interface <if>], frequency <s>, timeout <ms>, threshold <ms>; run by winlab-slad on the router."
"ip sla schedule" = "Starts an operation: ip sla schedule <n> life forever start-time now. An operation never scheduled never runs and its return code stays Unknown."
"track" = "A track object: track <n> ip sla <m> reachability | state, with delay down <s> up <s>; a static route (ip route ... track <n>), HSRP or VRRP can follow it."
"show ip sla statistics" = "Per operation: the latest round-trip time and return code (OK, Timeout, Over threshold, Unknown), the successes and failures; summary gives one line each."
"show track" = "Each track object: Up or Down, what it follows, how many times it changed and what follows it."
"ip ospf authentication" = "On an interface: OSPF authentication, plain text (no argument), message-digest (MD5), null (none) or key-chain <name> (HMAC-SHA); area <id> authentication sets it for an area."
"ip ospf message-digest-key" = "On an interface: ip ospf message-digest-key <id> md5 <key>, the MD5 key OSPF signs and checks hellos with; both ends need the same ID and key."
"key chain" = "A named set of keys: key <id>, key-string <key>, cryptographic-algorithm (md5, hmac-sha-256 and others); routing protocols name the chain."
"ntp authenticate" = "The clock may be set only by NTP servers that authenticate (ntp server <ip> key <id> with a trusted key)."
"ntp authentication-key" = "ntp authentication-key <id> md5 <key>: a symmetric NTP key; ntp trusted-key <id> lets it authenticate a server."
"ntp trusted-key" = "Marks an authentication key as trusted: only trusted keys authenticate NTP servers."
"glbp" = "GLBP on an interface: glbp <g> ip <virtual address>, priority, preempt, load-balancing round-robin | weighted | host-dependent, weighting, timers, authentication text; spoken by winlab's own GLBP speaker (winlab-glbpd)."
"show glbp" = "Each GLBP group: the AVG and Standby VG, the virtual IP, and each forwarder's virtual MAC (0007.b400.XXYY) and owner; brief gives one row for the group and one per forwarder."
"ip multicast-routing" = "Turns multicast forwarding on (FRRouting's pimd on the router); without it ip pim on an interface forwards nothing."
"ip pim sparse-mode" = "On an interface: PIM sparse mode, with IGMP for the hosts of the LAN; dense mode is not on this router."
"ip pim rp-address" = "The rendezvous point for every group, or for the groups a standard ACL permits: ip pim rp-address <address> [<acl>]; every router needs the same one."
"show ip mroute" = "The multicast routing table: (*,G) and (S,G) entries, their flags, the incoming interface and the outgoing interface list."
"show ip pim neighbor" = "PIM neighbours per interface, their uptime and expiry, DR priority and which is the designated router."
"show ip igmp groups" = "The groups hosts joined on each interface, with uptime and expiry."
"router isis" = "Starts IS-IS (FRRouting's isisd): net <area.system-id.00>, is-type level-1 | level-1-2 | level-2-only, metric-style wide, passive-interface, log-adjacency-changes."
"ip router isis" = "On an interface: puts it in IS-IS; isis circuit-type, isis metric and isis network point-to-point tune it."
"show isis neighbors" = "IS-IS adjacencies: system ID (or hostname), level (L1, L2, L1L2), interface, address, state, hold time, circuit ID."

[match]
"id" = '(?<![\w-])id (?:[A-Z][A-Za-z]|-[a-z]|[a-z]+@)'
"ip" = '(?<![\w-])ip (?:addr|a|route|r|link|neigh|-br|-4|rule)\b'
"lp" = '(?<![\w-])lp -d\b'
"nc" = '(?<![\w-])nc -z'
"ss" = '(?<![\w-])ss -[a-z]'
"cat" = '(?<![\w-])cat /'
"route" = '(?<![\w-])route (?:print|add|delete|-n)\b'
"sc" = '(?<![\w-])sc(?:\.exe)? (?:query|qc|config|failure|start|stop|qfailure)\b'
"az" = '(?<![\w-])az (?:[a-z]+)'
"aws" = '(?<![\w-])aws (?:[a-z0-9]+|--)'
"gcloud" = '(?<![\w-])gcloud (?:[a-z]+)'
"grep" = '(?<![\w-])grep (?:-|[\x27"A-Za-z])'
"sudo" = '(?<![\w-])sudo (?:[a-z-])'
"grafana" = '(?<![\w-])grafana (?:cli|server)\b'
"node" = '(?<![\w-])node (?:-v|node_modules/|/)'
"ping" = '(?<![\w-])ping (?:-|[0-9a-z])'
"logger" = '(?<![\w-])logger (?:-|[\x27"])'
"postfix" = '(?<![\w-])postfix (?:reload|status|check|start|stop|flush)\b'
"mount" = '(?<![\w-])mount (?:-|LABEL=|/)'
"curl" = '(?<![\w-])curl (?:-|http)'
"suricata" = '(?<![\w-])suricata (?:-|--)'
"jq" = '(?<![\w-])jq (?:-|\.|\x27)'
"zeek" = '(?<![\w/-])zeek (?:-|--)'
"sigma" = '(?<![\w-])sigma (?:check|convert|list|version|plugin)\b'
"squid" = '(?<![\w-])squid -[kvN]\b'
"mode" = '(?<![\w-])mode COM\d'
"wg" = '(?<![\w-])wg (?:genkey|pubkey|show|set|syncconf)\b'
"ansible" = '(?<![\w-])ansible (?:-|all\b|linux\b|windows\b|[a-z0-9]+\.corp\.lab\b)'
"ssh" = '(?<![\w-])ssh (?:-|[a-z0-9]+[.@])'
"sshd" = '(?<![\w-])sshd -[tTf]\b'
"winrm" = '(?<![\w-])winrm (?:enumerate|get|set|quickconfig|delete|create)\b'
"expand" = '(?<![\w-])expand(?:\.exe)? -F:'
"free" = '(?<![\w-])free -[hm]\b'
"bridge" = '(?<![\w-])bridge (?:fdb|link|vlan)\b'
"bash" = '(?<![\w-])bash -[nxc]\b'
"truncate" = '(?<![\w-])truncate -s\b'
"ipa" = '(?<![\w./-])ipa (?:[a-z][a-z-]+)\b'

"shutdown" = '(?<![\w-])shutdown(?:\.exe)? /[a-z]'
"rename flash:" = '(?<![\w-])rename flash:[\w.-]+ flash:'
"git" = '(?<![\w-])git (?:-C|-c|config|init|add|commit|status|log|show|diff|remote|push|pull|fetch|clone|switch|branch|merge|revert|reset|rev-parse|rm|ls-tree)\b'
"bicep" = '(?<![\w-])bicep (?:build|decompile|lint|format|--version)\b'
"tofu" = '(?<![\w-])tofu (?:init|plan|apply|fmt|validate|state|version|providers|-chdir)\b'
"unzip" = '(?<![\w-])unzip -'
"shred" = '(?<![\w-])shred -u\b'
"format" = '(?<![\w-])format [A-Za-z]: /'
