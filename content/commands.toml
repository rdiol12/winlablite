"wevtutil" = "Event logs from the command line: list, query, size, export, clear."
"winget" = "The Windows package manager: search, install and upgrade applications."
"bcdedit" = "The boot configuration: bcdedit /set {current} safeboot dsrepair boots into DSRM, /deletevalue undoes it."
"ldifde" = "Imports and exports directory objects as LDIF (-i -f file), such as the links an authoritative restore writes."
"ntdsutil" = "AD database maintenance: authoritative restore of a subtree or an object, in DSRM."
"wbadmin.msc" = "The Windows Server Backup console: Backup Once, Backup Schedule, Recover."
"dism" = "Servicing an image or the running Windows: /online /add-package installs an .msu or .cab, /get-packages lists them."
"setup.exe" = "Windows Setup from the DVD: /auto upgrade keeps files and apps, /compat scanonly checks, /dynamicupdate disable stays offline."
"UsoClient" = "The update orchestrator: UsoClient StartScan checks the update server now (Windows 10, 11, Server 2019 on)."
"wsusutil" = "WSUS's own tool: postinstall CONTENT_DIR=, export and import of metadata, reset."
"wusa" = "The Windows Update Standalone Installer: wusa <file>.msu /quiet /norestart."
"mpclaim" = "MPIO's command line: mpclaim -s -d lists MPIO disks, -s -d <n> one disk's paths and policy."
"iscsicpl" = "The iSCSI Initiator's window: Targets, Discovery, Favorite Targets, Configuration (the IQN)."
"mode" = "Shows and sets a serial port's line: mode COM2 BAUD=9600 PARITY=n DATA=8 STOP=1 (a console port's 9600 8N1); mode alone lists the COM ports."
