"netdom" = "Domain tools from the command line: netdom query fsmo lists the operations master role holders."
"dfsrmig" = "SYSVOL's migration from FRS to DFSR: /getglobalstate says Eliminated when DFSR alone replicates SYSVOL."
"cmdkey" = "Credential Manager from the command line: /list shows saved credentials for servers, /delete removes one."
"robocopy" = "Robust file copy: /E /MOVE /COPYALL moves a folder tree with its permissions, owner and timestamps; /LOG: writes what it did."

"wecutil" = "The Windows Event Collector's command line: qc sets up the collector, cs creates a subscription from XML, es lists them, gs shows one, gr shows each source's state."
"LGPO.exe" = "Microsoft's local policy tool from the Security Compliance Toolkit: /b backs up local policy, /g applies a GPO backup, /s a security template, /ac an audit CSV."
"PolicyAnalyzer" = "Microsoft's Policy Analyzer from the Security Compliance Toolkit: compares GPO backups and a machine's effective state as rule sets, showing every difference."
"choco" = "Chocolatey, the Windows package manager: install, upgrade, list, uninstall, source list/add/remove/disable, new and pack for your own packages."
"scanstate.exe" = "USMT's capture tool: collects user profiles, documents and settings into a store, by the rules in /i: XML files; /ue: and /ui: pick the users, /encrypt protects the store, /hardlink /nocompress makes a hard-link store."
"loadstate.exe" = "USMT's restore tool: applies a store made by scanstate to a PC, with the same /i: rule files; /decrypt with the key opens an encrypted store."
"usmtutils.exe" = "USMT's store utility: /verify checks a store is intact, /rd removes a hard-link store, /ec extracts files from a compressed store."
"OfficeC2RClient.exe" = "Microsoft 365 Apps' Click-to-Run client: /update user checks the update source now and installs a newer build of the PC's channel."
"fsutil" = "File system tool: fsutil hardlink list <file> shows every name an NTFS file has, fsutil volume diskfree the space left, fsutil file createnew <path> <bytes> makes a file of that size at once."
"adksetup.exe" = "The Windows ADK installer: /features OptionId.UserStateMigrationTool installs one feature, /layout <folder> downloads an offline copy, /quiet runs it without a window."

"expand" = "Unpacks a Microsoft cabinet (.cab): expand -F:* <file>.cab <folder> extracts every file in it."

"CiTool" = "App Control for Business on the PC: --list-policies (-lp) shows active policies, --update-policy deploys a .cip without a restart, --remove-policy takes one off; -json for scripts."
"msinfo32" = "System Information: System Summary shows BIOS Mode, Secure Boot State, virtualization-based security and the services running in it."
"dsregcmd" = "Device registration status: /status shows Entra ID and domain join, SSO state and, in the user's session, the Windows Hello for Business prerequisite check."
"MBR2GPT" = "Converts an MBR system disk to GPT in place for UEFI: /validate checks it, /convert writes the EFI system partition and boot files; /allowFullOS runs it from Windows instead of WinPE."


