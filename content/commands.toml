"Get-CMDevice" = "Finds devices in the site by name or collection: ResourceID, client status, last activity."
"Get-CMSoftwareUpdate" = "Lists software updates in the site's catalogue (-Fast skips lazy properties): title, article ID, NumMissing, NumPresent, IsDeployed."
"Invoke-CMSoftwareUpdateAutoDeploymentRule" = "Runs an automatic deployment rule now instead of on its schedule (Run Now in the console)."
"New-CMApplication" = "Creates an application in Configuration Manager: name, publisher, version; deployment types are added to it afterwards."
"New-CMApplicationDeployment" = "Deploys an application to a collection: -DeployAction Install, -DeployPurpose Available or Required, -AvailableDateTime, -DeadlineDateTime, -UserNotification."
"New-CMMaintenanceWindow" = "Adds a maintenance window to a collection from a New-CMSchedule schedule; -ApplyTo Any, SoftwareUpdatesOnly or TaskSequencesOnly."
"New-CMOperatingSystemImage" = "Imports a .wim as an operating system image (-Path on a UNC share), ready to distribute and use in a task sequence."
"New-CMSchedule" = "Builds a Configuration Manager schedule (a start, an end or duration, a recurrence such as -DayOfWeek) for maintenance windows, rules and collections."
"New-CMTaskSequenceDeployment" = "Deploys a task sequence to a collection: -DeployPurpose Available or Required, -Availability (clients only, or clients, media and PXE)."
"Remove-CMApplicationDeployment" = "Deletes an application's deployment to a collection."
"Set-CMDistributionPoint" = "Changes a distribution point: PXE (-EnablePxe, -AllowPxeResponse, -EnableUnknownComputerSupport, -EnableNonWdsPxe), boundary groups, content validation."
"Set-CMSoftwareUpdatePointComponent" = "Sets the site's software update options: synchronisation source (-SynchronizeAction, including none for a disconnected site), products, classifications, languages, schedule."
"Start-CMContentDistribution" = "Sends an application's, package's, boot image's or OS image's content to distribution points or groups."
"Sync-CMSoftwareUpdate" = "Starts a software update synchronisation of the site with its software update point (-FullSync)."

"New-CIPolicy" = "Creates an App Control for Business policy XML from a scan of files (-ScanPath, -Level FilePublisher, -Fallback Hash, -UserPEs); -MultiplePolicyFormat for a base or supplemental policy."
"Set-CIPolicyIdInfo" = "Names an App Control policy (-PolicyName), gives it a new PolicyID (-ResetPolicyID) or makes it a supplemental policy of a base (-SupplementsBasePolicyID)."
"Set-RuleOption" = "Adds or (-Delete) removes an App Control rule option by number: 3 Audit Mode, 9 and 10 boot recovery, 11 Disabled:Script Enforcement, 17 Allow Supplemental Policies."
"Set-CIPolicyVersion" = "Sets an App Control policy's version; an update deployed with CiTool must carry an equal or higher one."
"ConvertFrom-CIPolicy" = "Compiles an App Control policy XML to the binary .cip (named after its PolicyID) that CiTool or Intune deploys."
"ConvertFrom-Json" = "Turns JSON text into objects, for a tool that prints JSON (CiTool -json, a REST answer)."
"Get-ProcessMitigation" = "Shows exploit protection settings: -System for everything, -Name <exe> for one program; -RegistryConfigFilePath exports them to XML."
"Set-ProcessMitigation" = "Turns exploit protection mitigations on or off (-Enable, -Disable) for -System or a program -Name; -PolicyFilePath applies an exported XML."
"ConvertTo-ProcessMitigationPolicy" = "Converts an old EMET settings file into exploit protection XML."
"Initialize-ADDeviceRegistration" = "Prepares Active Directory for AD FS's Device Registration Service (the container and objects registered devices are written to)."
"Enable-AdfsDeviceRegistration" = "Turns on the Device Registration Service on an AD FS farm, which Windows Hello for Business on-premises uses to register PCs and keys."

# Windows 11 cloud desktops (autopilot-register): run on your own PC outside the lab, which has no Internet
"Install-Script" = "Installs a script from the PowerShell Gallery (needs the Internet), for example Install-Script -Name Get-WindowsAutopilotInfo -Force."
"Get-WindowsAutopilotInfo" = "A Microsoft script from the PowerShell Gallery that reads a PC's Windows Autopilot hardware hash: -OutputFile for a CSV to import, -GroupTag, -Online to upload it straight to Intune."

"Measure-Command" = "Runs a script block and returns how long it took (TotalSeconds): a quick way to time a file copy before and after a change."

# Secure Boot and the firmware's boot mode (secure-boot-and-firmware-modes)
"Get-SecureBootUEFI" = "Reads one Secure Boot variable from the firmware (-Name PK, KEK, db or dbx): its Bytes hold the signature lists, with the certificates' names readable inside."

"Set-DnsServerPrimaryZone" = "Changes a primary DNS zone on Windows DNS: -SecureSecondaries (NoTransfer, TransferToSecureServers with -SecondaryServers, TransferToZoneNameServer) and -Notify (NotifyServers with -NotifyServers) decide who may copy it and who is told of changes."
"Add-DnsServerZoneDelegation" = "Delegates a child zone to other name servers: -Name corp.lab -ChildZoneName dev -NameServer ns01.dev.corp.lab -IPAddress <glue>."
"Get-DnsServerZoneDelegation" = "Lists the delegations in a zone, or one child (-ChildZoneName), with each name server and its glue address."
"New-DfsnRoot" = "Creates a DFS namespace (-Path \\\\domain\\Name, -TargetPath the root share on a namespace server, -Type DomainV2 for domain-based)."
"New-DfsnRootTarget" = "Adds another namespace server (its root share) to a namespace."
"Get-DfsnRoot" = "Shows a DFS namespace: its type, state and flags (access-based enumeration among them)."
"Set-DfsnRoot" = "Changes a namespace's settings, such as -EnableAccessBasedEnumeration and the referral TTL."
"Get-DfsnRootTarget" = "Lists the namespace servers that host a namespace's root."
"New-DfsnFolder" = "Creates a folder in a DFS namespace that points at a share (-TargetPath)."
"Get-DfsnFolder" = "Lists the folders of a DFS namespace (-Path '\\\\domain\\Name\\*')."
"Set-DfsnFolderTarget" = "Changes a namespace folder target: -State Online or Offline, -ReferralPriorityClass."
"Add-PrinterDriver" = "Installs a printer driver from the driver store on a print server (-Name 'Microsoft PCL6 Class Driver'), so queues can use it."
"Get-PrinterDriver" = "Lists the printer drivers installed on a computer, with their version (MajorVersion 3 or 4) and manufacturer."
"Remove-PrinterDriver" = "Removes a printer driver that no queue uses any more."
"Remove-PrinterPort" = "Deletes a printer port no queue uses (a TCP/IP port to a printer that is gone)."
"Disable-NetFirewallRule" = "Switches a Windows Firewall rule off without deleting it (-Name or -DisplayName), so Enable-NetFirewallRule can bring it back."
"Remove-NetFirewallRule" = "Deletes a Windows Firewall rule (-Name or -DisplayName); disable it first if you may want it back."
"Add-PartitionAccessPath" = "Gives a partition a drive letter (-AssignDriveLetter) or a mount folder (-AccessPath C:\\Archive, an empty NTFS folder)."
"Resize-Partition" = "Extends or shrinks a partition to -Size; Get-PartitionSupportedSize says how small and how large it can be."
"Clear-Disk" = "Removes every partition and the partition table from a disk (-RemoveData, -RemoveOEM); it does not overwrite the data, diskpart clean all does."
"Set-NetConnectionProfile" = "Sets a network's category (-NetworkCategory Private or Public) for an interface; Domain is chosen by Windows itself."
"New-LocalUser" = "Creates a local account on this PC (-Name, -Password as a SecureString, -Description); add it to a local group with Add-LocalGroupMember."
"Get-DhcpServerv4Filter" = "Lists the MAC addresses on a Windows DHCP server's Allow or Deny filter (-List Allow or Deny)."
"Get-DhcpServerv4FilterList" = "Shows whether a Windows DHCP server enforces its Allow list and its Deny list."
"Add-DhcpServerv4Filter" = "Puts a MAC address on a Windows DHCP server's Allow or Deny filter (-List, -MacAddress, -Description)."
"Remove-DhcpServerv4Filter" = "Takes a MAC address off a Windows DHCP server's filters (-MacAddress)."
"Add-AppxPackage" = "Installs an app package (.msix, .msixbundle, .appx) for the current user from a file, checking its publisher's signature: -Path <file>."
"Get-WindowsOptionalFeature" = "Lists Windows' optional features and their state (-Online for this PC; -FeatureName Microsoft-Hyper-V-All, Containers-DisposableClientVM)."
"Enable-WindowsOptionalFeature" = "Turns on an optional Windows feature (-Online -FeatureName <name>, -All for its parents, -NoRestart); most ask for a restart."

# Windows Server hybrid (SET, Storage Spaces Direct, quorum, CAU, SMB over QUIC, IPAM, BranchCache, Azure File Sync)
"Add-CauClusterRole" = "Cluster-Aware Updating: adds the CAU clustered role for self-updating mode (-ClusterName, -CauPluginName, -CauPluginArguments, a schedule such as -DaysOfWeek and -WeeksOfMonth, -EnableFirewallRules)."
"Add-ClusterScaleOutFileServerRole" = "Adds a Scale-Out File Server role to a cluster: an active-active file server for application data on Cluster Shared Volumes (-Name)."
"Add-IpamBlock" = "IPAM: adds an IP address block to the address space (-NetworkId 10.20.0.0/16)."
"Add-IpamDiscoveryDomain" = "IPAM: adds a domain for server discovery, with which roles to discover (-DiscoverDc, -DiscoverDns, -DiscoverDhcp)."
"Add-VMNetworkAdapter" = "Hyper-V: adds a network adapter to a VM, or with -ManagementOS a host vNIC on a virtual switch (-Name, -SwitchName)."
"Add-VMSwitchTeamMember" = "Hyper-V: adds a physical network card to a Switch Embedded Teaming switch (-VMSwitchName, -NetAdapterName)."
"Clear-BCCache" = "BranchCache: deletes everything in this computer's BranchCache cache."
"Disable-NetAdapter" = "Turns a network adapter off, as unplugging it would (-Name; -Confirm:$false to skip the question)."
"Enable-BCHostedClient" = "BranchCache: puts this computer in hosted cache client mode, using the hosted cache servers named (-ServerNames)."
"Enable-BCHostedServer" = "BranchCache: makes this server a hosted cache server for a branch (-RegisterSCP publishes it in AD for automatic discovery)."
"Enable-ClusterStorageSpacesDirect" = "Enables Storage Spaces Direct on a cluster: claims the nodes' eligible local drives and builds the pool (-PoolFriendlyName). Datacenter edition."
"Enable-NetAdapter" = "Turns a disabled network adapter back on (-Name)."
"Export-BCCachePackage" = "BranchCache: exports the data staged by Publish-BCFileContent as a package to preload a hosted cache (-Destination)."
"Find-IpamFreeAddress" = "IPAM: suggests free IP addresses in a range (piped from Get-IpamRange; -NumAddress how many)."
"Get-BCClientConfiguration" = "BranchCache: shows this client's mode (Disabled, DistributedCache, HostedCacheClient) and its hosted cache servers."
"Get-BCDataCache" = "BranchCache: shows the data cache's location, maximum and current size."
"Get-BCHostedCacheServerConfiguration" = "BranchCache: shows whether this server is a hosted cache server and how clients find and authenticate to it."
"Get-BCStatus" = "BranchCache: everything at once: whether it is on, the service, client mode, content server, hosted cache, caches and firewall."
"Get-CauClusterRole" = "Cluster-Aware Updating: shows the CAU clustered role's settings for a cluster (-ClusterName)."
"Get-CauReport" = "Cluster-Aware Updating: the reports of past updating runs (-ClusterName; -Last -Detailed for the latest, node by node)."
"Get-Cluster" = "Shows a failover cluster and its properties, such as DynamicQuorum and WitnessDynamicWeight."
"Get-HealthFault" = "Storage Spaces Direct: the faults the cluster's Health Service currently sees, with the reason and a recommended action."
"Get-IpamRange" = "IPAM: lists the IP address ranges in IPAM, such as the ranges taken from DHCP scopes."
"Get-NetLbfoTeam" = "Lists LBFO (NIC Teaming) teams on this server; on a Hyper-V host using Switch Embedded Teaming it should be empty."
"Get-NetUDPEndpoint" = "Lists UDP endpoints this computer listens on (-LocalPort 443 for SMB over QUIC), with the owning process."
"Get-SmbServerCertificateMapping" = "SMB over QUIC: lists the names mapped to certificates on this SMB server, with thumbprint and store."
"Get-VMNetworkAdapterTeamMapping" = "Hyper-V: shows which physical card of a SET team a host or VM network adapter is pinned to (-ManagementOS, -VMNetworkAdapterName)."
"Get-VMSwitchTeam" = "Hyper-V: shows a Switch Embedded Teaming switch's team: its member cards, teaming mode and load balancing (-Name)."
"Import-BCCachePackage" = "BranchCache: loads a package made by Export-BCCachePackage into this computer's cache, to preload a hosted cache (-Path)."
"Invoke-AzStorageSyncChangeDetection" = "Az.StorageSync (Cloud Shell or Az PowerShell): starts change detection on an Azure File Sync cloud endpoint, so files changed directly in the Azure file share sync sooner."
"Invoke-CauRun" = "Cluster-Aware Updating: runs an updating run now: node by node drain, install, restart, resume (-ClusterName, -CauPluginName, -MaxFailedNodes, -RequireAllNodesOnline)."
"Invoke-CauScan" = "Cluster-Aware Updating: lists what an updating run would install on each node, without installing anything."
"Invoke-IpamGpoProvisioning" = "IPAM: creates and links the IPAM_DC_NPS, IPAM_DHCP and IPAM_DNS GPOs that give the IPAM server its rights on managed servers (-Domain, -GpoPrefixName, -IpamServerFqdn)."
"New-SmbMapping" = "Maps a drive letter to an SMB share for the signed-in user (-LocalPath R:, -RemotePath; on Windows 11 -TransportType QUIC for SMB over QUIC)."
"New-SmbServerCertificateMapping" = "SMB over QUIC: maps a name clients use to a certificate in the computer's store (-Name, -Thumbprint, -StoreName My)."
"New-Volume" = "Creates a volume from a storage pool in one step: virtual disk, partition and file system; on Storage Spaces Direct a Cluster Shared Volume (-FileSystem CSVFS_ReFS, -ResiliencySettingName, -Size)."
"Publish-BCFileContent" = "BranchCache: computes the hashes of files on a content server ahead of time (-Path; -StageData to prepare an export package)."
"Remove-VMSwitch" = "Hyper-V: deletes a virtual switch; VMs connected to it lose their network."
"Remove-VMSwitchTeamMember" = "Hyper-V: takes a physical card out of a Switch Embedded Teaming switch (-VMSwitchName, -NetAdapterName)."
"Set-BCMinSMBLatency" = "BranchCache: the round-trip time above which clients use BranchCache for SMB (default 80 ms; -LatencyMilliseconds 0 always)."
"Set-IpamServerInventory" = "IPAM: changes a server in IPAM's inventory, such as its manageability status (-Name, -ManageabilityStatus Managed)."
"Set-VMNetworkAdapterTeamMapping" = "Hyper-V: pins a host or VM network adapter to one physical card of a SET team (-ManagementOS, -VMNetworkAdapterName, -PhysicalNetAdapterName)."
"Set-VMSwitchTeam" = "Hyper-V: changes a SET team's settings, such as -LoadBalancingAlgorithm HyperVPort or Dynamic."
"Start-ClusterNode" = "Starts the cluster service on a node that was stopped, so it rejoins the cluster (-Name)."
"Stop-ClusterNode" = "Stops the cluster service on a node; its roles fail over to the others (-Name)."
"Test-CauSetup" = "Cluster-Aware Updating: checks that a cluster meets CAU's requirements (remoting, firewall rules, tools on each node) and lists what is missing."

[windows]
"chkdsk" = "Checks a volume's file system: /scan online and read-only, /f fixes (offline, or at the next start for the system drive), /r also looks for bad sectors."
"sfc" = "System File Checker: sfc /scannow verifies and repairs Windows' protected files from the component store; logs [SR] lines to C:\\Windows\\Logs\\CBS\\CBS.log."
"winver" = "Shows the Windows edition, version and build in a small window."
"optionalfeatures" = "Turn Windows features on or off: the window that adds Hyper-V, Windows Sandbox and the other optional features."
"windbg" = "WinDbg, the Windows debugger: File, Open dump file; !analyze -v names the bug check and the driver; lm lists modules; .logopen saves the output."
"bcdboot" = "Writes fresh boot files and a boot entry for an installed Windows: bcdboot D:\\Windows /s S: /f UEFI (or BIOS, ALL)."
"bootrec" = "Legacy BIOS boot repair in WinRE: /fixmbr, /fixboot, /scanos, /rebuildbcd."
"reagentc" = "Manages the Windows Recovery Environment: /info (status and location), /enable, /disable, /boottore (start it at the next restart)."
"msconfig" = "System Configuration: Normal, Diagnostic or Selective startup, the Services tab (Hide all Microsoft services) and the Boot tab (Safe boot, timeout)."
"diskpart" = "The disk partitioning console: list disk, select disk, clean, convert gpt, create partition efi/msr/primary, format, assign letter, list volume."
"rstrui" = "System Restore: pick a restore point, scan for affected programs, restore (and undo the last restore)."
"perfmon" = "Performance Monitor: live counters, Data Collector Sets and reports; perfmon /rel opens Reliability Monitor, perfmon /res Resource Monitor."
"resmon" = "Resource Monitor: processor, memory (hard faults, commit), disk activity per file and network per process."
"tasklist" = "Lists running processes with their ids; tasklist /fi \"PID eq 4120\" finds one, /svc shows the services in each."
"mountvol" = "Lists and mounts volumes; mountvol S: /s gives the EFI system partition a letter, mountvol S: /d removes it."
"Autoruns" = "Sysinternals: every place Windows starts programs from (Run keys, tasks, services, drivers, Explorer add-ins) in one list. Not part of Windows: fetch it from Microsoft yourself."
"shutdown" = "Restarts or shuts down: /r restart, /s shut down, /t seconds, /c a message, /a abort, /o to the recovery environment, /m \\\\computer for another PC."
"dockerd" = "The Docker daemon; on Windows, dockerd --register-service makes it the docker service."
"schtasks" = "Windows' scheduled tasks from the command line: /query /fo LIST /v lists them with their actions, /create /tn <name> /tr <program> /sc <schedule> makes one, /delete /tn <name> /f removes it."
"msiexec" = "Installs or removes a Windows Installer package: msiexec /i <file.msi> /qn installs silently."
"odbcad32" = "The ODBC Data Source Administrator: DSNs, drivers, and the Test button of a driver's setup dialog."
"ccmsetup" = "Installs the Configuration Manager client (/mp:, /source:, SMSSITECODE=); logs to C:\\Windows\\ccmsetup\\Logs."
"CMTrace" = "Configuration Manager's log viewer: follows a log live and highlights errors."
"auditpol" = "Shows and sets the advanced audit policy (auditpol /get /category:*)."
"printbrm" = "Print server backup and restore (C:\\Windows\\System32\\spool\\tools\\PrintBrm.exe): -B writes queues, ports and drivers to a .printerExport file, -R restores them, -S names a remote server."
"dfsrdiag" = "DFS Replication diagnostics: dfsrdiag backlog /rgname: /rfname: /smem: /rmem: counts what one member has not sent the other yet."
"vssadmin" = "Volume Shadow Copy administration: list shadowstorage, resize shadowstorage /maxsize=, list writers."
"certutil" = "Certificate and CA tool: dump a certificate, ping a CA, publish or check a CRL."
"ktpass" = "Makes a keytab for a Linux service on the DC: -princ HTTP/<host>@<REALM> -mapuser <account> -crypto AES256-SHA1 -pass * -out <file>; sets the SPN and the account's key."
"certreq" = "Requests a certificate from a CA: certreq -submit -attrib CertificateTemplate:<template> a CSR made elsewhere (openssl on Linux)."
"scp" = "OpenSSH's copy over SSH, built into Windows too: scp user@host:file C:\\folder\\."
"dcdiag" = "Diagnoses a domain controller: DNS, replication, services, SYSVOL."
"dsacls" = "Shows and changes permissions on Active Directory objects."
"dsa.msc" = "Active Directory Users and Computers, the classic console."
"gpmc.msc" = "The Group Policy Management console."
"printmanagement.msc" = "Print Management: every print server's queues, ports and drivers, driver isolation, and Deploy with Group Policy."
"gpresult" = "Shows which GPOs applied to a user and computer, and which were filtered out (/r, /h)."
"gpupdate" = "Refreshes Group Policy now (/force reapplies everything)."
"MeshAgent.exe" = "MeshCentral's agent for Windows: -fullinstall installs it as the Mesh Agent service (its server and device group are inside the file), -fulluninstall removes it."
"icacls" = "Shows and changes NTFS permissions on files and folders."
"ipconfig" = "Shows IP configuration; /all for everything, /flushdns, /renew, /registerdns."
"klist" = "Lists Kerberos tickets (klist purge clears them; on Linux klist -k reads a keytab)."
"manage-bde" = "The BitLocker command-line tool: status, protectors, encryption."
"mstsc" = "The Remote Desktop client."
"netsh" = "The network shell: interfaces, firewall, RRAS, HTTP bindings and more."
"oscdimg" = "The Windows ADK's ISO maker (Deployment Tools): oscdimg -n -m <folder> <file.iso>; not in Windows itself."
"netsh lan" = "Wired AutoConfig (802.1X on a wired adapter): show interfaces (the state and the user signed in), show profiles, export and add profile, reconnect."
"netsh wlan" = "WLAN AutoConfig, a real laptop's Wi-Fi: show interfaces, show networks, show profiles, add profile filename=<xml> (a WPA2-Enterprise profile with PEAP)."
"netsh nps" = "NPS from the command line: show config, show client, show np (the network policies), export filename= exportPSK=YES."
"netstat" = "Lists connections and listening ports (-ano adds the process id)."
"nltest" = "Netlogon test: which DC and site a machine uses (/dsgetdc, /dsgetsite), secure channel (/sc_verify)."
"nslookup" = "Queries DNS interactively or once; set type=SRV to read locator records."
"ping" = "Sends ICMP echo to test reachability (Linux too)."
"pnputil" = "Manages the driver store: /enum-drivers, /add-driver, /delete-driver."
"powershell.exe" = "Windows PowerShell 5.1; -ExecutionPolicy and -File run a script."
"repadmin" = "Active Directory replication: /replsummary, /showrepl, /syncall, DSA options."
"route" = "Shows and changes the routing table (route print)."
"sc" = "Talks to the service control manager: query, qc, config, failure."
"sconfig" = "The Server Core text menu: name, network, domain, updates, remote management."
"secedit" = "Exports, analyses and applies security templates."
"sysprep" = "Generalises a Windows installation for imaging (sysprep /generalize /oobe /shutdown)."
"systeminfo" = "The machine's summary; its last lines, Hyper-V Requirements, say whether the processor shows VT-x (VM Monitor Mode Extensions) or a hypervisor already runs."
"tracert" = "Traces the routers on the path to a destination."
"vmconnect" = "Opens a Hyper-V VM's console: vmconnect localhost <vm name>."
"w32tm" = "Windows Time: /query /source and /status, /resync, /stripchart, /config."
"wbadmin" = "Windows Server Backup from the command line: system state, versions, recovery."
"wdsutil" = "Windows Deployment Services from the command line: /initialize-server, /set-server, /get-server, /new-captureimage."
"wevtutil" = "Event logs from the command line: list, query, size, export, clear."
"Sysmon64" = "Microsoft Sysinternals System Monitor: -accepteula -i <config> installs the driver and service, -c <config> loads a new configuration, -c alone prints the running one, -s the schema, -u uninstalls."
"quser" = "Lists the users signed in to this machine (console and RDP), with session ids and idle time."
"runas" = "Starts a program as another user (/user:DOMAIN\\name); a wrong password makes a failed logon (4625) on purpose for testing."
"winget" = "The Windows package manager: search, install and upgrade applications."
"bcdedit" = "The boot configuration: bcdedit /set {current} safeboot dsrepair boots into DSRM, /deletevalue undoes it."
"ldifde" = "Imports and exports directory objects as LDIF (-i -f file), such as the links an authoritative restore writes."
"ntdsutil" = "AD database maintenance: authoritative restore of a subtree or an object, in DSRM."
"wbadmin.msc" = "The Windows Server Backup console: Backup Once, Backup Schedule, Recover."
"dism" = "Servicing an image or the running Windows: /online /add-package installs an .msu or .cab, /get-packages lists them."
"setup.exe" = "Windows Setup from the DVD: /auto upgrade keeps files and apps, /compat scanonly checks, /dynamicupdate disable stays offline."
"UsoClient" = "The update orchestrator: UsoClient StartScan checks the update server now (Windows 10, 11, Server 2019 on)."
"wsusutil" = "WSUS's own tool: postinstall CONTENT_DIR=, export and import of metadata, reset."
"wusa" = "The Windows Update Standalone Installer: wusa <file>.msu /quiet /norestart."
"mpclaim" = "MPIO's command line: mpclaim -s -d lists MPIO disks, -s -d <n> one disk's paths and policy."
"iscsicpl" = "The iSCSI Initiator's window: Targets, Discovery, Favorite Targets, Configuration (the IQN)."
"mode" = "Shows and sets a serial port's line: mode COM2 BAUD=9600 PARITY=n DATA=8 STOP=1 (a console port's 9600 8N1); mode alone lists the COM ports."
"setspn" = "Reads and writes Service Principal Names: -S adds (refusing duplicates), -L lists an account's, -Q finds a holder, -X lists duplicates, -D deletes."
"certtmpl.msc" = "The Certificate Templates console: duplicate a template, set its subject, validity and who may enrol."
"certsrv.msc" = "The Certification Authority console: issued and pending certificates, templates to issue, CRLs."
"certlm.msc" = "The local computer's certificate stores (Personal, Trusted Root), as the console shows them."
"dnsmgmt.msc" = "DNS Manager: zones and records (New Host, New Alias), aging, the server's cache."
"inetmgr" = "IIS Manager: sites, bindings, application pools, authentication and certificates."
"iisreset" = "Stops and starts every IIS service at once; it changes no configuration."
"rasdial" = "Connects and disconnects a VPN or dial-up connection from the command line: rasdial \"Corp VPN\" <user> *, rasdial \"Corp VPN\" /disconnect, rasdial lists what is connected."
"rrasmgmt.msc" = "The Routing and Remote Access console: the server's ports, address pool, security (RADIUS, SSL certificate binding), NAT, connected clients."
"nps.msc" = "The Network Policy Server console: RADIUS clients, connection request and network policies in processing order, accounting."
"winrm" = "WinRM's own command line: winrm enumerate winrm/config/listener lists the listeners, winrm get winrm/config the settings, winrm quickconfig sets up remoting."
"netdom" = "Domain tools from the command line: netdom query fsmo lists the operations master role holders."
"dfsrmig" = "SYSVOL's migration from FRS to DFSR: /getglobalstate says Eliminated when DFSR alone replicates SYSVOL."
"cmdkey" = "Credential Manager from the command line: /list shows saved credentials for servers, /delete removes one."
"robocopy" = "Robust file copy: /E /MOVE /COPYALL moves a folder tree with its permissions, owner and timestamps; /LOG: writes what it did."

"wecutil" = "The Windows Event Collector's command line: qc sets up the collector, cs creates a subscription from XML, es lists them, gs shows one, gr shows each source's state."
"LGPO.exe" = "Microsoft's local policy tool from the Security Compliance Toolkit: /b backs up local policy, /g applies a GPO backup, /s a security template, /ac an audit CSV."
"PolicyAnalyzer" = "Microsoft's Policy Analyzer from the Security Compliance Toolkit: compares GPO backups and a machine's effective state as rule sets, showing every difference."
"choco" = "Chocolatey, the Windows package manager: install, upgrade, list, uninstall, source list/add/remove/disable, new and pack for your own packages."
"scanstate.exe" = "USMT's capture tool: collects user profiles, documents and settings into a store, by the rules in /i: XML files; /ue: and /ui: pick the users, /encrypt protects the store, /hardlink /nocompress makes a hard-link store."
"loadstate.exe" = "USMT's restore tool: applies a store made by scanstate to a PC, with the same /i: rule files; /decrypt with the key opens an encrypted store."
"usmtutils.exe" = "USMT's store utility: /verify checks a store is intact, /rd removes a hard-link store, /ec extracts files from a compressed store."
"OfficeC2RClient.exe" = "Microsoft 365 Apps' Click-to-Run client: /update user checks the update source now and installs a newer build of the PC's channel."
"fsutil" = "File system tool: fsutil hardlink list <file> shows every name an NTFS file has, fsutil volume diskfree the space left, fsutil file createnew <path> <bytes> makes a file of that size at once."
"adksetup.exe" = "The Windows ADK installer: /features OptionId.UserStateMigrationTool installs one feature, /layout <folder> downloads an offline copy, /quiet runs it without a window."

"expand" = "Unpacks a Microsoft cabinet (.cab): expand -F:* <file>.cab <folder> extracts every file in it."

"CiTool" = "App Control for Business on the PC: --list-policies (-lp) shows active policies, --update-policy deploys a .cip without a restart, --remove-policy takes one off; -json for scripts."
"msinfo32" = "System Information: System Summary shows BIOS Mode, Secure Boot State, virtualization-based security and the services running in it."
"dsregcmd" = "Device registration status: /status shows Entra ID and domain join, SSO state and, in the user's session, the Windows Hello for Business prerequisite check."
"MBR2GPT" = "Converts an MBR system disk to GPT in place for UEFI: /validate checks it, /convert writes the EFI system partition and boot files; /allowFullOS runs it from Windows instead of WinPE."


"dfsutil" = "DFS client and namespace tool: dfsutil cache referral (list, flush) and dfsutil diag viewdfspath, what a client is referred to."
"cipher" = "EFS encryption from the command line; cipher /w:E:\\ overwrites the free space of a volume (zeros, ones, random) so deleted files cannot be recovered."
"sdclt" = "Backup and Restore (Windows 7): scheduled file backups and system images to a disk or a network share, and Restore my files."
"net use" = "Connects a drive letter to a share (net use S: \\\\pc02\\Office /user:pc02\\reception /persistent:yes), lists connections, /delete removes one."
"diskmgmt.msc" = "Disk Management: initialise disks (GPT or MBR), make, format, extend and shrink volumes, change drive letters and mount folders."
"lusrmgr.msc" = "Local Users and Groups: the PC's own accounts and groups (not on Home editions)."
"sysdm.cpl" = "System Properties: computer name, domain or workgroup (Change), System Protection, Remote, Advanced."
"format" = "Formats a volume: format E: /fs:ntfs|exfat|fat32 /v:<label> /q; without /q it checks and zeroes the volume, /p:n then overwrites it n more times."
[linux]
"sinfo" = "Slurm: the partitions and nodes and their state (idle, mixed, allocated, drained, down); -N one line per node, -R why nodes are down or drained, -o for the columns."
"squeue" = "Slurm: the jobs waiting and running, with their state and, for pending jobs, the reason (Resources, Priority...); -o '%i %j %u %T %r' picks the columns."
"scontrol" = "Slurm's control tool: show node|partition|job, update nodename=<n> state=resume|drain reason=..., reconfigure (re-read slurm.conf), ping, requeue <job>."
"sbatch" = "Slurm: submits a batch script (#SBATCH lines: --gres=gpu:N, --time, --partition, --output) or --wrap 'command'; prints the job id."
"srun" = "Slurm: runs a command as a job (or a step inside one) and waits: srun -p interactive --gres=gpu:1 hostname."
"munge" = "MUNGE: makes a credential (munge -n); piped to unmunge on another machine it proves both share the cluster's key."
"unmunge" = "MUNGE: decodes a credential and says whether it is valid (STATUS: Success, Invalid credential, Expired, Rewound)."
"exportfs" = "The NFS server's exports: -v what is exported now and to whom, -ra re-read /etc/exports, -s the running list."
"showmount" = "Asks an NFS server what it exports (showmount -e <server>), from a client."
"llama-server" = "llama.cpp's model server: an OpenAI-compatible HTTP API (--model, --ctx-size, --parallel, --api-key-file, --metrics, --host, --port)."
"md5sum" = "Prints a file's MD5 hash: the quick way to see whether two machines hold the same configuration file."
"bconsole" = "The Bareos console: status director|client=|storage=, run job=, restore, list jobs, messages, configure add client|job|storage|console, reload."
"bscan" = "Reads Bareos volumes and writes what is on them into a catalog (-s -m, -V the volumes, the device): rebuilds a lost catalog."
"bextract" = "Extracts files straight from a Bareos volume without a catalog or a Director (-V the volume, -i a list of files)."
"bls" = "Lists the jobs and files on a Bareos volume (-j jobs, -V the volume, the device)."
"cat" = "Prints a file."
"configctl" = "OPNsense's backend control: configctl filter reload rebuilds the firewall from its config."
"curl" = "Fetches a URL from the command line; -v shows the TLS and HTTP exchange."
"dhcrelay" = "The ISC DHCP relay agent: forwards Discovers from one subnet to a DHCP server."
"dig" = "Queries DNS with full detail (dig -t SRV _ldap._tcp.corp.lab)."
"getent" = "Looks up users and groups through NSS, so domain accounts via SSSD too."
"grep" = "Searches text for a pattern."
"id" = "Shows a user's uid, gid and groups; resolves domain users through SSSD."
"ip" = "Linux networking: ip addr, ip route, ip link, ip neigh."
"iperf3" = "Measures throughput between two machines."
"iptables" = "The classic Linux packet filter: tables, chains and rules."
"journalctl" = "Reads the systemd journal; -u unit for one service, -f to follow."
"node" = "Node.js, the JavaScript runtime MeshCentral runs on: node -v prints its version; node node_modules/meshcentral starts the server (--createaccount, --adminaccount while it is stopped)."
"npm" = "Node.js's package manager: npm ci installs exactly what package-lock.json lists (--offline: from what is on disk, never a registry)."
"setcap" = "Sets file capabilities on a binary: setcap 'cap_net_bind_service=+ep' lets that program bind ports below 1024 without root; -r removes them."
"getcap" = "Shows a file's capabilities (getcap /usr/local/bin/node): what setcap gave it, nothing if none."
"useradd" = "Makes a local Linux user; --system --shell /usr/sbin/nologin for a service account that nobody logs in as."
"kinit" = "Gets a Kerberos ticket-granting ticket for a user."
"virsh" = "libvirt's command line: virsh list --all, start, shutdown, domiflist (a VM's cards and MACs), change-media, net-list."
"virt-install" = "Creates a libvirt VM: --name, --memory, --vcpus, --disk size=, --cdrom, --network bridge=br0, --osinfo, --graphics vnc."
"virt-host-validate" = "Checks a KVM host: hardware virtualization, /dev/kvm, cgroups and IOMMU, each PASS, WARN or FAIL (virt-host-validate qemu)."
"xorriso" = "Reads and writes ISO 9660 images; xorriso -as mkisofs -V LABEL -J -R -o x.iso folder/ builds one, -indev x.iso -ls lists it."
"logger" = "Writes a message to syslog, for testing a collector."
"logrotate" = "Rotates, compresses and removes old log files on a schedule."
"nft" = "nftables, the current Linux packet filter."
"nmap" = "Scans hosts and ports to see what answers."
"promtool" = "Prometheus's checker: promtool check config before a reload."
"amtool" = "Alertmanager's command line: check-config, config routes test <labels> (which receiver an alert would reach), silence add|query|expire with --alertmanager.url=http://localhost:9093."
"grafana" = "Grafana's server binary and CLI: grafana cli admin reset-admin-password sets the admin password, grafana cli plugins ls lists plugins."
"realm" = "realmd: discover, join, leave and permit a domain on Linux."
"rsyslogd" = "The rsyslog daemon; rsyslogd -N1 validates the configuration."
"lnms" = "LibreNMS's own command line (inside its container: docker exec -it --user librenms librenms lnms): user:add, device:add, config:get and more."
"snmpwalk" = "Walks an SNMP agent's tree: snmpwalk -v2c -c <community> <device> system."
"snmpget" = "Reads single SNMP values: snmpget -v2c -c <community> <device> <OID> ...; a printer's hrPrinterDetectedErrorState is 1.3.6.1.2.1.25.3.5.1.2.1."
"apt-cdrom" = "Adds an Ubuntu or Debian disc to apt's sources (sudo apt-cdrom add) so apt install works from it with no network."
"snap" = "Snap packages from the Snap Store: snap list, snap info <name>, snap refresh, snap install <name>; needs the store, so not offline."
"snmptrapd" = "Net-SNMP's trap receiver (UDP 162); authCommunity in snmptrapd.conf says which communities it logs."
"chronyc" = "chrony's control tool: sources, tracking, clients."
"rc-service" = "OpenRC on Alpine: start, stop, restart or status of a service (rc-update add it to start at boot)."
"ss" = "Lists sockets: ss -tlnp shows listening TCP ports and their process."
"sss_cache" = "Invalidates SSSD's cached users and groups (sss_cache -E)."
"sssctl" = "SSSD's tool: domain status, user checks, cache and config checks."
"sudo" = "Runs a command as root (or another user), as sudoers allows."
"swanctl" = "strongSwan's control tool: --list-sas, --initiate, --log."
"systemctl" = "Controls systemd units: status, start, stop, enable, is-active, is-enabled."
"tcpdump" = "Captures packets on an interface, with a capture filter."
"lldpcli" = "lldpd's control tool: lldpcli show neighbors details lists what the switch port announced (its name, port, and LLDP-MED's voice VLAN)."
"timedatectl" = "Shows and sets the clock, time zone and NTP synchronisation."
"visudo" = "Edits or checks sudoers files safely (visudo -c checks them all, -f one file)."
"tshark" = "Wireshark's command line: read or capture with display filters (-Y)."
"tgtadm" = "The Linux SCSI target's admin tool: tgtadm --lld iscsi --op show --mode target lists targets, LUNs, ACLs, accounts and sessions."
"tgt-admin" = "Applies /etc/tgt/targets.conf to the running tgt (what Webmin's iSCSI TGTd module does): --update ALL, -s shows it all."
"mdadm" = "Linux software RAID: --detail /dev/mdN, --add, --remove; cat /proc/mdstat shows every group's state."
"lvs" = "LVM's logical volumes: their volume group, size and the devices under them (vgs and pvs for the groups and disks)."
"nginx" = "The nginx web server and reverse proxy: nginx -t tests the configuration, nginx -T prints all of it as loaded."
"openssl" = "TLS toolkit: openssl req makes a key and a CSR, openssl x509 -noout -text reads a certificate, s_client tests a server."
"apt-get" = "Debian and Ubuntu packages: update reads the repositories, install adds a package and its dependencies."
"update-ca-certificates" = "Rebuilds Ubuntu's trusted CA bundle from /usr/local/share/ca-certificates."
"postconf" = "Postfix's configuration tool: -n what differs from defaults, -e sets main.cf, -M and -P edit master.cf, -x expands $variables."
"postfix" = "Postfix's control command: postfix reload, status, check."
"doveadm" = "Dovecot's admin tool: mailbox status -u <user>, search, fetch, auth test, log errors."
"doveconf" = "Prints Dovecot's configuration: -n what is set, -h <setting> one value."
"postqueue" = "Postfix's queue: postqueue -p lists what waits and why, postqueue -f retries it all now."
"postsuper" = "Postfix's queue surgery: postsuper -d <id> deletes a queued message, -d ALL deferred empties the deferred queue."
"rspamadm" = "Rspamd's admin tool: configtest checks the configuration, configdump <module> shows what runs, dkim_keygen makes a DKIM key, pw hashes the web password."
"rspamc" = "Asks a running Rspamd about a message: the action, the score and every symbol that fired (--ip and --from set the envelope)."
"postmap" = "Builds or queries a Postfix lookup table: postmap hash:/etc/postfix/sender_access after editing, postmap -q <key> <map> to test a key."
"sha256sum" = "Prints the SHA-256 of files or of standard input; the same value Get-FileHash gives on Windows."
"base64" = "Encodes or, with -d, decodes base64, the encoding of mail attachments and of PowerShell -EncodedCommand text."
"wazuh-analysisd" = "The Wazuh manager's analysis daemon; wazuh-analysisd -t checks the rules, decoders and ossec.conf and names the file and line of an error."
"sievec" = "Compiles a Sieve script for Dovecot; global scripts (sieve_before, sieve_after) must be compiled by hand."
"swaks" = "Swiss Army Knife for SMTP: sends a test mail and shows the whole dialogue (--server, --port 587 --tls --auth); with no --server it delivers by the MX."
"adduser" = "Creates a local user with a home directory and a password (Debian, Ubuntu)."
"mount" = "Attaches a file system: mount LABEL=WLPACK /mnt/winlab-pack mounts the package stick."
"umount" = "Detaches a mounted file system, so another stick can take the port."
"usermod" = "Changes a local account: usermod -aG docker ubuntu adds it to the docker group (log in again to use it)."
"hostnamectl" = "Shows or sets the machine's host name; k3s uses it as the node's name."
"docker" = "Docker's client (Linux and Windows): run, ps, logs, exec, inspect, port, images, load, tag, push, pull, build, compose, info."
"kubectl" = "The Kubernetes API client: get, describe, create deployment, expose, scale, set image, rollout status/history/undo, patch, delete."
"k3s" = "The k3s binary: k3s server, k3s agent, and k3s kubectl / k3s crictl / k3s ctr built in; installed by install.sh as a systemd service."
"crictl" = "The kubelet's container runtime client on a k3s node: crictl images, crictl ps, crictl pull, crictl info."
"ctr" = "containerd's own client: ctr -n k8s.io images import <file.tar> loads an image tarball into k3s's containerd."
"kubeadm" = "Builds and upgrades a Kubernetes cluster: kubeadm init, kubeadm join, kubeadm token create --print-join-command, kubeadm upgrade plan / apply / node, kubeadm certs check-expiration, kubeadm reset."
"kubelet" = "The node agent that runs pods through the container runtime, as a systemd service; its settings are in /var/lib/kubelet/config.yaml, its log in journalctl -u kubelet."
"etcdctl" = "etcd's client for a running member: etcdctl --endpoints=https://127.0.0.1:2379 --cacert --cert --key snapshot save <file>, member list, endpoint health."
"etcdutl" = "etcd's offline tool for files: etcdutl snapshot status <file>, etcdutl snapshot restore <file> --data-dir <dir>."
"helm" = "The Kubernetes package manager: helm create, helm install <release> <chart> --set, helm upgrade --reuse-values, helm rollback, helm history, helm template."
"ufw" = "Ubuntu's host firewall: ufw allow OpenSSH, ufw allow from <network> to any port <n> proto tcp, ufw enable, ufw status numbered."
"runuser" = "Runs a command as another user, from root, with no password asked (runuser -u postgres -- psql)."
"crontab" = "Edits or lists a user's scheduled jobs: crontab -u postgres -e; a bare % must be escaped with a backslash inside it."
"my_print_defaults" = "Prints the options MariaDB or MySQL programs read from their option files, in order: my_print_defaults --mysqld."
"vtysh" = "FRRouting's shell, Cisco-like: configure terminal, router ospf, router bgp, show ip route, show ip ospf neighbor, show bgp summary, write memory; vtysh -c '<command>' runs one."
"ipcalc" = "busybox ipcalc on the lab router: -n network, -b broadcast, -m netmask, -p prefix for an address/prefix; a check on your own subnetting."
"winlab-hsrpd" = "winlab's own HSRP speaker for a Linux router: IOS standby lines under interface <linux name> in /etc/winlab-hsrp.conf; winlab-hsrpd check reads the file, winlab-hsrpd show [brief] prints show standby, systemctl reload winlab-hsrpd applies a change."
"winlab-glbpd" = "winlab's own GLBP speaker for a Linux router: IOS glbp lines under interface <linux name> in /etc/winlab-glbp.conf; winlab-glbpd check reads the file, winlab-glbpd show [brief] prints show glbp, systemctl reload winlab-glbpd applies a change."
"sysctl" = "Reads and sets kernel settings: sysctl net.ipv4.ip_forward; files in /etc/sysctl.d keep them across reboots (sysctl --system loads them)."
"traceroute" = "Lists the routers on the path to an address (-n: numbers only, no name lookups)."
"pgrep" = "Finds processes by name: pgrep -a ospfd shows whether FRRouting's OSPF daemon runs."
"netplan" = "Ubuntu's network configuration: YAML in /etc/netplan; netplan get shows the merged result, netplan apply applies it."
"squid" = "The Squid proxy: squid -k parse checks squid.conf and its includes, squid -k reconfigure reloads it, squid -v shows how it was built."
"squidclient" = "Asks a running Squid from the shell: squidclient -h 127.0.0.1 mgr:info, or a URL through the proxy."
"conntrack" = "Lists and watches the connections a Linux router tracks: conntrack -L, conntrack -E for live events."
"kvno" = "Gets a Kerberos service ticket and prints its key version number: kvno HTTP/<host>, to compare with a keytab."
"ldapsearch" = "Queries an LDAP directory (AD too): -H ldap://<dc> -D <user> -W -b <base> '<filter>' <attributes>."
"sudoedit" = "Edits a file as root with your own editor, safely: sudoedit /etc/squid/conf.d/corp.conf."
"rdisc6" = "Sends a router solicitation and prints the router advertisement that answers: prefixes, flags, router lifetime, RDNSS, DNSSL (ndisc6 package)."
"ndisc6" = "Sends a neighbour solicitation for an IPv6 address and prints the MAC that answers (ndisc6 package)."
"tracepath" = "Traces the path to a host and the path MTU along it, without root (-6 for IPv6, -n numbers only)."
"resolvectl" = "systemd-resolved's tool: resolvectl status shows the DNS servers per card, resolvectl query <name> looks a name up."
"suricata" = "The Suricata IDS/IPS engine: suricata -T -c /etc/suricata/suricata.yaml tests the configuration and rules, --dump-config shows the values it uses, --build-info what it was built with, -q 0 runs it inline on NFQUEUE 0."
"suricata-update" = "Builds Suricata's rule file from its sources: add-source <name> file:///... adds a local source, with no argument it writes /var/lib/suricata/rules/suricata.rules and applies disable.conf, enable.conf, modify.conf and drop.conf."
