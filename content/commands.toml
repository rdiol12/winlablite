"conntrack" = "Lists and watches the connections a Linux router tracks: conntrack -L, conntrack -E for live events."
"kvno" = "Gets a Kerberos service ticket and prints its key version number: kvno HTTP/<host>, to compare with a keytab."
"ldapsearch" = "Queries an LDAP directory (AD too): -H ldap://<dc> -D <user> -W -b <base> '<filter>' <attributes>."
"sudoedit" = "Edits a file as root with your own editor, safely: sudoedit /etc/squid/conf.d/corp.conf."
"rdisc6" = "Sends a router solicitation and prints the router advertisement that answers: prefixes, flags, router lifetime, RDNSS, DNSSL (ndisc6 package)."
"ndisc6" = "Sends a neighbour solicitation for an IPv6 address and prints the MAC that answers (ndisc6 package)."
"tracepath" = "Traces the path to a host and the path MTU along it, without root (-6 for IPv6, -n numbers only)."
"resolvectl" = "systemd-resolved's tool: resolvectl status shows the DNS servers per card, resolvectl query <name> looks a name up."
"suricata" = "The Suricata IDS/IPS engine: suricata -T -c /etc/suricata/suricata.yaml tests the configuration and rules, --dump-config shows the values it uses, --build-info what it was built with, -q 0 runs it inline on NFQUEUE 0."
"suricata-update" = "Builds Suricata's rule file from its sources: add-source <name> file:///... adds a local source, with no argument it writes /var/lib/suricata/rules/suricata.rules and applies disable.conf, enable.conf, modify.conf and drop.conf."
"suricatasc" = "Talks to a running Suricata over its unix socket: suricatasc -c reload-rules loads changed rules without stopping the capture; -c uptime, -c iface-list."
"jq" = "Filters and reshapes JSON from the shell: jq -c 'select(.event_type==\"alert\")' /var/log/suricata/eve.json picks Suricata's alerts, one per line."
"wg" = "WireGuard's tool: wg genkey and wg pubkey make keys, wg show lists peers and their latest handshake, wg set wg0 peer <key> remove revokes one."
"wg-quick" = "Brings a WireGuard interface up from /etc/wireguard/<name>.conf: wg-quick up wg0, or systemctl enable --now wg-quick@wg0."
"ansible" = "Runs one module on a group of hosts (ad-hoc): ansible linux -m ansible.builtin.ping, -a for arguments, -b to become root."
"ansible-config" = "Shows Ansible's settings: ansible-config dump --only-changed lists what ansible.cfg (or the environment) changed."
"ansible-doc" = "Ansible's module documentation offline: ansible-doc -l lists modules, ansible-doc ansible.builtin.apt shows one."
"ansible-galaxy" = "Collections and roles: ansible-galaxy collection list shows what is installed, ansible-galaxy role init makes a role skeleton offline."
"ansible-inventory" = "Shows the inventory as Ansible reads it: --graph for groups, --host for one host's variables, --list as JSON."
"ansible-playbook" = "Runs a playbook: --syntax-check, --check (dry run), --diff, --limit for part of the inventory."
"ssh" = "OpenSSH client: logs in to a machine or runs one command there; checks the server's host key against known_hosts."
"ssh-copy-id" = "Appends your public key to a server's authorized_keys over SSH, after one password login."
"ssh-keygen" = "Makes and inspects SSH keys: -t ed25519 a new key pair, -lf a fingerprint, -F finds and -R removes a known_hosts entry."
"ssh-keyscan" = "Fetches a server's public host keys over the network, for comparison (never trust them without a fingerprint check)."
"sshd" = "The OpenSSH server: sshd -t tests the configuration, sshd -T prints the settings in effect."
"asterisk" = "The phone system's engine; asterisk -rx '<command>' runs one console command (pjsip show contacts, core show channels). Call files dropped into /var/spool/asterisk/outgoing make it ring an extension; outgoing_done keeps each one with its Status (Completed when answered)."
"sendmail" = "The mail server's local submission command (Postfix's compatible /usr/sbin/sendmail): sendmail -i -f <from> <to> < message delivers a mail inside the server, through Postfix's pickup."
"a2ensite" = "Enables an Apache site from /etc/apache2/sites-available (a2dissite disables one); systemctl reload apache2 applies it."
"a2enconf" = "Enables an Apache configuration snippet from /etc/apache2/conf-available, such as an Alias for a web application."
"a2enmod" = "Enables an Apache module: a2enmod rewrite for applications that route every request through index.php (GLPI)."
"apache2ctl" = "Apache's control tool: configtest checks the configuration, -S lists the virtual hosts and aliases it serves."
"mariadb-tzinfo-to-sql" = "Turns the system's time zone files into SQL for MariaDB's mysql database: mariadb-tzinfo-to-sql /usr/share/zoneinfo | sudo mariadb mysql."
"newaliases" = "Rebuilds Postfix's alias database from /etc/aliases (bob: alice forwards bob's mail); run it after every edit."
"postalias" = "Queries or builds a Postfix alias map: postalias -q bob hash:/etc/aliases prints where bob's mail goes."

"agent_control" = "Wazuh's agent list on the manager (/var/ossec/bin/agent_control -l): every agent with its id, name, address and Active or Disconnected."
"wazuh-logtest" = "Wazuh's rule tester (/var/ossec/bin/wazuh-logtest): paste an event, see the decoder and the rule that match, before you restart the manager."
"wazuh-certs-tool.sh" = "Wazuh's certificate tool: makes a small CA and a certificate for each indexer, server and dashboard node listed in config.yml (-A for all)."

[firewall]
"pfctl" = "pf's control tool on OPNsense and pfSense: -si status, -sr rules, -sn NAT, -ss states, -e enable, -vsr counters."

[sql]
"psql" = "PostgreSQL's command-line client: -h host -U role -d database, -c a statement; inside, \\du roles, \\l databases, \\dp privileges, \\password sets one."
"pg_lsclusters" = "Lists the PostgreSQL clusters on a Debian or Ubuntu machine: version, name, port, status, data directory."
"pg_dump" = "Dumps one PostgreSQL database consistently: -Fc the custom archive pg_restore reads, -f the file."
"pg_restore" = "Restores a pg_dump archive: -l lists it, -d into a database, -t one table, --clean drops first."
"pg_dumpall" = "Dumps a whole PostgreSQL cluster; --globals-only writes just the roles and tablespaces."
"pg_basebackup" = "Copies a running PostgreSQL cluster over a replication connection; -R makes the copy a standby, -S uses a slot, -X stream."
"createdb" = "Creates a PostgreSQL database from the shell: createdb -O owner name."
"mariadb" = "MariaDB's command-line client (also mysql): sudo mariadb logs root in over the socket, -u user -p asks for a password, -e runs a statement."
"mariadb-dump" = "Dumps MariaDB databases as SQL (also mysqldump): --single-transaction for a consistent InnoDB dump, --databases, --master-data=2 --gtid for a replica's seed."
"mysqldump" = "The older name of mariadb-dump, still installed with the MariaDB client."
"sqlcmd" = "Runs T-SQL against SQL Server from the command line (-S server -E Windows authentication)."

[cloud]
"az" = "The Azure CLI, in Cloud Shell or installed: az group, az vm, az network."
"azcmagent" = "The Azure Arc agent's tool: connect, show, check, config."

[switch]
"show spanning-tree" = "On a switch's console: the root bridge, this switch's bridge ID and each port's role and state (summary counts them, vlan <n> one instance)."
"spanning-tree vlan" = "Spanning tree for a VLAN: on (spanning-tree vlan 1), off (no ...), the bridge priority (priority 4096) or root primary / secondary."
"spanning-tree mode" = "pvst (802.1D per VLAN, the default) or rapid-pvst (802.1w); in winlab the router's kernel runs 802.1D either way."
"spanning-tree portfast" = "On an access port: forward at once instead of 30 s of listening and learning; default does it on every access port."
"spanning-tree bpduguard" = "enable on a port err-disables it the moment a BPDU arrives (a switch where a machine should be)."
"spanning-tree cost" = "A port's path cost to the root (gigabit 4, 100 Mbit 19): a dearer port loses the root port election."
"spanning-tree port-priority" = "A port's priority (0 to 240 in steps of 16, 128 by default): breaks a tie between two equal ways."
"show processes cpu" = "A switch's CPU load: a switch stuck in a loop's broadcast storm runs near 100%."
"show cdp neighbors" = "Which device is at the far end of each port: switch, router, and the port it is in there."
"no shutdown" = "Brings an interface up; after shutdown it is also how an err-disabled port comes back."
"logging host" = "Sends the device's log lines to a syslog server (UDP 514; transport udp port <n> and format rfc5424 change it)."
"logging trap" = "The most verbose severity sent to the syslog server: informational (6) sends 0 to 6; %LINK-3 is errors (3)."
"service timestamps" = "service timestamps log datetime msec stamps each log line with the device's clock ('*' while NTP has not synced it); uptime stamps the time since boot."
"show logging" = "The device's log buffer, numbered, and how many lines went to each syslog server."
"snmp-server community" = "An SNMP v1/v2c community (the password) for the agent, ro or rw, optionally limited by a standard access list."
"snmp-server host" = "Where SNMP traps go: snmp-server host <ip> version 2c <community>."
"snmp-server enable traps" = "Turns the device's traps on (link down / up, spanning tree); without it a trap host gets nothing."
"snmp-server location" = "Text for sysLocation (and snmp-server contact for sysContact), read by an SNMP manager."
"show snmp" = "The agent, its contact and location, and the trap receivers with how many traps went to each."
"ntp server" = "Points the device's clock at an NTP server; in winlab the router's chrony follows it (its switches share its clock)."
"show ntp status" = "Whether the clock is synchronised, to which reference and at what stratum."
"show ntp associations" = "The configured NTP servers: * is the one in use, reach counts the answers (377 is eight in a row)."
"access-list" = "A standard numbered access list (1 to 99): access-list 10 permit host 10.20.0.30; the first match decides, then an implicit deny."

"switchport port-security" = "On an access port: allow only known addresses; maximum <n>, mac-address sticky or <mac>, violation shutdown | restrict | protect."
"show port-security" = "Secured ports, their maximum, current addresses and violation count; interface <if> for one port's detail and last source address, address for the secure address table."
"clear port-security" = "Forgets secure addresses: all, configured, dynamic or sticky, optionally on one interface."
"errdisable recovery" = "cause psecure-violation brings err-disabled ports back on a timer; interval <seconds> sets it (300 by default)."
"show errdisable recovery" = "Which causes recover on a timer, the interval, and the ports waiting to come back."
"show interfaces status" = "Every port: name, connected / notconnect / disabled / err-disabled, VLAN, duplex and speed."
"aaa new-model" = "Turns on AAA, the switch's framework for asking authentication servers; 802.1X needs it."
"aaa authentication dot1x" = "default group radius: 802.1X asks the RADIUS servers."
"radius server" = "Defines a RADIUS server: address ipv4 <ip> auth-port 1812 acct-port 1813, and key <shared key>."
"dot1x system-auth-control" = "Turns 802.1X on for the switch; without it no port asks anyone."
"authentication port-control" = "On a port: auto (only EAPOL until the server says yes), force-authorized or force-unauthorized."
"dot1x pae authenticator" = "Makes a port an 802.1X authenticator: it speaks EAPOL with the machine and RADIUS with the server."
"show authentication sessions" = "Each 802.1X session: port, address, Auth / Unauth / Running; interface <if> adds the user name and why."
"show radius server-group" = "all: the RADIUS servers, the address requests leave from, and the request, timeout and answer counters."
"channel-group" = "On the member ports (interface range): channel-group <1-6> mode on | active | passive | desirable | auto bundles them into port-channel <n>."
"interface port-channel" = "The bundle itself: its description, shutdown / no shutdown (how a channel-misconfig err-disable is cleared) and the trunk settings its members inherit."
"port-channel load-balance" = "How a switch picks a member for each frame: src-mac (the 2960's default), dst-mac, src-dst-mac, src-ip, dst-ip, src-dst-ip."
"show etherchannel summary" = "One line per channel group: Po1(SU) in use, (SD) down, and each member's flag: P bundled, I stand-alone, s suspended, D down."
"show lacp neighbor" = "The LACP partner on each member port: its system ID, port number, and whether it is active (A) or passive (P)."
"show interfaces port-channel" = "The bundle as one interface: up or down, its bandwidth (the members' added up) and the members in it."
"monitor session" = "SPAN: monitor session <n> source interface <ports> [rx | tx | both] or source vlan <n>, and destination interface <port> where the capturing PC sits."
"show monitor" = "The SPAN sessions: source ports by direction, the destination port, its encapsulation and that ingress is disabled."
"ip domain-name" = "The device's DNS domain; with the hostname it names the RSA key pair SSH needs (SW1.corp.lab)."
"crypto key generate rsa" = "Makes the key pair that turns the SSH server on; modulus 2048 (at least 768 for SSH version 2); crypto key zeroize rsa removes it."
"ip ssh version" = "2 turns SSH version 1 off; show ip ssh says which runs (1.99 means both)."
"show ip ssh" = "Whether SSH is enabled, its version, timeouts and retries, and the public key (and its fingerprint) clients see."
"transport input" = "Under line vty 0 4: which protocols may log in there; ssh alone keeps telnet's clear-text passwords off the network."
"login local" = "Under a line: ask for a user name and its secret from the device's own username list."

"router ospf" = "On the router's console: starts OSPF process <n> (router ospf 1) and enters its mode: router-id, network <address> <wildcard> area <n>, passive-interface, default-information originate."
"router bgp" = "On the router's console: starts BGP in AS <n> and enters its mode: neighbor <ip> remote-as <as>, address-family ipv4, network <ip> mask <mask>."
"show ip ospf neighbor" = "OSPF neighbours: router ID, priority, state (FULL/DR, FULL/BDR, 2WAY...), dead time, address and interface."
"show ip ospf interface" = "Each OSPF interface's area, cost, network type, DR and BDR, and hello and dead timers; brief gives one line each."
"show ip bgp summary" = "BGP neighbours with their AS and state; an Established session shows the number of prefixes received instead."
"show ip protocols" = "The routing protocols the router runs: router ID, the networks each routes for, passive interfaces, BGP neighbours."
"clear ip ospf process" = "Restarts OSPF: needed for a new router-id, or to hold a DR election again."
"default-information originate" = "Under router ospf: advertises a default route to the other OSPF routers (always: even without one in the table)."
"vrf definition" = "Creates a VRF, a routing table of its own: rd <asn>:<n>, address-family ipv4. ip vrf <name> is the older form."
"vrf forwarding" = "On an interface: moves it into a VRF and removes its IP address (type ip address again after it)."
"show ip route vrf" = "A VRF's routing table; show ip vrf lists the VRFs and their interfaces."
"vrrp" = "On an interface: VRRP group <n>, ip <virtual address>, priority <1-254>, preempt, timers advertise <s>; show vrrp brief shows Master or Backup."
"standby" = "HSRP, Cisco's own first-hop redundancy protocol; winlab's router refuses it and explains why (no Linux router speaks HSRP): use vrrp."

"zone security" = "Names a security zone of the router's zone-based firewall; zone-member security <zone> on an interface puts it in."
"zone-pair security" = "One direction between two zones (source, destination; self is the router): service-policy type inspect <policy> says what may cross."
"class-map type inspect" = "Which traffic, for the zone firewall: match-any or match-all of match protocol <name> and match access-group <list>."
"policy-map type inspect" = "What the zone firewall does per class: inspect (stateful, the replies come back), pass (one way), drop [log]; class-default drops by default."
"show zone security" = "The zones and their member interfaces; self is the router itself."
"show policy-map type inspect zone-pair" = "Each zone-pair's classes with their matches and counters; sessions lists the inspected connections open now."
"crypto ikev2 proposal" = "IKEv2's ciphers: encryption aes-cbc-256, integrity sha256, group 14; offered by a crypto ikev2 policy."
"crypto ikev2 keyring" = "The pre-shared keys, one per peer: peer <name>, address <ip>, pre-shared-key <key>."
"crypto ikev2 profile" = "One peer's IKEv2: match identity remote address, authentication local and remote pre-share, keyring local."
"crypto ipsec transform-set" = "How ESP protects the traffic: esp-aes 256 esp-sha256-hmac, or esp-gcm 256; mode tunnel."
"crypto ipsec profile" = "Ties a transform set (set transform-set) to an IKEv2 profile (set ikev2-profile) for tunnel protection; set pfs adds fresh Diffie-Hellman keys."
"tunnel mode ipsec ipv4" = "Makes interface Tunnel<n> a static virtual tunnel interface (VTI): what is routed into it is encrypted, with tunnel protection ipsec profile."
"show crypto ikev2 sa" = "The IKEv2 security associations: local and remote address, READY when the peers agreed, the ciphers and DH group."
"show crypto ipsec sa" = "The IPsec SAs per tunnel: packets encrypted (encaps) and decrypted (decaps), the SPIs each way and their lifetimes."
"class-map match-any" = "A QoS class: match dscp, match access-group, match protocol or match any; match-all needs every line to match."
"policy-map" = "What each QoS class gets: priority, bandwidth, shape average, police, set dscp, fair-queue, or a child service-policy."
"service-policy" = "Attaches a policy-map: output or input on an interface, or as the child under a class of another policy-map."
"shape average" = "Holds a class (or class-default, for the whole line) to a rate in bit/s, queueing what exceeds it."
"show policy-map interface" = "Per class on an interface: packets matched, packets marked, the queue and what the police or the shaper dropped."

[match]
"id" = '(?<![\w-])id (?:[A-Z][A-Za-z]|-[a-z]|[a-z]+@)'
"ip" = '(?<![\w-])ip (?:addr|a|route|r|link|neigh|-br|-4|rule)\b'
"ss" = '(?<![\w-])ss -[a-z]'
"cat" = '(?<![\w-])cat /'
"route" = '(?<![\w-])route (?:print|add|delete|-n)\b'
"sc" = '(?<![\w-])sc(?:\.exe)? (?:query|qc|config|failure|start|stop|qfailure)\b'
"az" = '(?<![\w-])az (?:[a-z]+)'
"grep" = '(?<![\w-])grep (?:-|[\x27"A-Za-z])'
"sudo" = '(?<![\w-])sudo (?:[a-z-])'
"ping" = '(?<![\w-])ping (?:-|[0-9a-z])'
"logger" = '(?<![\w-])logger (?:-|[\x27"])'
"postfix" = '(?<![\w-])postfix (?:reload|status|check|start|stop|flush)\b'
"mount" = '(?<![\w-])mount (?:-|LABEL=|/)'
"curl" = '(?<![\w-])curl (?:-|http)'
"suricata" = '(?<![\w-])suricata (?:-|--)'
"jq" = '(?<![\w-])jq (?:-|\.|\x27)'
"squid" = '(?<![\w-])squid -[kvN]\b'
"mode" = '(?<![\w-])mode COM\d'
"wg" = '(?<![\w-])wg (?:genkey|pubkey|show|set|syncconf)\b'
"ansible" = '(?<![\w-])ansible (?:-|all\b|linux\b|windows\b|[a-z0-9]+\.corp\.lab\b)'
"ssh" = '(?<![\w-])ssh (?:-|[a-z0-9]+[.@])'
"sshd" = '(?<![\w-])sshd -[tTf]\b'
"winrm" = '(?<![\w-])winrm (?:enumerate|get|set|quickconfig|delete|create)\b'
"expand" = '(?<![\w-])expand(?:\.exe)? -F:'
