"New-MoveRequest" = "Exchange Server: moves a mailbox to another database or server while the user keeps working."
"Get-WSManCredSSP" = "Shows whether this machine allows CredSSP as a client (and to which servers) or as a server."
"Enable-WSManCredSSP" = "Turns CredSSP on for WinRM (-Role Client or Server): it sends the user's password to the server, so avoid it; Disable-WSManCredSSP turns it off."
"Uninstall-ADDSDomainController" = "Demotes a domain controller; -ForceRemoval demotes one that cannot replicate (after a USN rollback, or cut off), leaving the metadata cleanup to do on a healthy DC."
"New-ADAuthenticationPolicy" = "Creates an authentication policy: TGT lifetime (-UserTGTLifetimeMins) and where accounts may authenticate from (-UserAllowedToAuthenticateFrom, an SDDL condition)."
"Set-ADAuthenticationPolicy" = "Changes an authentication policy; -Enforce $true moves it from audit to enforced."
"Get-ADAuthenticationPolicy" = "Lists authentication policies with their lifetimes, conditions and whether they are enforced."
"New-ADAuthenticationPolicySilo" = "Creates an authentication policy silo naming the policy for its users, computers and services; -Enforce to enforce it."
"Set-ADAuthenticationPolicySilo" = "Changes a silo; -Enforce $true enforces its policies."
"Get-ADAuthenticationPolicySilo" = "Lists silos, their policies, members and enforcement."
"Grant-ADAuthenticationPolicySiloAccess" = "Permits an account (user, computer or service) to be a member of a silo."
"Set-ADAccountAuthenticationPolicySilo" = "Assigns a permitted account to a silo, so the silo's policy applies to it."
"Test-PSSessionConfigurationFile" = "Checks a .pssc session configuration file for errors before you register it."
"Get-PSSessionCapability" = "Lists the commands a given user gets on a JEA endpoint (-ConfigurationName, -Username), without signing in as them."
"Invoke-CimMethod" = "Calls a method of a WMI/CIM class or object, such as PollDsNow on DFSR's DfsrConfig."
"Get-IISAppPool" = "Lists IIS application pools with their state and identity (processModel.userName)."

# Security operations (lessons event-forwarding-collector to scheduled-report-gmsa)
"ConvertTo-Html" = "Turns objects into an HTML table; -Fragment gives just the table, to build a mail body from several sections."
"Get-LocalUser" = "Lists the machine's local accounts with Enabled, LastLogon and PasswordExpires (the Guest account should be disabled)."
"Install-ChocolateyInstallPackage" = "A Chocolatey helper for a package's chocolateyinstall.ps1: runs an installer that ships inside the package (-File, -FileType msi, -SilentArgs, -ValidExitCodes)."
"New-EventLog" = "Registers an event source in a log once (New-EventLog -LogName Application -Source AdminReport), so a script can write its own events."
"Set-ExecutionPolicy" = "Changes the PowerShell execution policy; -Scope Process Bypass lets this window run a downloaded script without changing the machine."
"Write-EventLog" = "Writes an event to a classic log with a registered source: -LogName, -Source, -EventId, -EntryType, -Message."
# Windows 11 servicing and Microsoft Edge (the windows11-desktops lessons)
"New-Guid" = "Makes a new random GUID, such as the Group ID that puts PCs in one Delivery Optimization peer group."
"Get-DeliveryOptimizationStatus" = "Lists the files Delivery Optimization is handling or has cached, with BytesFromHttp and BytesFromPeers for each."
"Get-DeliveryOptimizationPerfSnap" = "Shows the Delivery Optimization service's current state: its download mode and where it came from, the cache, and its totals."
"Get-DOConfig" = "Lists every setting the Delivery Optimization service is using (download mode, group, cache limits) and where each one came from."
"Get-AppLockerFileInformation" = "Reads a file's publisher, product and version as AppLocker sees them; .Publisher.BinaryVersion is an MSI's or an EXE's version."

# Configuration Manager beyond the install (lessons configmgr-applications to configmgr-microsoft-365-apps)
"Add-CMMsiDeploymentType" = "Adds a Windows Installer deployment type to an application: -ContentLocation (the .msi on a UNC path), -InstallCommand, -InstallationBehaviorType; the product code becomes its detection method."
"Add-CMScriptDeploymentType" = "Adds a Script Installer deployment type: -ContentLocation, -InstallCommand, a detection method (-ScriptLanguage and -ScriptText, or -AddDetectionClause), -InstallationBehaviorType, -MaximumRuntimeMins."
"Add-CMSoftwareUpdatePoint" = "Adds the software update point role to a site system server with WSUS installed (-WsusIisPort 8530, -WsusIisSslPort 8531)."
"Export-WindowsImage" = "Copies one image out of a WIM or ESD into another file (-SourceIndex, -DestinationImagePath, -CompressionType max), such as an install.esd turned into an install.wim."
"Get-CMDevice" = "Finds devices in the site by name or collection: ResourceID, client status, last activity."
"Get-CMSoftwareUpdate" = "Lists software updates in the site's catalogue (-Fast skips lazy properties): title, article ID, NumMissing, NumPresent, IsDeployed."
"Invoke-CMSoftwareUpdateAutoDeploymentRule" = "Runs an automatic deployment rule now instead of on its schedule (Run Now in the console)."
"New-CMApplication" = "Creates an application in Configuration Manager: name, publisher, version; deployment types are added to it afterwards."
"New-CMApplicationDeployment" = "Deploys an application to a collection: -DeployAction Install, -DeployPurpose Available or Required, -AvailableDateTime, -DeadlineDateTime, -UserNotification."
"New-CMMaintenanceWindow" = "Adds a maintenance window to a collection from a New-CMSchedule schedule; -ApplyTo Any, SoftwareUpdatesOnly or TaskSequencesOnly."
"New-CMOperatingSystemImage" = "Imports a .wim as an operating system image (-Path on a UNC share), ready to distribute and use in a task sequence."
"New-CMSchedule" = "Builds a Configuration Manager schedule (a start, an end or duration, a recurrence such as -DayOfWeek) for maintenance windows, rules and collections."
"New-CMTaskSequenceDeployment" = "Deploys a task sequence to a collection: -DeployPurpose Available or Required, -Availability (clients only, or clients, media and PXE)."
"Remove-CMApplicationDeployment" = "Deletes an application's deployment to a collection."
"Set-CMDistributionPoint" = "Changes a distribution point: PXE (-EnablePxe, -AllowPxeResponse, -EnableUnknownComputerSupport, -EnableNonWdsPxe), boundary groups, content validation."
"Set-CMSoftwareUpdatePointComponent" = "Sets the site's software update options: synchronisation source (-SynchronizeAction, including none for a disconnected site), products, classifications, languages, schedule."
"Start-CMContentDistribution" = "Sends an application's, package's, boot image's or OS image's content to distribution points or groups."
"Sync-CMSoftwareUpdate" = "Starts a software update synchronisation of the site with its software update point (-FullSync)."

"New-CIPolicy" = "Creates an App Control for Business policy XML from a scan of files (-ScanPath, -Level FilePublisher, -Fallback Hash, -UserPEs); -MultiplePolicyFormat for a base or supplemental policy."
"Set-CIPolicyIdInfo" = "Names an App Control policy (-PolicyName), gives it a new PolicyID (-ResetPolicyID) or makes it a supplemental policy of a base (-SupplementsBasePolicyID)."
"Set-RuleOption" = "Adds or (-Delete) removes an App Control rule option by number: 3 Audit Mode, 9 and 10 boot recovery, 11 Disabled:Script Enforcement, 17 Allow Supplemental Policies."
"Set-CIPolicyVersion" = "Sets an App Control policy's version; an update deployed with CiTool must carry an equal or higher one."
"ConvertFrom-CIPolicy" = "Compiles an App Control policy XML to the binary .cip (named after its PolicyID) that CiTool or Intune deploys."
"ConvertFrom-Json" = "Turns JSON text into objects, for a tool that prints JSON (CiTool -json, a REST answer)."
"Get-ProcessMitigation" = "Shows exploit protection settings: -System for everything, -Name <exe> for one program; -RegistryConfigFilePath exports them to XML."
"Set-ProcessMitigation" = "Turns exploit protection mitigations on or off (-Enable, -Disable) for -System or a program -Name; -PolicyFilePath applies an exported XML."
"ConvertTo-ProcessMitigationPolicy" = "Converts an old EMET settings file into exploit protection XML."
"Initialize-ADDeviceRegistration" = "Prepares Active Directory for AD FS's Device Registration Service (the container and objects registered devices are written to)."
"Enable-AdfsDeviceRegistration" = "Turns on the Device Registration Service on an AD FS farm, which Windows Hello for Business on-premises uses to register PCs and keys."

# Windows 11 cloud desktops (autopilot-register): run on your own PC outside the lab, which has no Internet
"Install-Script" = "Installs a script from the PowerShell Gallery (needs the Internet), for example Install-Script -Name Get-WindowsAutopilotInfo -Force."
"Get-WindowsAutopilotInfo" = "A Microsoft script from the PowerShell Gallery that reads a PC's Windows Autopilot hardware hash: -OutputFile for a CSV to import, -GroupTag, -Online to upload it straight to Intune."

"Measure-Command" = "Runs a script block and returns how long it took (TotalSeconds): a quick way to time a file copy before and after a change."

# Secure Boot and the firmware's boot mode (secure-boot-and-firmware-modes)
"Get-SecureBootUEFI" = "Reads one Secure Boot variable from the firmware (-Name PK, KEK, db or dbx): its Bytes hold the signature lists, with the certificates' names readable inside."

[windows]
