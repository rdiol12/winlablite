"Set-CMBoundaryGroup" = "Changes a boundary group: its site systems, site assignment, name."
"Set-CMDiscoveryMethod" = "Turns a discovery method on or off and sets its containers and schedule."
"Set-Content" = "Writes text to a file, replacing what was there."
"Set-DfsrMembership" = "Changes a member's settings for a replicated folder (path, primary member)."
"Set-DhcpServerv4OptionValue" = "Sets DHCP options (router, DNS servers, DNS domain) for a scope or the whole server."
"Set-Disk" = "Brings a disk online or offline, or makes it read-only."
"Set-DnsClientServerAddress" = "Sets the DNS servers an adapter uses."
"Set-DnsServerForwarder" = "Sets a DNS server's forwarders."
"Set-DnsServerZoneAging" = "Turns aging on for a zone and sets its intervals."
"Set-DscLocalConfigurationManager" = "Applies a meta-configuration to the LCM: its mode, interval and reboot behaviour."
"Set-GPPermission" = "Changes who may read, apply or edit a GPO."
"Set-IscsiServerTarget" = "Changes an iSCSI target, such as which initiators may connect."
"Set-ItemProperty" = "Writes a property of an item, typically a registry value."
"Set-LapsADAuditing" = "Turns on auditing of who reads LAPS passwords in an OU."
"Set-LapsADComputerSelfPermission" = "Lets computers in an OU write their own LAPS password attribute."
"Set-MpPreference" = "Changes Defender settings (real-time, PUA, ASR rule actions, exclusions)."
"Set-NetFirewallProfile" = "Changes a firewall profile: on or off, defaults, logging of dropped packets."
"Set-PhysicalDisk" = "Changes a pool disk's settings; -Usage Retired stops Storage Spaces writing to it."
"Set-NpsRadiusClient" ="Changes a RADIUS client NPS knows: its address, or its shared secret (-SharedSecret), say to match an access point's."
"Set-Service" = "Changes a service's start type, description or state."
"Set-SmbServerConfiguration" = "Changes the SMB server's settings, such as signing and SMB 1."
"Set-SmbShare" = "Changes a share's settings, such as access-based enumeration."
"Set-VMFirmware" = "Sets a Generation 2 VM's UEFI firmware: -FirstBootDevice, -EnableSecureBoot Off for most Linux ISOs."
"Set-VMNetworkAdapter" = "Changes a VM's network adapter: -MacAddressSpoofing On (a nested host behind an external switch), VLAN, bandwidth."
"Set-VMProcessor" = "Changes a VM's processors (VM off): -Count, -ExposeVirtualizationExtensions $true to run Hyper-V inside it."
"Set-WBPolicy" = "Makes a Windows Server Backup policy the machine's scheduled backup."
"Set-WBSchedule" = "Sets the times a Windows Server Backup policy runs."
"Set-WdsInstallImage" = "Changes an install image on a WDS server: its name, or the answer file it carries (-UnattendFile)."
"Set-WebConfigurationProperty" = "Changes one IIS configuration setting for a site or the server (-PSPath IIS:\\ -Location <site>)."
"Sort-Object" = "Sorts pipeline objects by one or more properties."
"Start-DscConfiguration" = "Applies a compiled configuration (or the current one with -UseExisting)."
"Start-MpScan" = "Starts a Defender quick, full or custom scan."
"Start-Process" = "Starts a program, optionally elevated, waiting for it to finish."
"Start-Sleep" = "Waits a number of seconds (-Seconds) or milliseconds before the next line runs."
"Start-ScheduledTask" = "Runs a scheduled task now."
"Stop-ScheduledTask" = "Stops a running scheduled task (Start-ScheduledTask starts it again)."
"Unblock-File" = "Removes the downloaded-from-the-internet mark a browser puts on a file, so PowerShell runs the script."
"Get-ADSyncScheduler" = "Microsoft Entra Connect Sync (ADSync module, on the sync server): shows whether the sync cycle is enabled, its interval and the next run."
"Start-ADSyncSyncCycle" = "Microsoft Entra Connect Sync: runs a sync cycle now; -PolicyType Delta for changes, Initial for everything."
"Install-LabCloudSync" = "The entra-hybrid lab's sync agent installer (Install-LabCloudSync.ps1, downloaded from the Lab Cloud admin center): registers the agent and starts it as SYSTEM; -Uninstall removes it."
"Start-Service" = "Starts a service (fails if it is disabled)."
"Start-VM" = "Starts a Hyper-V VM; fails with 'the hypervisor is not running' when the host has no VT-x."
"Start-WBBackup" = "Runs a Windows Server Backup job."
"Start-WBFileRecovery" = "Restores files and folders from a Windows Server Backup."
"Start-WebAppPool" = "Starts an IIS application pool."
"Start-Website" = "Starts an IIS site; fails when another running site holds the same binding."
"Stop-Website" = "Stops an IIS site (WebAdministration module): W3SVC keeps running, the site answers nothing."
"Stop-Process" = "Ends a process by id or name."
"Stop-Service" = "Stops a service."
"Stop-VM" = "Shuts a Hyper-V VM down (-TurnOff pulls the power)."
"Stop-WebAppPool" = "Stops an IIS application pool."
"Suspend-BitLocker" = "Pauses BitLocker protection, for example during a firmware update."
"Suspend-ClusterNode" = "Pauses a cluster node; with -Drain moves its roles off first."
"Test-ADServiceAccount" = "Checks that this machine may use a managed service account."
"Test-ADDSForestInstallation" = "Runs the prerequisite checks of Install-ADDSForest with the same parameters, without promoting anything."
"Test-Cluster" = "Validates nodes, storage and network before creating a cluster."
"Test-ComputerSecureChannel" = "Checks (or with -Repair fixes) the member's secure channel to the domain."
"Test-Connection" = "Pings a host from PowerShell (ICMP or ICMPv6); -Count, -Quiet returns True or False."
"Test-DscConfiguration" = "Reports whether the machine is in its desired state, and what drifted."
"Test-NetConnection" = "Tests reachability: ping, a TCP port (-Port), or a route trace."
"Test-Path" = "Checks whether a file, folder or registry key exists."
"Test-WSMan" = "Checks that WinRM answers on a machine, the first test when remoting fails."
"Uninstall-WindowsFeature" = "Removes a Windows Server role or feature."
"Unlock-ADAccount" = "Unlocks an Active Directory account locked out by bad passwords (clears lockoutTime)."
"Unlock-BitLocker" = "Unlocks a BitLocker volume with its password, recovery password or recovery key."
"Unregister-ScheduledTask" = "Deletes a scheduled task."
"Update-LapsADSchema" = "Extends the AD schema with the Windows LAPS attributes."
"Where-Object" = "Filters pipeline objects by a condition."
"ConvertTo-Json" = "Turns objects into JSON text (ConvertFrom-Json reads it back)."
"Get-ADReplicationAttributeMetadata" = "Shows each attribute's replication version and origin: an authoritative restore adds 100000."
"Get-ScheduledTaskInfo" = "Shows a scheduled task's last run time, its result and its next run."
"Remove-ADOrganizationalUnit" = "Deletes an OU (-Recursive with everything in it); protection from accidental deletion must be off."
"Restart-Computer" = "Restarts the computer, locally or with -ComputerName."
"Set-ADOrganizationalUnit" = "Changes an OU's properties, such as ProtectedFromAccidentalDeletion."
"Approve-WsusUpdate" = "Approves a WSUS update for a computer group (-Action Install -TargetGroupName Pilot)."
"Deny-WsusUpdate" = "Declines a WSUS update: no computer group is offered it again (pipe Get-WsusUpdate into it)."
"Confirm-SecureBootUEFI" = "Says whether Secure Boot is on (True), off (False), or not a UEFI machine (an error)."
"Get-HotFix" = "Lists the installed updates (KB, description, installed on), newest last with Sort-Object InstalledOn."
"Get-WindowsImage" = "Lists the images in a WIM or ESD (index, name, edition), such as a DVD's install.wim."
"Get-WindowsPackage" = "Lists the packages installed in Windows (-Online), the servicing stack's view of updates."
"Get-WsusUpdate" = "Lists WSUS updates by approval (-Approval Approved, Unapproved...) and client status."
"Set-GPRegistryValue" = "Writes a registry-based policy setting into a GPO (-Key, -ValueName, -Type, -Value)."
"Set-GPPrefRegistryValue" = "Adds a Group Policy Preference registry item to a GPO (-Context User or Computer, -Key, -ValueName, -Value, -Type, -Action Update), such as the users' proxy."
"Get-GPPrefRegistryValue" = "Lists the Group Policy Preference registry items of a GPO for one key (-Context, -Key, -ValueName)."
"Add-WebConfigurationProperty" = "Adds an element to an IIS configuration collection, such as a MIME type under system.webServer/staticContent."
"Add-DnsServerForwarder" = "Adds a DNS server this one forwards the names it does not hold to (the ISP's resolver, the lab Internet's DNS)."
"Get-DnsServerGlobalQueryBlockList" = "Shows the names Windows DNS refuses to answer (wpad and isatap by default)."
"Set-DnsServerGlobalQueryBlockList" = "Sets the names Windows DNS refuses to answer (-List), or turns the block list off (-Enable $false)."
"Rename-NetAdapter" = "Renames a network adapter (-Name <old> -NewName Office), so a two-legged server's legs say what they are."
"Set-DnsClient" = "Sets an interface's DNS client options: -RegisterThisConnectionsAddress $false keeps an Internet leg out of AD DNS, -ConnectionSpecificSuffix."
"Get-RemoteAccess" = "Shows how Routing and Remote Access is configured: VPN status, the SSTP certificate (SslCertificate) and more."
"Set-RemoteAccess" = "Changes the RRAS server's settings, such as the certificate SSTP presents (-SslCertificate); restart RemoteAccess after."
"Get-RemoteAccessConnectionStatistics" = "Lists the clients connected to an RRAS server now: user name, tunnel type, client address, its address outside, duration."
"Add-RemoteAccessRadius" = "Adds a RADIUS server for RRAS to send logins (-Purpose Authentication) or accounting (-Purpose Accounting) to."
"Get-RemoteAccessRadius" = "Lists the RADIUS servers RRAS uses for authentication and accounting."
"Set-VpnServerConfiguration" = "Sets the RRAS server's VPN options: -CustomPolicy with the IKEv2 crypto (-EncryptionMethod, -DHGroup, -PfsGroup), ports and more."
"Set-VpnAuthProtocol" = "Sets what an RRAS VPN server accepts: -UserAuthProtocolAccepted, -RootCertificateNameToAccept for IKEv2 machine certificates."
"Add-VpnConnection" = "Creates a VPN connection on a Windows client (-ServerAddress, -TunnelType Sstp or Ikev2, -AuthenticationMethod, -AllUserConnection for every user)."
"Get-VpnConnection" = "Lists VPN connections and their state (ConnectionStatus, SplitTunneling, Routes); -AllUserConnection for the machine-wide ones."
"Set-VpnConnection" = "Changes a VPN connection: -TunnelType, -SplitTunneling, -DnsSuffix, -AuthenticationMethod Eap with -EapConfigXmlStream."
"Add-VpnConnectionRoute" = "Adds a route to a VPN connection (-ConnectionName, -DestinationPrefix 10.96.0.0/24): what a split tunnel carries."
"Set-VpnConnectionIPsecConfiguration" = "Sets the IKEv2 crypto a client connection offers (-EncryptionMethod, -IntegrityCheckMethod, -DHGroup, -PfsGroup); match the server."
"New-EapConfiguration" = "Builds the EAP settings for a VPN connection: -Tls -UserCertificate for EAP-TLS with the user's certificate."
"Get-CACrlDistributionPoint" = "Lists a CA's CRL locations: where it publishes (PublishToServer) and what it writes into certificates (AddToCertificateCdp)."
"Add-CACrlDistributionPoint" = "Adds a CRL location to a CA: a share to publish to (-PublishToServer) or a URL for certificates (-AddToCertificateCdp); restart certsvc."
"Remove-CACrlDistributionPoint" = "Removes a CRL location from a CA (-Uri, exactly as Get-CACrlDistributionPoint shows it)."
"New-WebVirtualDirectory" = "Adds a virtual directory to an IIS site (-Site, -Name crl, -PhysicalPath C:\\CRL)."
"New-CimInstance" = "Creates a WMI/CIM object; with -Namespace root\\cimv2\\mdm\\dmmap -ClassName MDM_VPNv2_01 it hands a ProfileXML to the VPNv2 CSP."
"Remove-CimInstance" = "Deletes a WMI/CIM object, such as an Always On VPN profile in the MDM bridge."
"Test-Certificate" = "Checks a certificate's chain, revocation and use: -Policy SSL -DNSName <name> answers whether a server may present it for that name."
"Get-DscConfigurationStatus" = "Shows the last DSC run on a machine (-All for the history): Status Success or Failure, Type Initial or Consistency, the resources in and out of the desired state; -CimSession for remote machines."
"Get-DscResource" = "Lists the DSC resources the module path offers (-Module NetworkingDsc), with their properties (-Syntax)."
"Get-Job" = "Lists background jobs (Start-Job, Invoke-Command -AsJob) and their state."
"Start-Job" = "Runs a script block as a background job in its own PowerShell process; Receive-Job reads its output."
"Stop-Job" = "Stops background jobs: Get-Job | Stop-Job."
"New-DscChecksum" = "Writes the .checksum file a DSC pull client needs beside each MOF on a pull share."
"Receive-Job" = "Collects the output of a background job; -Wait waits for it to finish."
# File and print operations (winlab/fileops.py): migrations, audits, DFS-R, housekeeping, drills.
"Export-DhcpServer" = "Writes a DHCP server's configuration (scopes, options, reservations) to an XML file; -Leases adds the leases in use."
"Import-DhcpServer" = "Loads a DHCP configuration exported with Export-DhcpServer into this server; -BackupPath keeps a backup of what it replaces, -Leases brings the leases."
"Remove-DhcpServerInDC" = "Takes a DHCP server off AD's list of authorized servers, so it stops handing out addresses."
"Get-DhcpServerv4Binding" = "Lists the network adapters the DHCP server listens on, with BindingState True or False."
"Get-PrinterPort" = "Lists the printer ports on a print server: name, type and PrinterHostAddress for a TCP/IP port."
"Remove-Printer" = "Deletes a print queue from a print server."
"Set-Printer" = "Changes a print queue: -ShareName, -Shared, -Published (listed in AD), -DriverName, -PortName."
"New-SmsInventory" = "Storage Migration Service: creates a migration job and the inventory of its source servers."
"Start-SmsInventory" = "Storage Migration Service: runs a job's inventory (shares, their settings, volumes) of the source."
"Get-SmsState" = "Storage Migration Service: the state of a job; -InventorySummary, -TransferSummary and -CutoverSummary give each phase's result."
"New-SmsTransfer" = "Storage Migration Service: pairs a job's source with a destination server and its volumes for the transfer."
"Start-SmsTransfer" = "Storage Migration Service: copies the data with its permissions and re-creates the shares; a re-run copies only changes."
"New-SmsCutover" = "Storage Migration Service: sets up the cutover, including which addresses move from source to destination."
"Start-SmsCutover" = "Storage Migration Service: gives the destination the source's name and addresses and renames the source."
"Get-Help" = "Shows a command's help; -Full lists every parameter with its description and examples."
"Get-PermissionReport" = "The permission-audit lesson's own script (C:\\winlab\\audit\\Get-PermissionReport.ps1): share and NTFS entries of a share, two levels down, to a CSV."
"Invoke-RestoreDrill" = "The restore-drills lesson's own script (C:\\winlab\\drill\\Invoke-RestoreDrill.ps1): restores a known file from the newest backup, compares hashes, writes a JSON record."
"New-ScheduledTaskTrigger" = "Builds a trigger for Register-ScheduledTask: -Daily, -Weekly -DaysOfWeek, -At, -AtStartup, -Once."
"Compare-Object" = "Compares two sets of objects (two reports) by the properties named in -Property and shows what is only in one of them."
"Out-File" = "Writes the output of a command to a text file."
"Get-DfsrMembership" = "Shows each member's settings in a DFS replication group: content path, staging path and quota, ConflictAndDeleted quota."
"Suspend-DfsReplicationGroup" = "Pauses DFS replication from one member to another for a number of minutes."
"Sync-DfsReplicationGroup" = "Resumes and forces DFS replication from one member to another, ignoring the schedule for a while."
"Get-DfsrPreservedFiles" = "Lists the files a ConflictAndDeletedManifest.xml (or PreExistingManifest.xml) records."
"Restore-DfsrPreservedFiles" = "Copies or moves preserved files out of ConflictAndDeleted or PreExisting, to their origin or another path."
"Update-DfsrConfigurationFromAD" = "Makes DFS Replication read its configuration from AD now instead of at the next poll."
"Set-DedupVolume" = "Changes a deduplicated volume's settings, such as -MinimumFileAgeDays and excluded folders."
"Start-DedupJob" = "Runs a Data Deduplication job now: -Type Optimization, GarbageCollection or Scrubbing; -Wait waits for it."
"Get-DedupJob" = "Lists the Data Deduplication jobs running or queued, with their progress."
"New-FsrmQuotaTemplate" = "Creates an FSRM quota template: a size, hard or soft, and threshold actions."
"New-FsrmAutoQuota" = "Applies a quota template to every existing and future subfolder of a path (home folders)."
"Get-FsrmAutoQuota" = "Lists FSRM auto-apply quotas and their templates."
"New-FsrmFileScreenException" = "Allows file groups in a folder below a screened path."
"Get-FsrmFileScreenException" = "Lists FSRM file screen exceptions."
"New-FsrmScheduledTask" = "Builds the schedule object FSRM storage reports and file management tasks use (-Time, -Weekly, -Monthly)."
"Get-FsrmStorageReport" = "Lists FSRM storage reports with their types and schedules."
"Start-FsrmStorageReport" = "Runs an FSRM storage report now."

# The inherited company's first 30 days (winlab/inherited.py).
"Set-ADGroup" = "Changes a group's attributes: -Description (an owner), -GroupScope, -ManagedBy."
"Remove-ADPrincipalGroupMembership" = "Takes a user or computer out of the groups named in -MemberOf (all but its primary group) in one call."
"Backup-GPO" = "Backs up one GPO (-Name) or all of them (-All) to -Path: each a folder with the GPO's settings and a bkupInfo.xml."
"Remove-GPO" = "Deletes a GPO and its links (-Name or -Guid); back it up first."
"Remove-GPLink" = "Removes a GPO's link from a site, domain or OU (-Name, -Target); the GPO itself stays."
"Restore-GPO" = "Restores a GPO from a backup to the same GPO (same GUID): -Name or -BackupId, -Path."
"Import-GPO" = "Imports the settings of a backup into another, possibly new, GPO (-BackupGpoName, -TargetName, -Path, -CreateIfNeeded)."
"Revoke-SmbShareAccess" = "Takes an account's entry off a share's permissions (-Name, -AccountName, -Force)."
"Grant-SmbShareAccess" = "Gives an account Full, Change or Read on a share (-Name, -AccountName, -AccessRight, -Force)."
"Set-Acl" = "Writes a security descriptor (from Get-Acl, changed) back to a file, folder or registry key."
"Set-ScheduledTask" = "Changes a scheduled task: its actions, triggers, principal, settings, or a task object with a new Description piped in."
"Disable-ScheduledTask" = "Turns a scheduled task off without deleting it (Enable-ScheduledTask turns it back on)."
"Set-DnsServerScavenging" = "Turns scavenging of stale DNS records on for a DNS server (-ScavengingState $true) and sets how often it runs."
"Move-ADDirectoryServer" = "Moves a domain controller into another AD site (-Identity dc02 -Site Recovery), so clients in that site find it first."
"Move-ADDirectoryServerOperationMasterRole" = "Transfers FSMO roles to a domain controller (-Identity, -OperationMasterRole); -Force seizes them when the old holder is gone for good."
"New-Starters" = "The joiner script the automate-joiners lesson writes (C:\\Scripts\\New-Starters.ps1): reads HR's CSV, skips existing accounts, refuses rows without a department group, logs every decision."
"Test-ADHealth" = "The health script the ad-health-routine lesson writes (C:\\Scripts\\Test-ADHealth.ps1): dcdiag, repadmin and SYSVOL's state into a dated report."
"Get-StaffAccount" = "A JEA function the jea-helpdesk-ad lesson writes: shows a staff account's enabled, locked and password state."
"Unlock-StaffAccount" = "A JEA function the jea-helpdesk-ad lesson writes: unlocks an account in Corp/Users, refusing privileged ones."
"Reset-StaffPassword" = "A JEA function the jea-helpdesk-ad lesson writes: resets a staff password from a SecureString and sets must-change-at-next-logon."
"Add-Content" = "Appends lines to a file (a log, a report) without rewriting it."
"Move-Item" = "Moves or renames a file or folder (Move-Item <file> <folder> -Force)."
"Split-Path" = "Takes a path apart: the parent folder by default, -Leaf the last part, -Qualifier the drive."
"ConvertFrom-Csv" = "Turns CSV text (repadmin /showrepl /csv, for instance) into objects you can filter and sort."
"ConvertTo-SecureString" = "Makes a SecureString; -AsPlainText -Force from text made in the script (a random first password), never from a literal in a file."
"Start-Transcript" = "Records everything a PowerShell session does into a text file until Stop-Transcript: the log of an unattended script."
"Compress-Archive" = "Makes a .zip from files and folders (-Path, -DestinationPath); Expand-Archive opens it again."
"Remove-ADUser" = "Deletes a user account; with the Recycle Bin on it can be restored for the deleted object lifetime."
"Remove-ADObject" = "Deletes any directory object; -Recursive deletes what is under it too (a dead DC's server object in Sites, a computer account with its child objects)."
"Get-ADPrincipalGroupMembership" = "Lists every group an account is a direct member of, including the primary group that MemberOf leaves out."
"New-MoveRequest" = "Exchange Server: moves a mailbox to another database or server while the user keeps working."
"Get-WSManCredSSP" = "Shows whether this machine allows CredSSP as a client (and to which servers) or as a server."
"Enable-WSManCredSSP" = "Turns CredSSP on for WinRM (-Role Client or Server): it sends the user's password to the server, so avoid it; Disable-WSManCredSSP turns it off."
"Uninstall-ADDSDomainController" = "Demotes a domain controller; -ForceRemoval demotes one that cannot replicate (after a USN rollback, or cut off), leaving the metadata cleanup to do on a healthy DC."
"New-ADAuthenticationPolicy" = "Creates an authentication policy: TGT lifetime (-UserTGTLifetimeMins) and where accounts may authenticate from (-UserAllowedToAuthenticateFrom, an SDDL condition)."
"Set-ADAuthenticationPolicy" = "Changes an authentication policy; -Enforce $true moves it from audit to enforced."
"Get-ADAuthenticationPolicy" = "Lists authentication policies with their lifetimes, conditions and whether they are enforced."
"New-ADAuthenticationPolicySilo" = "Creates an authentication policy silo naming the policy for its users, computers and services; -Enforce to enforce it."
"Set-ADAuthenticationPolicySilo" = "Changes a silo; -Enforce $true enforces its policies."
"Get-ADAuthenticationPolicySilo" = "Lists silos, their policies, members and enforcement."
"Grant-ADAuthenticationPolicySiloAccess" = "Permits an account (user, computer or service) to be a member of a silo."
"Set-ADAccountAuthenticationPolicySilo" = "Assigns a permitted account to a silo, so the silo's policy applies to it."
"Test-PSSessionConfigurationFile" = "Checks a .pssc session configuration file for errors before you register it."
"Get-PSSessionCapability" = "Lists the commands a given user gets on a JEA endpoint (-ConfigurationName, -Username), without signing in as them."
"Invoke-CimMethod" = "Calls a method of a WMI/CIM class or object, such as PollDsNow on DFSR's DfsrConfig."
"Get-IISAppPool" = "Lists IIS application pools with their state and identity (processModel.userName)."

# Security operations (lessons event-forwarding-collector to scheduled-report-gmsa)
"ConvertTo-Html" = "Turns objects into an HTML table; -Fragment gives just the table, to build a mail body from several sections."
"Get-LocalUser" = "Lists the machine's local accounts with Enabled, LastLogon and PasswordExpires (the Guest account should be disabled)."
"Install-ChocolateyInstallPackage" = "A Chocolatey helper for a package's chocolateyinstall.ps1: runs an installer that ships inside the package (-File, -FileType msi, -SilentArgs, -ValidExitCodes)."
"New-EventLog" = "Registers an event source in a log once (New-EventLog -LogName Application -Source AdminReport), so a script can write its own events."
"Set-ExecutionPolicy" = "Changes the PowerShell execution policy; -Scope Process Bypass lets this window run a downloaded script without changing the machine."
"Write-EventLog" = "Writes an event to a classic log with a registered source: -LogName, -Source, -EventId, -EntryType, -Message."
# Windows 11 servicing and Microsoft Edge (the windows11-desktops lessons)
"New-Guid" = "Makes a new random GUID, such as the Group ID that puts PCs in one Delivery Optimization peer group."
"Get-DeliveryOptimizationStatus" = "Lists the files Delivery Optimization is handling or has cached, with BytesFromHttp and BytesFromPeers for each."
"Get-DeliveryOptimizationPerfSnap" = "Shows the Delivery Optimization service's current state: its download mode and where it came from, the cache, and its totals."
"Get-DOConfig" = "Lists every setting the Delivery Optimization service is using (download mode, group, cache limits) and where each one came from."
"Get-AppLockerFileInformation" = "Reads a file's publisher, product and version as AppLocker sees them; .Publisher.BinaryVersion is an MSI's or an EXE's version."

# Configuration Manager beyond the install (lessons configmgr-applications to configmgr-microsoft-365-apps)
"Add-CMMsiDeploymentType" = "Adds a Windows Installer deployment type to an application: -ContentLocation (the .msi on a UNC path), -InstallCommand, -InstallationBehaviorType; the product code becomes its detection method."
"Add-CMScriptDeploymentType" = "Adds a Script Installer deployment type: -ContentLocation, -InstallCommand, a detection method (-ScriptLanguage and -ScriptText, or -AddDetectionClause), -InstallationBehaviorType, -MaximumRuntimeMins."
