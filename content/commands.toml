"gpmc.msc" = "The Group Policy Management console."
"gpresult" = "Shows which GPOs applied to a user and computer, and which were filtered out (/r, /h)."
"gpupdate" = "Refreshes Group Policy now (/force reapplies everything)."
"icacls" = "Shows and changes NTFS permissions on files and folders."
