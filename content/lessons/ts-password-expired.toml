[lesson]
id = "ts-password-expired"
title = "The password that worked yesterday"
module = "troubleshoot"
order = 40
lab = "ad-ds-basics"
node = "dc01"
problem = "password-expired"
minutes = 15
summary = "A user is told to change a password they cannot change from where they are."
why = '''
An account has states that have nothing to do with the password being
correct: expired, must change at next logon, disabled, locked, logon hours.
Each produces a different message on the client and a different attribute in
AD. Reading the account first (Get-ADUser with the right properties) turns a
confusing call into a thirty-second fix, and tells you whether it was policy
doing its job or an administrator setting a flag.
'''
concepts = [
  "pwdLastSet: zero means must change at next logon; the age against MaxPasswordAge decides expiry",
  "PasswordExpired, PasswordNeverExpires, Enabled, LockedOut: the properties that explain a refused logon",
  "Fine-grained password policy: a PSO can give a group different rules than the domain default",
  "Service accounts: should not expire by surprise; use gMSA or PasswordNeverExpires with a review",
]
steps = [
  "Press Break above (or run winlab break dc01 password-expired). Do not read the hints yet.",
  "Reproduce the symptom as a user would see it, from another machine where that makes sense.",
  "Form one hypothesis and test it with a command; write down what you ruled out.",
  "Fix the cause, not the symptom. Then press Verify my fix: it checks the machine, not your answer.",
  "Find the evidence in the logs that would have told you earlier, and note what monitoring would have caught it.",
]
pitfalls = [
  "Setting PasswordNeverExpires to make the call go away removes a control; set it only for accounts whose rotation is managed another way.",
  "A user on a VPN or a remote desktop often cannot change an expired password; reset it and let them change it once inside.",
]
further = [
  "Microsoft Learn: Set-ADUser",
  "Microsoft Learn: Password policy settings",
]

[[verify]]
label = "the account's state"
node = "dc01"
cmd = "Get-ADUser asmith -Properties PasswordExpired, PasswordLastSet, PasswordNeverExpires, LockedOut, Enabled | Select-Object SamAccountName, Enabled, PasswordExpired, PasswordLastSet, PasswordNeverExpires, LockedOut | Format-List"

[[verify]]
label = "the domain password policy"
node = "dc01"
cmd = "Get-ADDefaultDomainPasswordPolicy | Select-Object MaxPasswordAge, MinPasswordLength, LockoutThreshold | Format-List"

# Recall questions, answered from memory after the lesson.
[[quiz]]
q = "pwdLastSet = 0 means what?"
answer = "The user must change the password at next logon"
wrong = ["The password never expires", "The account is disabled", "The password is blank"]
why = "Age against MaxPasswordAge decides expiry otherwise."

[[quiz]]
q = "Why not set PasswordNeverExpires to make the call go away?"
answer = "It removes a control; use it only where rotation is managed another way"
wrong = ["It is not allowed on users", "It locks the account", "It breaks Kerberos"]
why = "Service accounts should be gMSAs instead."

[[quiz]]
q = "A remote user on VPN cannot change an expired password. A practical fix?"
answer = "Reset it and let them change it once connected inside"
wrong = ["Disable the account", "Turn off the password policy", "Give them Domain Admin"]
why = "Remote sessions often cannot do the change flow."
