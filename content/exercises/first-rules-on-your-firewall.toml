[exercise]
id = "first-rules-on-your-firewall"
title = "The firewall you installed routes the office out and blocks port 8080"
lab = "firewall-by-hand"
nodes = ["fw01", "inet01", "pc01"]  # booted by `winlab exercise start`
brief = '''
fw01 is the OPNsense or pfSense CE firewall you installed by hand. winlab runs
nothing inside it, so the grade is read from both sides of it: pc01 on the LAN
must lease its address from the firewall and reach the Internet host only
through it (the LAN switch has no other way out), inet01 must see pc01 arrive
from the firewall's WAN address, the GUI must stay closed to the Internet, and
your first rule must block TCP 8080, a port inet01 really answers on.
'''
tasks = [
  "Install the firewall on fw01, WAN on em0 (the ISP), LAN on em1",
  "Let pc01 lease 192.168.1.x from the firewall and finish the setup wizard from its browser",
  "Open http://198.51.100.10/ from pc01 through the firewall",
  "On LAN, block TCP to port 8080 above the default allow rule; port 80 keeps working",
]

[[check]]
name = "pc01 leased its address from the firewall on the LAN"
node = "pc01"
script = "@(Get-NetIPConfiguration | Where-Object { $_.IPv4DefaultGateway } | ForEach-Object { $_.IPv4DefaultGateway.NextHop })[0]"
match = "regex"
expect = '^192\.168\.1\.\d+$'
weight = 1
hint = "The firewall serves DHCP on LAN once em1 is assigned as LAN; ipconfig /renew on pc01, and check the cable on fw01's port 2"

[[check]]
name = "pc01 reaches the Internet host on port 80, through the firewall"
node = "pc01"
script = "Test-NetConnection 198.51.100.10 -Port 80 -InformationLevel Quiet -WarningAction SilentlyContinue"
expect = "True"
weight = 3
hint = "The LAN switch has no other way out: WAN must be em0 with a lease from the ISP segment, and LAN's default allow rule must still be there"

[[check]]
name = "the Internet host saw pc01 arrive from the firewall's WAN address (NAT)"
node = "inet01"
shell = "sh"
script = "awk '$2 == 80 && $3 ~ /^198\\.51\\.100\\./' /var/log/inet-host.log | wc -l"
match = "regex"
expect = '^\s*[1-9]'
weight = 2
hint = "Open http://198.51.100.10/ from pc01 once; with outbound NAT on (automatic is the default) the source is the WAN lease"

[[check]]
name = "the firewall's web GUI is closed to the Internet"
node = "inet01"
shell = "sh"
script = "w=$(awk '$2 == 80 {print $3}' /var/log/inet-host.log | tail -n 1); [ -n \"$w\" ] && nmap -Pn -p 443 \"$w\" | grep -E -c '^443/tcp +(filtered|closed)'"
expect = "1"
weight = 1
hint = "Nothing may pass in on WAN to the GUI: remove any WAN rule that allows 443, and leave the GUI listening on LAN"

[[check]]
name = "TCP 8080 to the Internet host is blocked from the LAN"
node = "pc01"
script = "Test-NetConnection 198.51.100.10 -Port 8080 -InformationLevel Quiet -WarningAction SilentlyContinue"
expect = "False"
weight = 3
hint = "Firewall, Rules, LAN: Block, TCP, source LAN net, destination port 8080, above the default allow rule; then Apply"

[[check]]
name = "inet01 still answers on 8080, so the block is the firewall's"
node = "inet01"
shell = "sh"
script = "netstat -ltn | grep -c ':8080 '"
match = "regex"
expect = '^[1-9]'
weight = 1
hint = "inet01's test service starts with the lab; power it off and on from the Workbench if it is not listening"
