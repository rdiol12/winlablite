[exercise]
id = "onboard-new-starters"
title = "Onboard the new starters"
lab = "ad-ds-basics"
reset_nodes = []
nodes = ["dc01", "fs01", "pc01"]
brief = """
HR's new-starter sheet is on the media shelf (turn the workday on in the
Office window if it is not). Everyone on it starts today. Give each of them an
account with the attributes on the sheet, their department's group, access to
their department's folder and a home folder, hand out their first passwords
(the Office window's staff list), and watch them sign in and work. Tickets
from the staff tell you what is still missing.
"""
tasks = [
  "On dc01, create a global security group per department: G-FrontDesk, G-Finance, G-Sales, G-HR, G-Operations",
  "Create an enabled account for every person on the sheet, with its Department, Title and EmailAddress filled in",
  "Make every new starter a member of their department's group",
  "On fs01, give each department a folder in the Company share (FrontDesk, Finance, ...) its group can change",
  "Give every new starter a home folder (HomeDirectory and HomeDrive set)",
  "Type their first passwords into the Office window's staff list and let the workday run until they sign in",
]

[[check]]
name = "a global security group per department"
node = "dc01"
script = "@('G-FrontDesk','G-Finance','G-Sales','G-HR','G-Operations' | Where-Object { $g = Get-ADGroup -Filter \"Name -eq '$_'\"; $g -and $g.GroupScope -eq 'Global' -and $g.GroupCategory -eq 'Security' }).Count"
expect = "5"
weight = 2
hint = "New-ADGroup -Name G-Finance -GroupScope Global -GroupCategory Security, once per department (the department's name without spaces)"

[[check]]
name = "the new starters have enabled accounts with department, title and mail"
node = "dc01"
script = "@(Get-ADUser -Filter \"Department -like '*'\" -Properties Department, Title, EmailAddress | Where-Object { $_.Enabled -and $_.Title -and $_.EmailAddress }).Count -ge 10"
expect = "True"
weight = 3
hint = "Import-Csv the sheet and run New-ADUser per row with -Department, -Title, -EmailAddress, -AccountPassword (Read-Host -AsSecureString) and -Enabled $true"

[[check]]
name = "everyone is in their department's group"
node = "dc01"
script = "$u = @(Get-ADUser -Filter \"Department -like '*'\" -Properties Department, MemberOf); $u.Count -gt 0 -and -not ($u | Where-Object { $g = 'G-' + ($_.Department -replace '[^A-Za-z0-9]', ''); -not ($_.MemberOf | Where-Object { $_ -like \"CN=$g,*\" }) })"
expect = "True"
weight = 2
hint = "Add-ADGroupMember -Identity ('G-' + ($_.Department -replace ' ', '')) -Members $_.SamAccountName, per row of the sheet"

[[check]]
name = "each department's folder in the Company share is granted to its group"
node = "fs01"
script = "$root = (Get-SmbShare -Name Company -ErrorAction SilentlyContinue).Path; [bool]$root -and -not ('FrontDesk','Finance','Sales','HR','Operations' | Where-Object { $p = Join-Path $root $_; -not ((Test-Path $p) -and ((Get-Acl $p).Access.IdentityReference.Value -match \"\\\\G-$_$\")) })"
expect = "True"
weight = 2
hint = "New-Item -ItemType Directory D:\\Shares\\Company\\Finance; icacls D:\\Shares\\Company\\Finance /grant 'CORP\\G-Finance:(OI)(CI)M', for each department"

[[check]]
name = "every new starter has a home folder"
node = "dc01"
script = "$u = @(Get-ADUser -Filter \"Department -like '*'\" -Properties HomeDirectory, HomeDrive); $u.Count -gt 0 -and -not ($u | Where-Object { -not $_.HomeDirectory -or -not $_.HomeDrive })"
expect = "True"
weight = 2
hint = "Set-ADUser <account> -HomeDirectory '\\\\fs01\\Home$\\<account>' -HomeDrive H:, after making the folder on fs01"

[[check]]
name = "the staff are signing in (4624 on the DC)"
node = "dc01"
script = "$staff = @(Get-ADUser -Filter \"Department -like '*'\" | ForEach-Object SamAccountName); [bool](Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4624} -MaxEvents 3000 -ErrorAction SilentlyContinue | Where-Object { $staff -contains $_.Properties[5].Value } | Select-Object -First 1)"
expect = "True"
weight = 2
hint = "Turn the workday on, type the first passwords into Office > Staff list, and give the clock a working hour (winlab clock jump 09:00 on a weekday)"
