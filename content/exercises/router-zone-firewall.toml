[exercise]
id = "router-zone-firewall"
title = "Users may use the domain; the servers may only answer"
lab = "ad-ds-basics"
reset_nodes = []
nodes = ["dc01", "fs01", "pc01"]
brief = """
The office is one flat network, and anything on it can reach anything. Move
the users onto a LAN of their own behind the router, put the servers and
the users in zones of the router's zone-based firewall, and let the users
start only what a domain member needs, inspected so the answers come back.
Nothing the servers start may reach the users. The checks read the router's
own firewall rules, its connection tracking, and pc01 and dc01.
"""
tasks = [
  "On the Workbench add a switch, cable it into a free router port, move pc01's cable onto it; address the router's port (10.10.20.1/24) and give the LAN a DHCP pool with dc01 as its DNS server",
  "Make two zones (servers on corp's port, users on the new port) and a zone-pair from the users to the servers only",
  "Its policy: inspect the domain's services towards dc01 and SMB towards the servers (an access list in a class-map type inspect), inspect ICMP, drop the rest",
  "Show it works: pc01 logs on, updates its policies and opens a share on fs01; dc01 cannot reach pc01",
]

[[check]]
name = "two zones with interfaces in them, and a zone-pair with a policy between them"
node = "fabric"
shell = "sh"
script = '''
if nft list table ip wlzbf 2>/dev/null | grep -q 'jump zp_'; then echo True; else echo False; fi
'''
expect = "True"
weight = 2
hint = "zone security SERVERS and zone security USERS, zone-member security on each interface, then zone-pair security U2S source USERS destination SERVERS with service-policy type inspect."

[[check]]
name = "the users' traffic to the servers was inspected"
node = "fabric"
shell = "sh"
script = '''
if nft list table ip wlzbf 2>/dev/null | grep 'ct mark set' | grep -q 'packets [1-9]'; then echo True; else echo False; fi
'''
expect = "True"
weight = 2
hint = "A class in the policy-map needs the action inspect (not pass) and pc01 must use it: sign in, gpupdate /force, open a share on fs01."

[[check]]
name = "the router tracks inspected connections (their return traffic is allowed by state)"
node = "fabric"
shell = "sh"
script = '''
conntrack -L 2>/dev/null | awk 'BEGIN{r="False"} {for (i=1;i<=NF;i++) if ($i ~ /^mark=/) { split($i,m,"="); if (int(m[2]/1048576) == 1441) r="True" }} END{print r}'
'''
expect = "True"
weight = 1
hint = "show policy-map type inspect zone-pair sessions lists them. If it is empty, use pc01 (open \\\\fs01\\c$) and look again within a minute."

[[check]]
name = "something the policy does not allow was dropped between the zones"
node = "fabric"
shell = "sh"
script = '''
if nft list table ip wlzbf 2>/dev/null | grep 'comment "zbf' | grep ' drop ' | grep -q 'packets [1-9]'; then echo True; else echo False; fi
'''
expect = "True"
weight = 1
hint = "From dc01 try Test-Connection pc01: there is no zone-pair from the servers to the users, so the router drops it and counts it."

[[check]]
name = "pc01 reaches fs01 on SMB across the firewall"
node = "pc01"
script = "(Test-NetConnection fs01 -Port 445 -WarningAction SilentlyContinue).TcpTestSucceeded"
expect = "True"
weight = 2
hint = "The access list in class DOMAIN needs permit tcp any 10.10.10.0 0.0.0.255 eq 445, and pc01 needs its DNS (udp and tcp 53 to dc01) to find fs01."

[[check]]
name = "pc01 is on the user LAN, with the router as its gateway"
node = "pc01"
script = "(Get-NetIPConfiguration | Where-Object IPv4DefaultGateway | Select-Object -First 1).IPv4DefaultGateway.NextHop"
expect = "10.10.20.1"
weight = 1
hint = "Move pc01's cable onto the new switch, give the router's port 10.10.20.1/24 and a DHCP pool with default-router 10.10.20.1, then ipconfig /renew on pc01."

[[check]]
name = "dc01 cannot start a conversation with pc01"
node = "dc01"
script = "if (Resolve-DnsName pc01 -ErrorAction SilentlyContinue) { Test-Connection pc01 -Count 2 -Quiet } else { 'pc01 not in DNS' }"
expect = "False"
weight = 1
hint = "No zone-pair from SERVERS to USERS: if dc01 still reaches pc01, check that both interfaces are zone members (show zone security). If pc01 is not in DNS, its dynamic update to dc01 (tcp and udp 53) is blocked."
