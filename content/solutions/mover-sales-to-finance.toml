[solution]
exercise = "mover-sales-to-finance"
notes = "The lesson's break (mover-to-finance) sets dprice up in Sales first."

[[step]]
node = "dc01"
shell = "powershell"
script = '''
Set-ADUser dprice -Department Finance -Title 'Finance analyst'
Remove-ADGroupMember G-Sales -Members dprice -Confirm:$false
Remove-ADGroupMember 'Sales Team' -Members dprice -Confirm:$false
Add-ADGroupMember G-Finance -Members dprice
Add-ADGroupMember 'Finance Team' -Members dprice
$dirs = @(Get-Item C:\Shares\Sales) + @(Get-ChildItem C:\Shares\Sales -Recurse -Directory)
foreach ($d in $dirs) {
  if ((Get-Acl $d.FullName).Access | Where-Object { -not $_.IsInherited -and [string]$_.IdentityReference -match '\\dprice$' }) {
    icacls $d.FullName /remove CORP\dprice | Out-Null
  }
}
'''

[[step]]
node = "dc01"
shell = "powershell"
script = '''
robocopy C:\Shares\Home\dprice C:\Shares\HomeFinance\dprice /E /MOVE /COPYALL /R:1 /W:1 | Out-Null
if (Test-Path C:\Shares\Home\dprice) { Remove-Item C:\Shares\Home\dprice -Recurse -Force }
Set-ADUser dprice -HomeDirectory '\\dc01\HomeFinance$\dprice' -HomeDrive H:
exit 0
'''
