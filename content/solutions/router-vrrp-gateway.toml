[solution]
exercise = "router-vrrp-gateway"
notes = "Self-contained: OSPF between the lab router and rtr-edge first (so either router can route to the workshop), then VRRP. pc-office's gateway is changed in its netplan file as the lesson does."

[[step]]
node = "winlab"
shell = "winlab"
script = '''
media router-protocols rtr-edge pack frr
'''

[[step]]
node = "rtr-edge"
shell = "sh"
script = '''
mkdir -p /mnt/winlab-pack
mount LABEL=WLPACK /mnt/winlab-pack
echo 'deb [trusted=yes] file:/mnt/winlab-pack ./' > /etc/apt/sources.list.d/winlab-pack.list
apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/winlab-pack.list -o Dir::Etc::sourceparts=- update
DEBIAN_FRONTEND=noninteractive apt-get install -y frr frr-pythontools traceroute
umount /mnt/winlab-pack
echo net.ipv4.ip_forward=1 > /etc/sysctl.d/90-router.conf
sysctl --system
sed -i 's/^ospfd=no/ospfd=yes/' /etc/frr/daemons
sed -i 's/^vrrpd=no/vrrpd=yes/' /etc/frr/daemons

systemctl restart frr
'''
timeout = 1200

[[step]]
node = "router"
shell = "console"
script = '''
enable
configure terminal
router ospf 1
router-id 2.2.2.2
network 10.80.0.0 0.0.0.255 area 0
end
write memory
'''
wait = 10

[[step]]
node = "rtr-edge"
shell = "sh"
script = '''
vtysh -c 'configure terminal' -c 'router ospf' -c 'ospf router-id 3.3.3.3' -c 'network 10.80.0.0/24 area 0' -c 'network 10.81.0.0/24 area 0' -c 'end' -c 'write memory'
'''
wait = 60

[[step]]
node = "router"
shell = "console"
script = '''
enable
configure terminal
interface g0/1/0
vrrp 1 ip 10.80.0.1
vrrp 1 priority 110
end
write memory
'''
wait = 10

[[step]]
node = "rtr-edge"
shell = "sh"
script = '''
ip link add vrrp4-1 link eth1 addrgenmode random type macvlan mode bridge
ip link set dev vrrp4-1 address 00:00:5e:00:01:01
ip addr add 10.80.0.1/24 dev vrrp4-1
ip link set dev vrrp4-1 up
sysctl -w net.ipv4.conf.eth1.arp_ignore=1
vtysh -c 'configure terminal' -c 'interface eth1' -c 'vrrp 1 version 2' -c 'vrrp 1 ip 10.80.0.1' -c 'end' -c 'write memory'
'''
wait = 15

[[step]]
node = "pc-office"
shell = "sh"
script = '''
sed -i 's/via: 10.80.0.2/via: 10.80.0.1/' /etc/netplan/50-cloud-init.yaml
netplan apply
sleep 5
ping -c 2 -W 2 10.80.0.1 || true
'''
wait = 5
