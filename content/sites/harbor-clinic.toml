# ---- shares, DHCP and DNS done as a network admin would
[[check]]
section = "Files"
name = "Records share: share rights leave Everyone no Full Control; the folder's NTFS rights decide"
node = "dc01"
script = '''
$a = Get-SmbShareAccess -Name Records -ErrorAction SilentlyContinue
if (-not $a) { 'no share Records' } else {
  $wide = $a | Where-Object { $_.AccountName -match '^Everyone$' -and $_.AccessRight -eq 'Full' -and $_.AccessControlType -eq 'Allow' }
  $in = $a | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.AccessRight -in 'Change','Full' }
  if ($wide) { 'Everyone has Full Control on the share' } elseif (-not $in) { 'no one can change through the share: give the groups (or Authenticated Users) Change' } else { 'True' }
}
'''
hint = "Advanced Sharing > Permissions: remove Everyone, give Authenticated Users (or Doctors and Reception) Change; the Security tab does the rest."
[[check]]
section = "Files"
name = "Records folder: its own rights (inheritance off), Doctors Modify but not Full Control"
node = "dc01"
script = '''
$s = Get-SmbShare -Name Records -ErrorAction SilentlyContinue
if (-not $s) { 'no share Records' } else {
  $acl = Get-Acl $s.Path
  $full = $acl.Access | Where-Object { $_.IdentityReference -match '\\Doctors$' -and $_.FileSystemRights -match 'FullControl' }
  if (-not $acl.AreAccessRulesProtected) { 'the folder still inherits from the drive (disable inheritance)' }
  elseif ($full) { 'Doctors have Full Control: they could change the rights themselves; Modify is enough' } else { 'True' }
}
'''
[[check]]
section = "Files"
name = "Records hides what a person cannot open (access-based enumeration)"
node = "dc01"
script = "[string](Get-SmbShare -Name Records -ErrorAction SilentlyContinue).FolderEnumerationMode"
expect = "AccessBased"
[[check]]
section = "Server"
name = "DHCP option 15: the domain name clinic.lab"
node = "dc01"
script = '''
$v = @(Get-DhcpServerv4OptionValue -ScopeId 10.10.10.0 -OptionId 15 -ErrorAction SilentlyContinue) + @(Get-DhcpServerv4OptionValue -OptionId 15 -ErrorAction SilentlyContinue)
if (($v.Value -join ',') -match '^clinic\.lab$|(^|,)clinic\.lab(,|$)') { 'True' } else { 'no option 15 (DNS domain name) clinic.lab' }
'''
[[check]]
section = "Server"
name = "DHCP keeps 10.10.10.1 to 10.10.10.20 out of the pool"
node = "dc01"
script = '''
$s = Get-DhcpServerv4Scope -ScopeId 10.10.10.0 -ErrorAction SilentlyContinue
$ex = Get-DhcpServerv4ExclusionRange -ScopeId 10.10.10.0 -ErrorAction SilentlyContinue
$n = { param($ip) $b = ([ipaddress]$ip).GetAddressBytes(); [array]::Reverse($b); [BitConverter]::ToUInt32($b, 0) }
$lo = & $n '10.10.10.1'; $hi = & $n '10.10.10.20'
$pool = $s -and (& $n $s.StartRange) -gt $hi
$cut = $ex | Where-Object { (& $n $_.StartRange) -le $lo -and (& $n $_.EndRange) -ge $hi }
if (-not $s) { 'no scope 10.10.10.0' } elseif ($pool -or $cut) { 'True' } else { 'the pool still hands out addresses in .1 to .20' }
'''
[[check]]
section = "Server"
name = "PRN01 has a DHCP reservation, and DNS agrees with it"
node = "dc01"
script = '''
$r = Get-DhcpServerv4Reservation -ScopeId 10.10.10.0 -ErrorAction SilentlyContinue
$a = (Resolve-DnsName prn01.clinic.lab -Type A -ErrorAction SilentlyContinue | Where-Object Type -eq 'A').IPAddress
if (-not $r) { 'no reservation in the scope' } elseif (-not $a) { 'prn01.clinic.lab does not resolve' }
elseif (-not ($r.IPAddress.IPAddressToString -contains $a)) { "no reservation for prn01's address $a" } else { 'True' }
'''
[[check]]
section = "Server"
name = "DNS: a reverse lookup zone for 10.10.10.0/24; 10.10.10.10 looks up to DC01"
node = "dc01"
script = '''
$z = Get-DnsServerZone -Name '10.10.10.in-addr.arpa' -ErrorAction SilentlyContinue
$p = Resolve-DnsName 10.10.10.10 -Type PTR -ErrorAction SilentlyContinue | Where-Object Type -eq 'PTR'
if (-not $z) { 'no reverse lookup zone 10.10.10.in-addr.arpa' } elseif ($p.NameHost -notmatch '^dc01\.') { 'no PTR record for 10.10.10.10' } else { 'True' }
'''
[[check]]
section = "Server"
name = "DNS: gw.clinic.lab is the router (10.10.10.1), files.clinic.lab an alias of DC01"
node = "dc01"
script = '''
$gw = (Resolve-DnsName gw.clinic.lab -Type A -ErrorAction SilentlyContinue | Where-Object Type -eq 'A').IPAddress
$c = Get-DnsServerResourceRecord -ZoneName clinic.lab -Name files -RRType CName -ErrorAction SilentlyContinue
if ($gw -ne '10.10.10.1') { 'gw.clinic.lab is not 10.10.10.1' } elseif (-not $c -or $c.RecordData.HostNameAlias -notmatch '^dc01\.') { 'no CNAME files pointing to dc01' } else { 'True' }
'''
[[check]]
section = "Desktops"
name = "PC01 takes its address from DHCP, on the staff network"
node = "pc01"
script = "[bool](Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.PrefixOrigin -eq 'Dhcp' -and $_.IPAddress -like '10.10.10.*' })"
[[check]]
section = "Desktops"
name = "PC02 reaches the file server by name: files.clinic.lab answers on SMB"
node = "pc02"
script = "[bool](Test-NetConnection files.clinic.lab -Port 445 -InformationLevel Quiet -WarningAction SilentlyContinue)"

# ---- what the client asks for once the work is under way
[[change]]
id = "exam2-pc"
after = 0.5
from = "Tom Weiss"
letter = "Our second doctor starts next month: can you put a PC in Exam room 2 as well? Call it PC04, on the staff network like the others."

  [[change.need]]
  id = "exam2-pc"
  kind = "devices"
  device = "pc"
  rooms = ["exam2"]
  ids = ["pc04"]
  text = "Change order: PC04 in Exam room 2, connected"

  [[change.need]]
  id = "exam2-vlan"
  kind = "vlan"
  tag = 10
  name = "STAFF"
  ids = ["pc04"]
  text = "Change order: PC04 on VLAN 10 (STAFF)"

[[change]]
id = "rename-reception"
after = 0.8
from = "Tom Weiss"
letter = "Our insurer's audit wants PC names that say where a PC is. Please rename PC01 at reception to RECEP-01, in Windows and everywhere else, so nothing still knows it by its old name. The printer stays on it."

  [[change.check]]
  replaces = "PC01 is called PC01 in Windows, and is in clinic.lab"
  section = "Change order"
  name = "Change order: the reception PC is called RECEP-01 in Windows, still in clinic.lab and trusted by it"
  node = "pc01"
  script = '''
$c = Get-CimInstance Win32_ComputerSystem
if ($c.Name -ne 'RECEP-01') { "Windows calls this PC $($c.Name): the client's name is RECEP-01" }
elseif ($c.Domain -ne 'clinic.lab') { "it is in $($c.Domain), not clinic.lab" }
elseif (-not (Test-ComputerSecureChannel)) { 'its trust with the domain is broken: rename a domain member with Rename-Computer -DomainCredential, not offline' }
else { 'True' }
'''
  hint = "Rename-Computer -NewName RECEP-01 -DomainCredential CLINIC\\Administrator -Restart renames the computer account in AD too."

  [[change.check]]
  replaces = "AD and DNS know each PC by its name, once; nothing left of an old name"
  section = "Change order"
  name = "Change order: AD and DNS know RECEP-01, PC02 and PC03, once each; nothing left of PC01"
  node = "dc01"
  script = '''
$z = 'clinic.lab'
$bad = @(foreach ($n in 'RECEP-01','PC02','PC03') {
  $a = @(Get-DnsServerResourceRecord -ZoneName $z -Name $n -RRType A -ErrorAction SilentlyContinue)
  if (-not (Get-ADComputer -Filter "Name -eq '$n'" -ErrorAction SilentlyContinue)) { "$n has no computer account" }
  elseif ($a.Count -eq 0) { "no A record for $n" }
  elseif ($a.Count -gt 1) { "$n has $($a.Count) A records (" + (($a | ForEach-Object { $_.RecordData.IPv4Address }) -join ', ') + ')' }
})
$old = @(Get-ADComputer -Filter "Name -like 'DESKTOP-*' -or Name -like 'WIN-*' -or Name -eq 'PC01'" -ErrorAction SilentlyContinue | ForEach-Object Name) +
       @(Get-DnsServerResourceRecord -ZoneName $z -RRType A -ErrorAction SilentlyContinue | Where-Object { $_.HostName -match '^(DESKTOP|WIN)-|^PC01$' } | ForEach-Object HostName)
$old = @($old | Where-Object { $_ } | Sort-Object -Unique)
if ($old) { $bad += 'names left over from before a rename: ' + ($old -join ', ') }
if ($bad) { $bad -join '; ' } else { 'True' }
'''
  hint = "After a rename the old A record stays until scavenging removes it: delete pc01 from the clinic.lab zone (and its PTR) by hand, or turn on aging and scavenging."

  [[change.check]]
  replaces = "PC01, PC02 and PC03 joined, in OU Clinic PCs"
  section = "Change order"
  name = "Change order: RECEP-01, PC02 and PC03 joined, in OU Clinic PCs"
  node = "dc01"
  script = '''
$bad = foreach ($c in 'RECEP-01','PC02','PC03') {
  $a = Get-ADComputer -Filter "Name -eq '$c'" -ErrorAction SilentlyContinue
  if (-not $a) { "$c not joined" } elseif ($a.DistinguishedName -notmatch 'OU=Clinic PCs,') { "$c not in OU Clinic PCs" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''

