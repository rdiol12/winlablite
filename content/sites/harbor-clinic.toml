# ---- inside the machines
[[check]]
section = "Server"
name = "DC01 is the domain controller of clinic.lab"
node = "dc01"
script = "(Get-ADDomain -ErrorAction SilentlyContinue).DNSRoot"
expect = "clinic.lab"
weight = 2
hint = "Install AD DS and promote DC01 to a new forest clinic.lab."
[[check]]
section = "Server"
name = "DC01 has the static address 10.10.10.10"
node = "dc01"
script = "[bool](Get-NetIPAddress -AddressFamily IPv4 -IPAddress 10.10.10.10 -ErrorAction SilentlyContinue | Where-Object PrefixOrigin -eq 'Manual')"
[[check]]
section = "Server"
name = "DHCP on DC01: a scope 10.10.10.0 with the router and DC01 as DNS, authorized in AD"
node = "dc01"
script = '''
$s = Get-DhcpServerv4Scope -ScopeId 10.10.10.0 -ErrorAction SilentlyContinue
if (-not $s) { 'no scope 10.10.10.0' } elseif ($s.State -ne 'Active') { 'the scope is not active' } else {
  $o = @{}; Get-DhcpServerv4OptionValue -ScopeId 10.10.10.0 -ErrorAction SilentlyContinue | ForEach-Object { $o[$_.OptionId] = $_.Value -join ',' }
  $srv = Get-DhcpServerv4OptionValue -ErrorAction SilentlyContinue | Where-Object OptionId -eq 6
  $dns = if ($o[6]) { $o[6] } else { ($srv.Value -join ',') }
  if ($o[3] -notmatch '10\.10\.10\.1$') { 'option 3 (router) is not 10.10.10.1' }
  elseif ($dns -notmatch '10\.10\.10\.10') { 'option 6 (DNS) does not name 10.10.10.10' }
  elseif (-not (Get-DhcpServerInDC -ErrorAction SilentlyContinue)) { 'the DHCP server is not authorized in AD' }
  else { 'True' }
}
'''
weight = 2
[[check]]
section = "Server"
name = "PRN01 is known in DNS (prn01.clinic.lab)"
node = "dc01"
script = "[bool](Resolve-DnsName prn01.clinic.lab -Type A -ErrorAction SilentlyContinue)"
[[check]]
section = "Server"
name = "Nightly Windows Server Backup of DC01 with system state"
node = "dc01"
script = "$p = Get-WBPolicy -ErrorAction SilentlyContinue; [bool]($p -and $p.Schedule -and (Get-WBSystemState -Policy $p))"
hint = "Install Windows Server Backup, give it a backup disk (a data disk from the machine's parts), and schedule a daily backup with system state."
[[check]]
section = "Active Directory"
name = "OUs Staff and Clinic PCs"
node = "dc01"
script = "[bool](Get-ADOrganizationalUnit -Filter \"Name -eq 'Staff'\") -and [bool](Get-ADOrganizationalUnit -Filter \"Name -eq 'Clinic PCs'\")"
[[check]]
section = "Active Directory"
name = "maya.levin, noa.peretz, tom.weiss and lior.katz: enabled, in OU Staff"
node = "dc01"
script = '''
$bad = foreach ($u in 'maya.levin','noa.peretz','tom.weiss','lior.katz') {
  $a = Get-ADUser -Filter "SamAccountName -eq '$u'" -ErrorAction SilentlyContinue
  if (-not $a) { "$u missing" } elseif (-not $a.Enabled) { "$u disabled" } elseif ($a.DistinguishedName -notmatch 'OU=Staff,') { "$u not in OU Staff" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''
weight = 2
[[check]]
section = "Active Directory"
name = "Groups Doctors, Reception, Management and Lab with the right person in each"
node = "dc01"
script = '''
$want = @{ Doctors = 'maya.levin'; Reception = 'noa.peretz'; Management = 'tom.weiss'; Lab = 'lior.katz' }
$bad = foreach ($g in $want.Keys) {
  $m = Get-ADGroupMember -Identity $g -ErrorAction SilentlyContinue | Select-Object -ExpandProperty SamAccountName
  if ($null -eq $m) { "group $g missing or empty" } elseif ($m -notcontains $want[$g]) { "$($want[$g]) not in $g" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''
weight = 2
[[check]]
section = "Active Directory"
name = "PC01, PC02 and PC03 joined, in OU Clinic PCs"
node = "dc01"
script = '''
$bad = foreach ($c in 'PC01','PC02','PC03') {
  $a = Get-ADComputer -Filter "Name -eq '$c'" -ErrorAction SilentlyContinue
  if (-not $a) { "$c not joined" } elseif ($a.DistinguishedName -notmatch 'OU=Clinic PCs,') { "$c not in OU Clinic PCs" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''
[[check]]
section = "Files"
name = "Records share: Doctors change, Reception read, nobody else"
node = "dc01"
script = '''
$s = Get-SmbShare -Name Records -ErrorAction SilentlyContinue
if (-not $s) { 'no share Records' } else {
  $acl = (Get-Acl $s.Path).Access | Where-Object AccessControlType -eq 'Allow'
  $d = $acl | Where-Object { $_.IdentityReference -match '\\Doctors$' -and $_.FileSystemRights -match 'Modify|FullControl' }
  $r = $acl | Where-Object { $_.IdentityReference -match '\\Reception$' }
  $rw = $r | Where-Object { $_.FileSystemRights -match 'Modify|FullControl|Write' }
  $other = $acl | Where-Object { $_.IdentityReference -match '^(Everyone|BUILTIN\\Users|NT AUTHORITY\\Authenticated Users)$' }
  if (-not $d) { 'Doctors cannot change it' } elseif (-not $r) { 'Reception cannot read it' } elseif ($rw) { 'Reception can change it' }
  elseif ($other) { 'others still have access: ' + (($other.IdentityReference | Select-Object -Unique) -join ', ') } else { 'True' }
}
'''
weight = 2
hint = "Turn off inheritance on the folder, remove Users, and grant Doctors Modify and Reception Read & execute."
[[check]]
section = "Files"
name = "Lab share: the Lab group can change it"
node = "dc01"
script = '''
$s = Get-SmbShare -Name Lab -ErrorAction SilentlyContinue
if (-not $s) { 'no share Lab' } else {
  [bool]((Get-Acl $s.Path).Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.IdentityReference -match '\\Lab$' -and $_.FileSystemRights -match 'Modify|FullControl' })
}
'''
[[check]]
section = "Policies"
name = "A GPO linked to Clinic PCs locks the screen after 5 minutes"
node = "dc01"
script = '''
$ou = Get-ADOrganizationalUnit -Filter "Name -eq 'Clinic PCs'" -ErrorAction SilentlyContinue
if (-not $ou) { 'no OU Clinic PCs' } else {
  $hit = foreach ($l in (Get-GPInheritance -Target $ou.DistinguishedName).InheritedGpoLinks) {
    $v = Get-GPRegistryValue -Guid $l.GpoId -Key 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System' -ValueName InactivityTimeoutSecs -ErrorAction SilentlyContinue
    if ($v -and [int]$v.Value -gt 0 -and [int]$v.Value -le 300) { $l.DisplayName }
  }
  if ($hit) { 'True' } else { 'no GPO applying to Clinic PCs sets Interactive logon: Machine inactivity limit to 300 seconds or less' }
}
'''
weight = 2
[[check]]
section = "Policies"
name = "A GPO maps R: to the Records share"
node = "dc01"
script = '''
$f = Get-ChildItem "C:\Windows\SYSVOL\domain\Policies" -Recurse -Filter Drives.xml -ErrorAction SilentlyContinue | Where-Object { (Get-Content -Raw $_.FullName) -match 'letter="R"' -and (Get-Content -Raw $_.FullName) -match '\\Records' }
[bool]$f
'''
hint = "Group Policy Preferences: User Configuration > Preferences > Windows Settings > Drive Maps, R: to \\\\dc01\\Records, targeted at the Doctors group."
[[check]]
section = "Policies"
name = "Domain passwords at least 12 characters, lockout after 5 tries"
node = "dc01"
script = "$p = Get-ADDefaultDomainPasswordPolicy; [bool]($p.MinPasswordLength -ge 12 -and $p.LockoutThreshold -ge 1 -and $p.LockoutThreshold -le 5)"
