# A client job (winlab/campus.py): a small medical practice of two buildings
# across a car park. Coordinates are metres; a building's rooms, points,
# closets and tray are measured from its own top-left corner.

[job]
id = "harbor-clinic"
title = "Harbor Street Clinic"
client = "Harbor Street Family Clinic"
contact = "Tom Weiss, practice manager"
level = 1
domain = "clinic.lab"
summary = "A family practice and its lab annex across the car park: cabling, fibre, switches, VLANs, Wi-Fi, cameras, a domain controller, users, shares and policies."
label_scheme = "{closet}-{panel}-{port:02}"
budget = 22000
width = 150
height = 100
brief = """
Hello,

We have bought the old insurance office on Harbor Street and the small
building across the car park, and we open in three weeks. Nothing is wired:
the walls have empty jack plates and the ceilings have mounting plates, the
comms room is an empty rack, and there is a duct under the car park to the
annex's plant room.

What we need from you:

Cabling. Every wall jack in both buildings cabled back to its building's
comms room, tested and patched in. Our insurer wants a test result for every
cable. The annex is joined to the main building by fibre, not copper.

Network. Two networks kept apart: STAFF (VLAN 10, 10.10.10.0/24) for our
PCs, printer, Wi-Fi and the server, and CCTV (VLAN 20, 10.10.20.0/24) for the
cameras only. The router is the gateway on .1 of each. The cameras get their
addresses from the router; the staff network's addresses come from our
server's DHCP.

Wi-Fi. Staff Wi-Fi called Harbor-Staff (WPA2) in every room of both buildings.

Cameras. The front door, the back door, the car park and the annex door.
Cameras are powered from the switch (PoE); we do not want power bricks.

Server. One Windows Server called DC01 in the comms room, 10.10.10.10. It is
the domain controller of clinic.lab, our DNS and DHCP server, and the file
server. Back it up every night, system state included.

People. Our staff, each with their own account (first.last), in an OU
called Staff:
  Dr Maya Levin (doctor), Noa Peretz (reception), Tom Weiss (practice
  manager), Lior Katz (lab technician).
Groups Doctors, Reception, Management and Lab, one person each for now.

Files. A Records share only doctors can change and reception can read (no
one else), and a Lab share the lab group can change. Doctors get the
Records share as their R: drive automatically.

PCs. PC01 at reception, PC02 in my office, PC03 in the annex lab, all in the
domain, in an OU called Clinic PCs. Screens lock after 5 minutes of no use
(a policy, not a setting on each PC). The reception printer is PRN01, known
by that name in DNS, and installed on PC01.

Passwords at least 12 characters; an account locks after 5 wrong tries.

Addresses and names. The PCs take their addresses from DHCP, never typed
in. Keep 10.10.10.1 to 10.10.10.20 out of the pool for fixed addresses, and
give the printer a reservation so it keeps its address. The DHCP options
give the router, DC01 as DNS and the domain name clinic.lab. In DNS we want
the router as gw.clinic.lab, the file server also known as files.clinic.lab,
and a reverse lookup zone so our addresses look up to names.

Share and folder rights. Give the shares themselves no Everyone Full Control:
the folder (NTFS) rights decide who does what. Records hides what a person
cannot open (access-based enumeration).

Thanks,
Tom Weiss, practice manager
"""

