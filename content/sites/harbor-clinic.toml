[[check]]
section = "Active Directory"
name = "AD and DNS know each PC by its name, once; nothing left of an old name"
node = "dc01"
script = '''
$z = 'clinic.lab'
$bad = @(foreach ($n in 'PC01','PC02','PC03') {
  $a = @(Get-DnsServerResourceRecord -ZoneName $z -Name $n -RRType A -ErrorAction SilentlyContinue)
  if (-not (Get-ADComputer -Filter "Name -eq '$n'" -ErrorAction SilentlyContinue)) { "$n has no computer account" }
  elseif ($a.Count -eq 0) { "no A record for $n" }
  elseif ($a.Count -gt 1) { "$n has $($a.Count) A records (" + (($a | ForEach-Object { $_.RecordData.IPv4Address }) -join ', ') + ')' }
})
$old = @(Get-ADComputer -Filter "Name -like 'DESKTOP-*' -or Name -like 'WIN-*'" -ErrorAction SilentlyContinue | ForEach-Object Name) +
       @(Get-DnsServerResourceRecord -ZoneName $z -RRType A -ErrorAction SilentlyContinue | Where-Object { $_.HostName -match '^(DESKTOP|WIN)-' } | ForEach-Object HostName)
$old = @($old | Where-Object { $_ } | Sort-Object -Unique)
if ($old) { $bad += 'names left over from before a rename: ' + ($old -join ', ') }
if ($bad) { $bad -join '; ' } else { 'True' }
'''
hint = "A PC installed by hand comes up as DESKTOP-something: rename it before it joins (or with Rename-Computer after), then delete what the old name left behind: its computer account in AD and its A record in DNS."
