'''

[[check]]
section = "Policies"
name = "Students cannot open Control Panel or Settings (a GPO on OU Students)"
node = "dc01"
script = '''
$ou = Get-ADOrganizationalUnit -Filter "Name -eq 'Students'" -ErrorAction SilentlyContinue
if (-not $ou) { 'no OU Students' } else {
  $hit = foreach ($l in (Get-GPInheritance -Target $ou.DistinguishedName).InheritedGpoLinks) {
    $v = Get-GPRegistryValue -Guid $l.GpoId -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer' -ValueName NoControlPanel -ErrorAction SilentlyContinue
    if ($v -and [int]$v.Value -eq 1) { $l.DisplayName }
  }
  if ($hit) { 'True' } else { 'no GPO applying to Students sets Prohibit access to Control Panel and PC settings' }
}
'''
weight = 2

[[check]]
section = "Policies"
name = "Lab PCs lock after 10 minutes"
node = "dc01"
script = '''
$ou = Get-ADOrganizationalUnit -Filter "Name -eq 'Lab PCs'" -ErrorAction SilentlyContinue
if (-not $ou) { 'no OU Lab PCs' } else {
  $hit = foreach ($l in (Get-GPInheritance -Target $ou.DistinguishedName).InheritedGpoLinks) {
    $v = Get-GPRegistryValue -Guid $l.GpoId -Key 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System' -ValueName InactivityTimeoutSecs -ErrorAction SilentlyContinue
    if ($v -and [int]$v.Value -gt 0 -and [int]$v.Value -le 600) { $l.DisplayName }
  }
  if ($hit) { 'True' } else { 'no GPO on Lab PCs sets the machine inactivity limit to 600 seconds or less' }
}
'''

