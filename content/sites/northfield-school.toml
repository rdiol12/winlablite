# A client job (winlab/campus.py): a school of three buildings, the sports
# hall far across the playing field. Coordinates are metres.

[job]
id = "northfield-school"
title = "Northfield School"
client = "Northfield Secondary School"
contact = "Rina Golan, school business manager"
level = 2
domain = "school.lab"
summary = "Three buildings, one of them 450 m of duct away: singlemode fibre, staff and student networks kept apart, a computer lab, Wi-Fi, cameras, a domain with teachers and students, shares, home folders, a print server and locked-down student desktops."
label_scheme = "{closet}/{panel}/{port:02}"
budget = 33000
width = 320
height = 222
brief = '''
Dear installer,

Northfield is moving out of the old portable classrooms into the main block,
the library and the sports hall, and the council has signed off the
cabling budget. Please take the site from bare walls to working IT.

Cabling. Every wall jack in all three buildings cabled to its building's
comms room, tested and patched. The library and the sports hall link to the
main comms room over fibre. Note that the duct to the sports hall goes all
the way round the playing field: our surveyor measured it at about 450 m.

Network. Three networks, kept apart:
  STAFF     VLAN 10, 10.20.10.0/24: office and staff PCs, the printer, Wi-Fi, the server
  STUDENTS  VLAN 20, 10.20.20.0/24: the computer lab and library PCs
  CCTV      VLAN 30, 10.20.30.0/24: cameras only, addresses from the router
The router is .1 on each. Staff and student addresses come from the server.

Wi-Fi. Northfield-Staff (WPA2) in every classroom, the staff room, the
office, the library and the sports hall.

Cameras. The main entrance, the car park and the sports hall door, powered
from the switches.

Servers. Two, in the main comms room. DC01, 10.20.10.10: domain controller
of school.lab, DNS, DHCP for staff and students, and the print server.
FS01, 10.20.10.11: the file server, a member of the domain. Fixed addresses
for both; everything else gets its address from DHCP.

People. Teachers Anna Berg and David Cohen, office manager Rina Golan, and
two student accounts to start with, Sara Levi and Omer Dahan (first.last).
OUs Staff and Students; groups Teachers, Office and Students.

Files. Homework: teachers change it, students read it. Staff: teachers and
the office only, students no access at all. Every student has a home folder
on FS01 (\\FS01\Home\username) on their H: drive. The shares give no one
Everyone Full Control: the folders' own (NTFS) rights decide, and Staff
hides itself from those who cannot open it (access-based enumeration).

Addresses and names. Keep .1 to .20 of the staff and student networks out
of the DHCP pools; both scopes hand out the router, DC01 as DNS and the
domain name school.lab, and the printer has a reservation. DNS needs
reverse lookup zones for both networks and files.school.lab as another
name for FS01.

Printing. The staff room printer PRN01 is shared from DC01 as StaffPrinter,
and the staff PC uses it from there.

PCs. LAB01 and LAB02 in the computer lab and LIB01 in the library are
student PCs (OU Lab PCs); OFFICE01 in the office and STAFF01 in the staff
room are staff PCs (OU Office PCs). All in the domain.
Students may not open Control Panel or Settings. Lab PCs lock after 10
minutes. Passwords at least 10 characters.

Kind regards,
Rina Golan
'''

