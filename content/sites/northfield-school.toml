# ---- the file server, shares, DHCP and DNS done as a network admin would
[[check]]
section = "Server"
name = "FS01 is a member of school.lab with the fixed address 10.20.10.11"
node = "fs01"
script = '''
$cs = Get-CimInstance Win32_ComputerSystem
$ip = Get-NetIPAddress -AddressFamily IPv4 -IPAddress 10.20.10.11 -ErrorAction SilentlyContinue | Where-Object PrefixOrigin -eq 'Manual'
if ($cs.Domain -ne 'school.lab' -or -not $cs.PartOfDomain) { 'FS01 is not in school.lab' } elseif (-not $ip) { 'FS01 does not have 10.20.10.11 set by hand' }
elseif (((Get-DnsClientServerAddress -AddressFamily IPv4 | Where-Object ServerAddresses).ServerAddresses -join ',') -notmatch '10\.20\.10\.10') { 'FS01 does not use DC01 for DNS' } else { 'True' }
'''
weight = 2
[[check]]
section = "Files"
name = "Homework and Staff shares: no Everyone Full Control on the shares; NTFS rights decide"
node = "fs01"
script = '''
$bad = foreach ($n in 'Homework','Staff') {
  $a = Get-SmbShareAccess -Name $n -ErrorAction SilentlyContinue
  if (-not $a) { "no share $n" } elseif ($a | Where-Object { $_.AccountName -match '^Everyone$' -and $_.AccessRight -eq 'Full' -and $_.AccessControlType -eq 'Allow' }) { "$n gives Everyone Full Control" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''
[[check]]
section = "Files"
name = "Staff hides itself from those who cannot open it (access-based enumeration)"
node = "fs01"
script = "[string](Get-SmbShare -Name Staff -ErrorAction SilentlyContinue).FolderEnumerationMode"
expect = "AccessBased"
[[check]]
section = "Server"
name = "Both DHCP scopes hand out DC01 as DNS and the domain name school.lab"
node = "dc01"
script = '''
$bad = foreach ($n in '10.20.10','10.20.20') {
  $o = @{}; Get-DhcpServerv4OptionValue -ErrorAction SilentlyContinue | ForEach-Object { $o[$_.OptionId] = $_.Value -join ',' }
  Get-DhcpServerv4OptionValue -ScopeId "$n.0" -ErrorAction SilentlyContinue | ForEach-Object { $o[$_.OptionId] = $_.Value -join ',' }
  if ($o[6] -notmatch '10\.20\.10\.10') { "scope $n.0: option 6 (DNS) is not DC01" } elseif ($o[15] -notmatch 'school\.lab') { "scope $n.0: no option 15 school.lab" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''
[[check]]
section = "Server"
name = "DHCP keeps .1 to .20 out of both pools; PRN01 has a reservation"
node = "dc01"
script = '''
$n = { param($ip) $b = ([ipaddress]$ip).GetAddressBytes(); [array]::Reverse($b); [BitConverter]::ToUInt32($b, 0) }
$bad = foreach ($net in '10.20.10','10.20.20') {
  $s = Get-DhcpServerv4Scope -ScopeId "$net.0" -ErrorAction SilentlyContinue
  $hi = & $n "$net.20"; $lo = & $n "$net.1"
  $cut = Get-DhcpServerv4ExclusionRange -ScopeId "$net.0" -ErrorAction SilentlyContinue | Where-Object { (& $n $_.StartRange) -le $lo -and (& $n $_.EndRange) -ge $hi }
  if (-not $s) { "no scope $net.0" } elseif (-not ((& $n $s.StartRange) -gt $hi -or $cut)) { "scope $net.0 still hands out .1 to .20" }
}
$a = (Resolve-DnsName prn01.school.lab -Type A -ErrorAction SilentlyContinue | Where-Object Type -eq 'A').IPAddress
$r = Get-DhcpServerv4Reservation -ScopeId 10.20.10.0 -ErrorAction SilentlyContinue
if (-not $a) { $bad += 'prn01.school.lab does not resolve' } elseif (-not ($r.IPAddress.IPAddressToString -contains $a)) { $bad += "no reservation for prn01's address $a" }
if ($bad) { $bad -join '; ' } else { 'True' }
'''
weight = 2
[[check]]
section = "Server"
name = "DNS: reverse lookup zones for 10.20.10.0/24 and 10.20.20.0/24; files.school.lab an alias of FS01"
node = "dc01"
script = '''
$miss = '10.20.10.in-addr.arpa','10.20.20.in-addr.arpa' | Where-Object { -not (Get-DnsServerZone -Name $_ -ErrorAction SilentlyContinue) }
$c = Get-DnsServerResourceRecord -ZoneName school.lab -Name files -RRType CName -ErrorAction SilentlyContinue
if ($miss) { 'no reverse zone ' + ($miss -join ', ') } elseif (-not $c -or $c.RecordData.HostNameAlias -notmatch '^fs01\.') { 'no CNAME files pointing to fs01' }
elseif ((Resolve-DnsName 10.20.10.11 -Type PTR -ErrorAction SilentlyContinue).NameHost -notmatch '^fs01\.') { 'no PTR record for FS01' } else { 'True' }
'''
weight = 2
[[check]]
section = "Desktops"
name = "LAB01 takes its address from DHCP on the student network"
node = "lab01"
script = "[bool](Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.PrefixOrigin -eq 'Dhcp' -and $_.IPAddress -like '10.20.20.*' })"
[[check]]
section = "Desktops"
name = "LIB01 reaches the file server by name: files.school.lab answers on SMB"
node = "lib01"
script = "[bool](Test-NetConnection files.school.lab -Port 445 -InformationLevel Quiet -WarningAction SilentlyContinue)"

