script = '''
$c = Get-CimInstance Win32_ComputerSystem
if ($c.Name -ne 'OFFICE01') { "Windows calls this PC $($c.Name): the client's name is OFFICE01" }
elseif ($c.Domain -ne 'school.lab') { "it is in $($c.Domain), not school.lab" }
