name = "DC01 is the domain controller of school.lab"
node = "dc01"
script = '''
(Get-ADDomain -ErrorAction SilentlyContinue).DNSRoot
'''
expect = "school.lab"
weight = 2

[[check]]
section = "Server"
name = "DC01 has the static address 10.20.10.10"
node = "dc01"
script = '''
[bool](Get-NetIPAddress -AddressFamily IPv4 -IPAddress 10.20.10.10 -ErrorAction SilentlyContinue | Where-Object PrefixOrigin -eq 'Manual')
'''

[[check]]
section = "Server"
name = "DHCP scopes for staff (10.20.10.0) and students (10.20.20.0), each with its router, authorized"
node = "dc01"
script = '''
$bad = foreach ($n in '10.20.10','10.20.20') {
  $s = Get-DhcpServerv4Scope -ScopeId "$n.0" -ErrorAction SilentlyContinue
  if (-not $s) { "no scope $n.0" } elseif ($s.State -ne 'Active') { "scope $n.0 not active" }
  elseif (((Get-DhcpServerv4OptionValue -ScopeId "$n.0" -ErrorAction SilentlyContinue | Where-Object OptionId -eq 3).Value -join ',') -notmatch "^$([regex]::Escape($n)).1$") { "scope $n.0 has no router $n.1" }
}
if (-not (Get-DhcpServerInDC -ErrorAction SilentlyContinue)) { $bad += 'not authorized in AD' }
if ($bad) { $bad -join '; ' } else { 'True' }
'''
weight = 2

[[check]]
section = "Active Directory"
name = "OUs Staff, Students, Lab PCs and Office PCs"
node = "dc01"
script = '''
$miss = 'Staff','Students','Lab PCs','Office PCs' | Where-Object { -not (Get-ADOrganizationalUnit -Filter "Name -eq '$_'" -ErrorAction SilentlyContinue) }
if ($miss) { 'missing: ' + ($miss -join ', ') } else { 'True' }
'''

[[check]]
section = "Active Directory"
name = "Teachers and office in OU Staff, students in OU Students, in their groups"
node = "dc01"
script = '''
$want = @{ 'anna.berg' = 'Staff,Teachers'; 'david.cohen' = 'Staff,Teachers'; 'rina.golan' = 'Staff,Office'; 'sara.levi' = 'Students,Students'; 'omer.dahan' = 'Students,Students' }
$bad = foreach ($u in $want.Keys) {
  $ou, $g = $want[$u].Split(',')
  $a = Get-ADUser -Filter "SamAccountName -eq '$u'" -Properties MemberOf -ErrorAction SilentlyContinue
  if (-not $a) { "$u missing" } elseif ($a.DistinguishedName -notmatch "OU=$ou,") { "$u not in OU $ou" }
  elseif (-not ($a.MemberOf | Where-Object { $_ -match "^CN=$g," })) { "$u not in group $g" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''
weight = 2

[[check]]
section = "Active Directory"
name = "Lab and library PCs in OU Lab PCs, staff PCs in OU Office PCs"
node = "dc01"
script = '''
$want = @{ LAB01 = 'Lab PCs'; LAB02 = 'Lab PCs'; LIB01 = 'Lab PCs'; OFFICE01 = 'Office PCs'; STAFF01 = 'Office PCs' }
$bad = foreach ($c in $want.Keys) {
  $a = Get-ADComputer -Filter "Name -eq '$c'" -ErrorAction SilentlyContinue
  if (-not $a) { "$c not joined" } elseif ($a.DistinguishedName -notmatch "OU=$($want[$c]),") { "$c not in OU $($want[$c])" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''
weight = 2

[[check]]
section = "Files"
name = "Homework share: Teachers change, Students read only"
node = "fs01"
script = '''
$s = Get-SmbShare -Name Homework -ErrorAction SilentlyContinue
if (-not $s) { 'no share Homework' } else {
  $acl = (Get-Acl $s.Path).Access | Where-Object AccessControlType -eq 'Allow'
  $t = $acl | Where-Object { $_.IdentityReference -match '\\Teachers$' -and $_.FileSystemRights -match 'Modify|FullControl' }
  $st = $acl | Where-Object { $_.IdentityReference -match '\\Students$' }
  $sw = $st | Where-Object { $_.FileSystemRights -match 'Modify|FullControl|Write' }
  if (-not $t) { 'Teachers cannot change it' } elseif (-not $st) { 'Students cannot read it' } elseif ($sw) { 'Students can change it' } else { 'True' }
}
'''
weight = 2

[[check]]
section = "Files"
name = "Staff share: Teachers and Office only, no student access"
node = "fs01"
script = '''
$s = Get-SmbShare -Name Staff -ErrorAction SilentlyContinue
if (-not $s) { 'no share Staff' } else {
  $acl = (Get-Acl $s.Path).Access | Where-Object AccessControlType -eq 'Allow'
  $who = $acl.IdentityReference.Value
  if (-not ($who -match '\\Teachers$')) { 'Teachers have no access' } elseif (-not ($who -match '\\Office$')) { 'Office has no access' }
  elseif ($who -match '\\Students$|^Everyone$|^BUILTIN\\Users$|Authenticated Users') { 'students (or everyone) can still get in' } else { 'True' }
}
'''
weight = 2

[[check]]
section = "Files"
name = "Students' accounts have H: on \\\\FS01\\Home"
node = "dc01"
script = '''
$bad = foreach ($u in 'sara.levi','omer.dahan') {
  $a = Get-ADUser $u -Properties HomeDirectory, HomeDrive -ErrorAction SilentlyContinue
  if (-not $a) { "$u missing" } elseif ($a.HomeDrive -ne 'H:' -or $a.HomeDirectory -notmatch '^\\\\(fs01|files)(\.school\.lab)?\\Home\\') { "$u has no H: home folder on \\FS01\Home" }
}
if ($bad) { $bad -join '; ' } else { 'True' }
'''

[[check]]
section = "Files"
name = "FS01: the Home share, a folder for each student that only they (and admins) open"
node = "fs01"
script = '''
$h = Get-SmbShare -Name Home -ErrorAction SilentlyContinue
if (-not $h) { 'no share Home on FS01' } else {
  $bad = foreach ($u in 'sara.levi','omer.dahan') {
    $p = Join-Path $h.Path $u
    if (-not (Test-Path $p)) { "no folder $u" } else {
      $acl = (Get-Acl $p).Access | Where-Object AccessControlType -eq 'Allow'
      if (-not ($acl | Where-Object { $_.IdentityReference -match "\\$u$" })) { "$u has no rights on their folder" }
      elseif ($acl | Where-Object { $_.IdentityReference -match '\\Students$|^BUILTIN\\Users$|^Everyone$' -and $_.FileSystemRights -match 'Read|Modify|FullControl' }) { "other students can open $u's folder" }
    }
  }
  if ($bad) { $bad -join '; ' } else { 'True' }
}
'''

[[check]]
section = "Printing"
name = "PRN01 shared from DC01 as StaffPrinter"
node = "dc01"
script = '''
[bool](Get-Printer -ErrorAction SilentlyContinue | Where-Object { $_.Shared -and $_.ShareName -eq 'StaffPrinter' })
'''
hint = "Add the Print and Document Services role, add PRN01 as a TCP/IP printer and share it as StaffPrinter."

[[check]]
